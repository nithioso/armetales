<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  /* Layout específico de la parametrización de rutas (tokens y componentes viven en app.css) */
  .kpi-row { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
  @media (max-width: 639px) { .kpi-row { grid-template-columns: repeat(2, minmax(0, 1fr)); } .kpi .kpi-value { font-size: 26px; } .kpi { padding: 12px; } }
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .toolbar .search { flex: 1 1 260px; max-width: 420px; }
  .toolbar .select { width: auto; min-width: 150px; }
  .toolbar .ml-auto { margin-left: auto; }
  .route-grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); }
  .rcard { display: flex; flex-direction: column; gap: 14px; padding: 16px; text-align: left; width: 100%; font: inherit; color: inherit; cursor: pointer; transition: border-color .15s, box-shadow .15s; }
  .rcard:hover { border-color: color-mix(in srgb, var(--steel) 50%, var(--border)); box-shadow: var(--shadow-2, 0 4px 14px rgba(0,0,0,.08)); }
  .rcard:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .rc-top { display: flex; align-items: flex-start; gap: 12px; }
  .rc-name { font-family: var(--font-display); font-weight: 600; font-size: 19px; line-height: 1.2; }
  .rc-sketch { width: 100%; height: 76px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--border); }
  .rc-sketch path { fill: none; stroke: var(--steel); stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
  .rc-sketch circle { fill: var(--surface); stroke: var(--steel); stroke-width: 1.8; vector-effect: non-scaling-stroke; }
  .rc-sketch .o { fill: var(--ink); stroke: var(--surface); }
  .rc-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .rc-stats .v { font-family: var(--font-display); font-weight: 600; font-size: 20px; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .rc-stats .l { font-size: 12px; color: var(--text-2); }
  .rc-tags { display: flex; flex-wrap: wrap; gap: 4px; }
  .rc-foot { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; color: var(--text-2); border-top: 1px solid var(--border); padding-top: 10px; flex-wrap: wrap; }
  .rc-foot .rc-vig { flex-basis: 100%; }
  .rcard.is-off { opacity: .72; }
  .d-grid { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 900px) { .d-grid.c2 { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); } }
  .d-stats { display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  @media (min-width: 640px) { .d-stats { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
  .mini-stat { padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--r-ctl); background: var(--surface-2); }
  .mini-stat .v { font-family: var(--font-display); font-weight: 600; font-size: 22px; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .mini-stat .l { font-size: 12px; color: var(--text-2); }
  .d-map { --h: 340px; }
  .d-sec h3 { font-size: 15px; margin: 0 0 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .seq { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .seq li { display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 6px 8px 6px 6px; border: 1px solid var(--border); border-radius: var(--r-ctl); background: var(--surface); }
  .seq li.is-drop { box-shadow: 0 -2px 0 0 var(--blue); } .seq li.is-drag { opacity: .45; }
  .seq .n { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--steel); display: grid; place-items: center; font: 600 11.5px/1 var(--font-mono); }
  .seq .grip { width: 22px; height: 28px; border: 0; background: none; color: var(--text-2); cursor: grab; display: grid; place-items: center; padding: 0; border-radius: 6px; }
  .seq .nm { font-weight: 500; } .seq .sub { font-size: 12px; color: var(--text-2); }
  .seq .acts { display: flex; gap: 2px; } .seq .btn-icon { width: 28px; height: 28px; min-width: 28px; }
  .seq li.origin { background: var(--surface-2); } .seq li.origin .n { border-radius: 7px; background: var(--ink); border-color: var(--ink); color: #fff; }
  .add-row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; } .add-row .select { flex: 1 1 200px; }
  .tr-table { width: 100%; }
  .tr-table .inp { width: 84px; text-align: right; font-family: var(--font-mono); }
  .tr-table .pj { display: grid; gap: 6px; }
  .tr-table .pj-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .tr-table .pj-row .input { height: 30px; font-size: 13px; padding: 0 8px; }
  .tr-table tfoot td { font-weight: 600; background: var(--surface-2); }
  .toll-tag { display: inline-flex; gap: 6px; align-items: baseline; padding: 2px 8px; border-radius: 6px; background: var(--amber-bg); color: var(--amber-fg, var(--text)); font-size: 12.5px; }
  .toll-tag b { font-family: var(--font-mono); font-weight: 500; }
  .cov-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .ed-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
  .use-row { display: flex; gap: 10px; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13.5px; flex-wrap: wrap; }
  .use-row:last-child { border-bottom: 0; }
  .wiz-steps { display: flex; gap: 8px; margin-bottom: 16px; font-size: 12.5px; color: var(--text-2); flex-wrap: wrap; }
  .wiz-steps span { display: inline-flex; align-items: center; gap: 6px; } .wiz-steps b { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; border: 1.5px solid var(--border); font-size: 12px; }
  .wiz-steps .on { color: var(--text); font-weight: 600; } .wiz-steps .on b { background: var(--red); border-color: var(--red); color: #fff; } .wiz-steps .done b { background: var(--green); border-color: var(--green); color: #fff; }
  .wiz-nav { display: flex; justify-content: space-between; gap: 8px; margin-top: 20px; }
  .catalog { display: grid; gap: 6px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); max-height: 220px; overflow: auto; padding: 2px; }
  .catalog .check { padding: 6px 8px; border: 1px solid var(--border); border-radius: 8px; }
  .pick { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-height: 34px; }
  .pick .tag button { border: 0; background: none; padding: 0 0 0 4px; cursor: pointer; color: inherit; }
  .confirm-list { margin: 8px 0 0 18px; padding: 0; display: grid; gap: 4px; }
  .kpi, .kpi .kpi-foot, .kpi .kpi-note { white-space: normal; }
  :root[data-theme="dark"] a.btn { color: var(--b-fg); } /* el color de enlace del tema oscuro pisaba el de los botones-enlace */
</style>
</head>
<body data-page="rutas">
<main id="app">
  <header class="page-head">
    <div class="ph-text">
      <div class="page-eyebrow">Maestros</div>
      <h1 class="page-title">Parametrización de rutas</h1>
      <p class="page-desc">Define las rutas poblacionales con su secuencia de municipios, kilómetros, peajes y cobertura. Son la base de la planeación y del motor de rutas.</p>
    </div>
    <div class="page-actions"><a class="btn btn-secondary" href="motor-rutas.html">Abrir motor de rutas</a><button type="button" class="btn btn-primary" id="btnNew"></button></div>
  </header>

  <section aria-label="Resumen de rutas"><div class="kpi-row" id="kpiRow"></div></section>

  <section class="section" aria-label="Lista de rutas">
    <div class="toolbar mb-4">
      <div class="search"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><input class="input" type="search" id="q" placeholder="Buscar por ruta o municipio" aria-label="Buscar rutas"></div>
      <select class="select" id="fZona" aria-label="Filtrar por zona"></select>
      <select class="select" id="fEstado" aria-label="Filtrar por estado"></select>
      <div class="segmented ml-auto" role="group" aria-label="Vista" id="viewSeg"><button type="button" data-v="cards" aria-pressed="true">Tarjetas</button><button type="button" data-v="table" aria-pressed="false">Tabla</button></div>
    </div>
    <div id="listHost"></div>
  </section>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
UI.ready(function () {
  var A = ARM, F = UI.fmt, esc = UI.esc, $ = UI.$, $$ = UI.$$;
  var ZONAS = ['Manizales', 'Norte', 'Sur', 'Occidente', 'Oriente', 'Risaralda', 'Quindío', 'Magdalena'];
  var view = 'cards', filt = { q: '', zona: '', estado: '' };
  $('#btnNew').innerHTML = UI.icon('plus') + 'Crear ruta';

  function hav(a, b) { var R = 6371, t = Math.PI / 180, dLa = (b.lat - a.lat) * t, dLo = (b.lng - a.lng) * t, x = Math.sin(dLa / 2) * Math.sin(dLa / 2) + Math.cos(a.lat * t) * Math.cos(b.lat * t) * Math.sin(dLo / 2) * Math.sin(dLo / 2); return R * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1 - x)); }
  function r1(n) { return Math.round(n * 10) / 10; }
  function dur(m) { m = Math.round(m); return m < 60 ? m + ' min' : Math.floor(m / 60) + ' h ' + (m % 60 < 10 ? '0' : '') + (m % 60) + ' min'; }
  function sede(id) { return A.sedes.filter(function (s) { return s.id === id; })[0] || A.sedes[0]; }
  function estadoChip(e) { return UI.chip(e, { tone: e === 'Vigente' ? 'success' : e === 'En revisión' ? 'warning' : 'neutral' }); }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function sum(a, f) { return a.reduce(function (s, x) { return s + f(x); }, 0); }
  function vigente(r) { return F.fecha(r.vigenciaDesde) + ' – ' + F.fecha(r.vigenciaHasta); }

  /* catálogo de municipios con coordenadas (de las rutas existentes) */
  var CAT = {}; A.rutas.forEach(function (r) { r.secuencia.forEach(function (s) { if (!CAT[s.nombre]) CAT[s.nombre] = { nombre: s.nombre, lat: s.lat, lng: s.lng, key: s.municipioKey }; }); });
  var CATL = Object.keys(CAT).sort(function (a, b) { return a.localeCompare(b, 'es'); }).map(function (k) { return CAT[k]; });

  function trazadoOf(r) { return r.trazado && r.trazado.length ? r.trazado : [[sede(r.origenId).lat, sede(r.origenId).lng]].concat(r.secuencia.map(function (s) { return [s.lat, s.lng]; })); }
  function activos(r) {
    return { desp: A.despachos.filter(function (d) { return d.rutaId === r.rutaId && (d.estado === 'Cargando' || d.estado === 'En ruta'); }), viajes: A.plan.viajes.filter(function (v) { return v.rutaId === r.rutaId; }) };
  }
  function coverage(r) {
    var by = {}; A.clientes.filter(function (c) { return c.rutaId === r.rutaId; }).forEach(function (c) {
      var k = c.municipio; var o = by[k] || (by[k] = { municipio: k, locs: {}, n: 0 }); o.n++; o.locs[c.localidad || c.barrio || '—'] = 1;
    });
    return Object.keys(by).map(function (k) { return { municipio: k, locs: Object.keys(by[k].locs), n: by[k].n }; }).sort(function (a, b) { return b.n - a.n; });
  }

  /* ---------- resumen ---------- */
  function drawKpis() {
    var vig = A.rutas.filter(function (r) { return r.estado === 'Vigente'; }), mun = {}; A.rutas.forEach(function (r) { r.municipios.forEach(function (m) { mun[m] = 1; }); });
    var avgKm = A.rutas.length ? sum(A.rutas, function (r) { return r.kmIda; }) / A.rutas.length : 0, rev = A.rutas.filter(function (r) { return r.estado !== 'Vigente'; }).length;
    $('#kpiRow').innerHTML =
      UI.kpi({ label: 'Rutas vigentes', icon: 'route', value: vig.length, unit: 'de ' + A.rutas.length, note: rev ? rev + ' en revisión o inactivas' : 'Todas vigentes' }) +
      UI.kpi({ label: 'Municipios cubiertos', icon: 'map-pin', value: Object.keys(mun).length, note: 'Desde ' + A.sedes[0].nombre }) +
      UI.kpi({ label: 'Distancia media de ida', icon: 'navigation', valueHtml: F.num(avgKm, 1) + '<small>km</small>', note: 'Promedio por ruta' }) +
      UI.kpi({ label: 'Clientes con ruta', icon: 'users', value: sum(A.rutas, function (r) { return r.clientes; }), note: 'Asignados por municipio' });
  }

  /* ---------- lista ---------- */
  function filtered() {
    var q = UI.norm(filt.q);
    return A.rutas.filter(function (r) { return (!filt.zona || r.zona === filt.zona) && (!filt.estado || r.estado === filt.estado) && (!q || UI.norm(r.nombre + ' ' + r.rutaId + ' ' + r.municipios.join(' ')).indexOf(q) > -1); });
  }
  function sketch(r) {
    var pts = trazadoOf(r), la = pts.map(function (p) { return p[0]; }), lo = pts.map(function (p) { return p[1]; }), mnA = Math.min.apply(null, la), mxA = Math.max.apply(null, la), mnO = Math.min.apply(null, lo), mxO = Math.max.apply(null, lo);
    var W = 300, H = 76, pad = 10, sc = Math.min((W - 2 * pad) / Math.max(mxO - mnO, 0.001), (H - 2 * pad) / Math.max(mxA - mnA, 0.001)), ox = (W - (mxO - mnO) * sc) / 2, oy = (H - (mxA - mnA) * sc) / 2;
    function X(p) { return ox + (p[1] - mnO) * sc; } function Y(p) { return H - (oy + (p[0] - mnA) * sc); }
    var d = pts.map(function (p, i) { return (i ? 'L' : 'M') + X(p).toFixed(1) + ' ' + Y(p).toFixed(1); }).join('');
    var dots = r.secuencia.map(function (s) { var p = [s.lat, s.lng]; return '<circle cx="' + X(p).toFixed(1) + '" cy="' + Y(p).toFixed(1) + '" r="3.2"/>'; }).join('');
    return '<svg class="rc-sketch" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><path d="' + d + '"/>' + dots + '<circle class="o" cx="' + X(pts[0]).toFixed(1) + '" cy="' + Y(pts[0]).toFixed(1) + '" r="4.5"/></svg>';
  }
  function drawList() {
    var rows = filtered(), host = $('#listHost');
    if (!rows.length) { host.innerHTML = '<div class="card">' + UI.empty({ icon: 'route', title: 'Ninguna ruta coincide', text: 'Prueba con otro municipio o quita los filtros.', action: { label: 'Limpiar filtros' } }) + '</div>'; var b = $('button', host); if (b) b.onclick = function () { filt = { q: '', zona: '', estado: '' }; $('#q').value = ''; $('#fZona').value = ''; $('#fEstado').value = ''; drawList(); }; return; }
    if (view === 'cards') {
      host.innerHTML = '<div class="route-grid">' + rows.map(function (r) {
        var mun = r.municipios;
        return '<button type="button" class="card rcard' + (r.estado === 'Inactiva' ? ' is-off' : '') + '" data-id="' + r.rutaId + '" aria-label="Abrir ' + esc(r.nombre) + '">' +
          '<div class="rc-top"><div class="grow"><div class="mono t-12 muted">' + r.rutaId + '</div><div class="rc-name">' + esc(r.nombre) + '</div></div>' + estadoChip(r.estado) + '</div>' + sketch(r) +
          '<div class="rc-stats"><div><div class="v">' + F.num(r.kmIda, 1) + '</div><div class="l">km de ida</div></div><div><div class="v">' + (r.peajesCOP ? F.cop(r.peajesCOP) : 'Sin peajes') + '</div><div class="l">peajes de ida</div></div><div><div class="v">' + mun.length + '</div><div class="l">municipios</div></div></div>' +
          '<div class="rc-tags">' + mun.slice(0, 4).map(function (m) { return '<span class="tag">' + esc(m) + '</span>'; }).join('') + (mun.length > 4 ? '<span class="tag">+' + (mun.length - 4) + '</span>' : '') + '</div>' +
          '<div class="rc-foot"><span>Sale de ' + esc(r.origen) + '</span><span>Zona ' + esc(r.zona) + '</span><span class="rc-vig">' + vigente(r) + '</span></div></button>';
      }).join('') + '</div>';
      return;
    }
    UI.table(host, {
      rows: rows, rowKey: 'rutaId', pageSize: 10, caption: 'Rutas parametrizadas', emptyText: 'Ninguna ruta coincide.',
      columns: [
        { key: 'nombre', label: 'Ruta', title: true, render: function (r) { return '<span class="cell-main">' + esc(r.nombre) + '</span><div class="cell-sub mono">' + r.rutaId + '</div>'; } },
        { key: 'zona', label: 'Zona' },
        { key: 'origen', label: 'CEDI de salida' },
        { key: 'municipios', label: 'Municipios', value: function (r) { return r.municipios.length; }, render: function (r) { return r.municipios.length + '<div class="cell-sub">' + esc(r.municipios.slice(0, 3).join(', ')) + (r.municipios.length > 3 ? '…' : '') + '</div>'; } },
        { key: 'kmIda', label: 'Km (ida)', num: true, render: function (r) { return F.num(r.kmIda, 1); } },
        { key: 'peajesCOP', label: 'Peajes (ida)', num: true, render: function (r) { return r.peajesCOP ? F.cop(r.peajesCOP) : '—'; } },
        { key: 'vigenciaHasta', label: 'Vigencia', render: function (r) { return '<span class="nowrap">' + vigente(r) + '</span>'; }, hideMobile: true },
        { key: 'estado', label: 'Estado', render: function (r) { return estadoChip(r.estado); } }
      ],
      onRowClick: function (r) { openDetail(r.rutaId); },
      actions: function (r) { return [{ label: 'Ver detalle', icon: 'eye', onClick: function () { openDetail(r.rutaId); } }, { label: 'Editar ruta', icon: 'edit', onClick: function () { openDetail(r.rutaId, true); } }, { sep: true }, r.estado === 'Inactiva' ? { label: 'Reactivar', icon: 'refresh', onClick: function () { reactivate(r); } } : { label: 'Inactivar', icon: 'ban', danger: true, onClick: function () { deactivate(r); } }]; }
    });
  }
  $('#listHost').addEventListener('click', function (e) { var c = e.target.closest('.rcard'); if (c) openDetail(c.dataset.id); });
  $('#q').addEventListener('input', function (e) { filt.q = e.target.value; drawList(); });
  $('#fZona').innerHTML = '<option value="">Todas las zonas</option>' + ZONAS.filter(function (z) { return A.rutas.some(function (r) { return r.zona === z; }); }).map(function (z) { return '<option>' + z + '</option>'; }).join('');
  $('#fEstado').innerHTML = '<option value="">Todos los estados</option><option>Vigente</option><option>En revisión</option><option>Inactiva</option>';
  $('#fZona').addEventListener('change', function (e) { filt.zona = e.target.value; drawList(); });
  $('#fEstado').addEventListener('change', function (e) { filt.estado = e.target.value; drawList(); });
  $('#viewSeg').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; view = b.dataset.v; $$('button', $('#viewSeg')).forEach(function (x) { x.setAttribute('aria-pressed', x === b); }); drawList(); });
  function refresh() { drawKpis(); drawList(); }

  /* ---------- inactivar / reactivar (HU-039) ---------- */
  function deactivate(r, after) {
    var u = activos(r), n = u.desp.length + u.viajes.length;
    var body = '<p>La ruta <strong>' + esc(r.nombre) + '</strong> dejará de ofrecerse para planear nuevos viajes. El historial de despachos y entregas se conserva.</p>';
    if (n) body += '<div class="mt-3">' + UI.banner({ tone: 'warning', title: 'Tiene ' + n + (n === 1 ? ' despacho o viaje activo' : ' despachos o viajes activos'), html: '<ul class="confirm-list">' + u.desp.map(function (d) { return '<li><a href="despachos.html?id=' + d.despachoId + '">' + d.despachoId + '</a> · ' + esc(d.estado.toLowerCase()) + ' · ' + d.vehiculoId + '</li>'; }).join('') + u.viajes.map(function (v) { return '<li><a href="planeacion.html">Viaje ' + v.viajeId + '</a> propuesto · ' + v.vehiculoId + '</li>'; }).join('') + '</ul>Inactivar no los cancela; terminan con la ruta actual.' }) + '</div><label class="check mt-3"><input type="checkbox" id="ackBox"> Entiendo que estos despachos seguirán su curso</label><span class="error-text" id="ackErr" hidden></span>';
    UI.modal({ title: '¿Inactivar la ruta ' + r.rutaId + '?', width: 520, body: body, footer: [{ label: 'Cancelar', kind: 'ghost' }, { label: 'Inactivar ruta', kind: 'danger', onClick: function (api) {
      if (n && !$('#ackBox', api.body).checked) { var e = $('#ackErr', api.body); e.hidden = false; e.innerHTML = UI.icon('alert-circle', 'icon-sm') + 'Confirma que entiendes el efecto sobre los despachos activos.'; return false; }
      r.estado = 'Inactiva'; refresh(); UI.toast('Ruta ' + r.rutaId + ' inactivada. Ya no aparece para planear.', 'success'); if (after) after();
    } }] });
  }
  function reactivate(r, after) { r.estado = 'Vigente'; refresh(); UI.toast('Ruta ' + r.rutaId + ' reactivada y disponible para planeación.', 'success'); if (after) after(); }

  });
  document.addEventListener('dragstart', function (e) { var li = e.target.closest && e.target.closest('#seqList li[data-i]'); if (!li || !D || !D.editing) return; D.dragI = +li.dataset.i; li.classList.add('is-drag'); e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', 'x'); } catch (x) {} });
  document.addEventListener('dragover', function (e) { var li = e.target.closest && e.target.closest('#seqList li[data-i]'); if (!li || D == null || D.dragI == null) return; e.preventDefault(); $$('#seqList li').forEach(function (x) { x.classList.toggle('is-drop', x === li); }); });
  document.addEventListener('dragend', function () { if (D) D.dragI = null; $$('#seqList li').forEach(function (x) { x.classList.remove('is-drag', 'is-drop'); }); });
  document.addEventListener('drop', function (e) { var li = e.target.closest && e.target.closest('#seqList li[data-i]'); if (!li || !D || D.dragI == null) return; e.preventDefault(); var from = D.dragI, to = +li.dataset.i, d = D.draft; D.dragI = null; if (from === to) return; var old = d.tramos.slice(); d.secuencia.splice(to, 0, d.secuencia.splice(from, 1)[0]); rebuildTramos(d, old); renderAll(false); });

  function save() {
    var d = D.draft, errs = {};
    if (!d.nombre.trim()) errs.nombre = 'Escribe el nombre de la ruta.';
    else if (A.rutas.some(function (x) { return x.rutaId !== d.rutaId && UI.norm(x.nombre) === UI.norm(d.nombre); })) errs.nombre = 'Ya existe otra ruta con ese nombre.';
    if (!d.secuencia.length) errs.seq = 'La ruta necesita al menos un municipio.';
    if (!d.vigenciaDesde || !d.vigenciaHasta || d.vigenciaHasta <= d.vigenciaDesde) errs.vig = 'La fecha final debe ser posterior a la inicial.';
    d.tramos.forEach(function (t, i) {
      if (!(+t.km > 0)) errs['km' + i] = 'Mayor a 0';
      t.peajes.forEach(function (p, j) { if (!String(p.nombre).trim()) errs['pn' + i + '_' + j] = 'Escribe el nombre del peaje.'; else if (p.valorCOP === '' || !(+p.valorCOP >= 0)) errs['pv' + i + '_' + j] = 'Ingresa un valor en pesos, 0 o más.'; });
    });
    D.errs = errs; if (Object.keys(errs).length) { renderAll(false); UI.toast('Hay campos por corregir antes de guardar.', 'error'); var f = $('[aria-invalid="true"]', D.api.el); if (f) f.focus(); return; }
    var t = totals(d), r = D.r, changedSeq = JSON.stringify(d.secuencia.map(function (s) { return s.nombre; })) !== JSON.stringify(r.secuencia.map(function (s) { return s.nombre; })) || d.origenId !== r.origenId;
    d.kmIda = t.km; d.kmTotal = t.kmTotal; d.peajesCOP = t.pj; d.duracionIdaMin = t.min; d.municipios = d.secuencia.map(function (s) { return s.nombre; }); d.nombre = d.nombre.trim();
    if (changedSeq) d.trazado = [[sede(d.origenId).lat, sede(d.origenId).lng]].concat(d.secuencia.map(function (s) { return [s.lat, s.lng]; }));
    Object.assign(r, d); D.draft = clone(r); D.editing = false; D.errs = {};
    $('.ov-title', D.api.el).innerHTML = esc(r.nombre) + ' <span class="mono muted t-14">' + r.rutaId + '</span>'; $('.ov-sub', D.api.el).innerHTML = estadoChip(r.estado) + ' <span class="muted">· Zona ' + esc(r.zona) + ' · ' + vigente(r) + '</span>';
    renderAll(true); refresh(); UI.toast('Ruta ' + r.rutaId + ' actualizada: ' + F.num(t.km, 1) + ' km de ida y ' + (t.pj ? F.cop(t.pj) + ' en peajes' : 'sin peajes') + '.', 'success');
  }

  /* ---------- crear ruta (HU-032) ---------- */
  $('#btnNew').addEventListener('click', function () {
    var W = { step: 1, nombre: '', zona: 'Norte', origenId: A.sedes[0].id, desde: A.ymd(0), hasta: A.ymd(365), sel: [], errs: {} };
    var m = UI.modal({ title: 'Crear ruta poblacional', subtitle: 'Tres pasos: datos básicos, municipios y revisión de tramos.', width: 640, body: '<div id="wz"></div>' });
    var host = $('#wz', m.body);
    function build() {
      var pts = [{ nombre: sede(W.origenId).nombre, lat: sede(W.origenId).lat, lng: sede(W.origenId).lng }].concat(W.sel.map(function (n) { return CAT[n]; }));
      var tr = []; for (var i = 1; i < pts.length; i++) tr.push({ desde: pts[i - 1].nombre, hasta: pts[i].nombre, km: r1(hav(pts[i - 1], pts[i]) * 1.35), minutos: Math.round(hav(pts[i - 1], pts[i]) * 1.35 * 1.58) });
      return tr;
    }
    function er(k) { return W.errs[k] ? '<span class="error-text">' + UI.icon('alert-circle', 'icon-sm') + esc(W.errs[k]) + '</span>' : ''; }
    function draw() {
      var h = '<div class="wiz-steps">' + ['Datos', 'Municipios', 'Revisión'].map(function (s, i) { return '<span class="' + (W.step === i + 1 ? 'on' : W.step > i + 1 ? 'done' : '') + '"><b>' + (W.step > i + 1 ? '✓' : i + 1) + '</b>' + s + '</span>'; }).join('') + '</div>';
      if (W.step === 1) h += '<div class="form-grid c2"><div class="field span-2"><label class="label" for="wNombre">Nombre de la ruta</label><input class="input" id="wNombre" value="' + esc(W.nombre) + '" placeholder="Ej.: Oriente – Fresno / Mariquita"' + (W.errs.nombre ? ' aria-invalid="true"' : '') + '>' + er('nombre') + '</div>' +
        '<div class="field"><label class="label" for="wZona">Zona</label><select class="select" id="wZona">' + ZONAS.map(function (z) { return '<option' + (z === W.zona ? ' selected' : '') + '>' + z + '</option>'; }).join('') + '</select></div>' +
        '<div class="field"><label class="label" for="wCedi">CEDI de salida</label><select class="select" id="wCedi">' + A.sedes.map(function (s) { return '<option value="' + s.id + '"' + (s.id === W.origenId ? ' selected' : '') + '>' + esc(s.nombre) + '</option>'; }).join('') + '</select></div>' +
        '<div class="field"><label class="label" for="wDesde">Vigente desde</label><input class="input" type="date" id="wDesde" value="' + W.desde + '"></div><div class="field"><label class="label" for="wHasta">Vigente hasta</label><input class="input" type="date" id="wHasta" value="' + W.hasta + '"' + (W.errs.vig ? ' aria-invalid="true"' : '') + '>' + er('vig') + '</div></div>';
      if (W.step === 2) h += '<div class="stack"><div class="field"><span class="label">Selecciona los municipios en el orden de visita</span><div class="catalog" id="wCat">' + CATL.map(function (c) { var i = W.sel.indexOf(c.nombre); return '<label class="check"><input type="checkbox" value="' + esc(c.nombre) + '"' + (i > -1 ? ' checked' : '') + '> ' + esc(c.nombre) + '</label>'; }).join('') + '</div>' + er('sel') + '</div>' +
        '<div class="field"><span class="label">Secuencia (' + W.sel.length + ')</span><div class="pick" id="wPick">' + (W.sel.length ? W.sel.map(function (n, i) { return '<span class="tag">' + (i + 1) + '. ' + esc(n) + '<button type="button" data-up="' + i + '" aria-label="Mover ' + esc(n) + ' antes"' + (i === 0 ? ' disabled' : '') + '>‹</button><button type="button" data-rm="' + i + '" aria-label="Quitar ' + esc(n) + '">×</button></span>'; }).join('') : '<span class="muted t-13">Aún no has elegido municipios.</span>') + '</div></div></div>';
      if (W.step === 3) { var tr = build(), tk = r1(sum(tr, function (t) { return t.km; })); h += '<div class="stack">' + UI.banner({ tone: 'info', text: 'Los kilómetros se estiman por la vía (línea recta × 1,35). Podrás ajustarlos y registrar los peajes en la ficha de la ruta. Se crea en estado «En revisión».' }) + '<div class="table-wrap"><table class="table is-dense"><thead><tr><th>Tramo</th><th class="num">Km</th><th class="num">Min</th></tr></thead><tbody>' + tr.map(function (t) { return '<tr><td>' + esc(t.desde) + ' → ' + esc(t.hasta) + '</td><td class="num">' + F.num(t.km, 1) + '</td><td class="num">' + t.minutos + '</td></tr>'; }).join('') + '</tbody><tfoot><tr><td><strong>' + esc(W.nombre) + ' · ida</strong></td><td class="num"><strong>' + F.num(tk, 1) + '</strong></td><td class="num"><strong>' + sum(tr, function (t) { return t.minutos; }) + '</strong></td></tr></tfoot></table></div></div>'; }
      h += '<div class="wiz-nav"><button type="button" class="btn btn-ghost" id="wBack">' + (W.step === 1 ? 'Cancelar' : 'Atrás') + '</button><button type="button" class="btn btn-primary" id="wNext">' + (W.step === 3 ? 'Crear ruta' : 'Continuar') + '</button></div>';
      host.innerHTML = h;
      $('#wBack', host).onclick = function () { if (W.step === 1) m.close(); else { W.step--; draw(); } };
      $('#wNext', host).onclick = next;
      var f = $('[aria-invalid="true"]', host); if (f) f.focus();
    }
    function next() {
      W.errs = {};
      if (W.step === 1) {
        W.nombre = $('#wNombre', host).value.trim(); W.zona = $('#wZona', host).value; W.origenId = $('#wCedi', host).value; W.desde = $('#wDesde', host).value; W.hasta = $('#wHasta', host).value;
        if (!W.nombre) W.errs.nombre = 'Escribe el nombre de la ruta.'; else if (A.rutas.some(function (x) { return UI.norm(x.nombre) === UI.norm(W.nombre); })) W.errs.nombre = 'Ya existe una ruta con ese nombre.';
        if (!W.desde || !W.hasta || W.hasta <= W.desde) W.errs.vig = 'La fecha final debe ser posterior a la inicial.';
      } else if (W.step === 2 && !W.sel.length) W.errs.sel = 'Elige al menos un municipio.';
      if (Object.keys(W.errs).length) { draw(); return; }
      if (W.step < 3) { W.step++; draw(); return; }
      var tr = build(), pts = [{ nombre: sede(W.origenId).nombre, lat: sede(W.origenId).lat, lng: sede(W.origenId).lng }].concat(W.sel.map(function (n) { return CAT[n]; })), tk = r1(sum(tr, function (t) { return t.km; }));
      var n = A.rutas.length + 1, id = 'R-' + (n < 10 ? '0' : '') + n, s = sede(W.origenId);
      var nr = { rutaId: id, nombre: W.nombre, zona: W.zona, origenId: s.id, origen: s.nombre, municipios: W.sel.slice(), secuencia: W.sel.map(function (nm, i) { var c = CAT[nm]; return { orden: i + 1, municipioKey: c.key, nombre: nm, lat: c.lat, lng: c.lng }; }), tramos: tr.map(function (t, i) { return { orden: i + 1, desde: t.desde, hasta: t.hasta, km: t.km, minutos: t.minutos, peajes: [] }; }), kmIda: tk, kmTotal: r1(tk * 2), peajesCOP: 0, duracionIdaMin: sum(tr, function (t) { return t.minutos; }), vigenciaDesde: W.desde, vigenciaHasta: W.hasta, estado: 'En revisión', clientes: 0, trazado: pts.map(function (p) { return [p.lat, p.lng]; }), zonasExtra: [] };
      A.rutas.push(nr); A.idx.rutas[id] = nr; m.close(); refresh(); UI.toast('Ruta ' + id + ' creada en revisión. Registra los peajes y actívala cuando esté lista.', 'success'); setTimeout(function () { openDetail(id, true); }, 260);
    }
    host.addEventListener('change', function (e) {
      if (e.target.closest('#wCat')) { var v = e.target.value; if (e.target.checked) { if (W.sel.length >= 12) { e.target.checked = false; W.errs.sel = 'Una ruta admite máximo 12 municipios.'; draw(); return; } W.sel.push(v); } else W.sel.splice(W.sel.indexOf(v), 1); draw(); }
    });
    host.addEventListener('click', function (e) { var u = e.target.closest('[data-up]'), x = e.target.closest('#wPick [data-rm]'); if (u) { var i = +u.dataset.up; W.sel.splice(i - 1, 0, W.sel.splice(i, 1)[0]); draw(); } else if (x) { W.sel.splice(+x.dataset.rm, 1); draw(); } });
    draw();
  });

  refresh();
  var pid = UI.param('id'); if (pid) setTimeout(function () { openDetail(pid); }, 300);
});
</script>
</body>
</html>
