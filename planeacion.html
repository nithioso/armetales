<style>

  .stop-name { font-size: 13.5px; font-weight: 500; overflow-wrap: anywhere; } .stop-meta { font-size: 12px; color: var(--text-2); }
  .stop-kg { font-size: 12.5px; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .trip-foot { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--border); background: var(--surface-2); border-radius: 0 0 var(--r-card) var(--r-card); }
  .trip-foot .tf-stat { font-size: 12.5px; color: var(--text-2); margin-right: auto; font-variant-numeric: tabular-nums; }
  .trip-foot .tf-stat b { color: var(--text); font-weight: 600; }
  .unassigned { border: 1.5px dashed var(--border-strong); border-radius: var(--r-card); background: var(--surface); }
  .unassigned .stop { cursor: grab; }
  .un-head { padding: 12px 14px 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .un-empty { padding: 14px; font-size: 13px; color: var(--text-2); }
  .calc-card { padding: 22px 20px; }

  .calc-steps .cs-ico { width: 20px; height: 20px; display: grid; place-items: center; flex: none; }
  .calc-steps .is-done .cs-ico { color: var(--green); }
  .calc-steps .cs-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--border-strong); }
  .plan-bar { position: sticky; bottom: 12px; z-index: 30; margin-top: 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; padding: 12px 16px; background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--r-card); box-shadow: var(--shadow-pop); }
  .pb-stats { display: flex; flex-wrap: wrap; gap: 4px 22px; flex: 1 1 320px; min-width: 0; }
  .pb-stat { font-size: 12px; color: var(--text-2); } .pb-stat b { display: block; font-family: var(--font-display); font-size: 19px; font-weight: 600; color: var(--text); line-height: 1.15; font-variant-numeric: tabular-nums; }
  .pb-actions { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }
  @media (max-width: 639px) { .plan-bar { bottom: 8px; padding: 10px 12px; } .pb-stat b { font-size: 16px; } .pb-actions { width: 100%; } .pb-actions .btn { flex: 1; } }
  .veh-opt { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--r-ctl); cursor: pointer; }
  .veh-opt:hover { background: var(--surface-2); } .veh-opt:has(input:checked) { border-color: var(--blue); background: color-mix(in srgb, var(--blue) 7%, var(--surface)); }
  .veh-opt.is-off { opacity: .6; cursor: not-allowed; background: var(--surface-2); }
  .veh-opt .vo-main { min-width: 0; } .veh-opt .vo-sub { font-size: 12.5px; color: var(--text-2); }
  .veh-opt .vo-why { font-size: 12px; color: var(--red-fg); margin-top: 2px; display: flex; gap: 4px; align-items: center; }
  .mini-stat { padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--r-ctl); background: var(--surface-2); }
  .mini-stat .v { font-family: var(--font-display); font-weight: 600; font-size: 22px; line-height: 1.1; font-variant-numeric: tabular-nums; } .mini-stat .l { font-size: 12px; color: var(--text-2); }
  .links-row { display: grid; gap: 8px; }
  .links-row a { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--r-ctl); color: var(--text); text-decoration: none; font-weight: 500; }
  .links-row a:hover { background: var(--surface-2); border-color: var(--border-strong); }
  .links-row a small { display: block; font-weight: 400; color: var(--text-2); font-size: 12.5px; }
  .links-row a .icon:last-child { margin-left: auto; color: var(--text-3); }
</style>

<body data-page="planeacion">
<main id="app">
  <header class="page-head">
    <div class="ph-text">
      <div class="page-eyebrow">Operación</div>
      <h1 class="page-title">Planeación logística</h1>
      <p class="page-desc">Agrupa los pedidos completos por zona, propone viajes según capacidad y restricciones, y ajusta el plan antes de confirmarlo.</p>
    </div>
    <div class="page-actions">
      <span class="chip chip-neutral" id="planChip">Sin propuesta</span>
      <button type="button" class="btn btn-primary" id="genBtn"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 3 14h9l-1 8 10-12h-9z"/></svg>Generar propuesta</button>
    </div>
  </header>

  <section class="card ctx-bar" id="ctxBar" aria-label="Contexto del plan"></section>

  <div class="tabs pane-tabs" role="group" aria-label="Vista" id="paneTabs"></div>

  <div class="plan-grid" id="planGrid" data-pane="pedidos">
    <section class="col-pedidos" aria-label="Pedidos por planear">
      <div class="card pool-card">
        <div class="card-head"><div><h2 class="card-title">Pedidos por planear</h2><p class="card-sub" id="poolSub"></p></div>
          <label class="check"><input type="checkbox" id="selAll"> Seleccionar visibles</label></div>
        <div class="pool-tools">
          <div class="search"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><input class="input" type="search" id="poolQ" placeholder="Buscar pedido, cliente o municipio" aria-label="Buscar pedido, cliente o municipio"></div>
          <select class="select input-sm" id="zoneSel" aria-label="Filtrar por zona o ruta"></select>
          <select class="select input-sm" id="dateSel" aria-label="Filtrar por fecha de completitud"></select>
        </div>
        <div class="pool-list" id="poolList"></div>
        <div class="sel-bar" id="selBar" role="region" aria-label="Acciones sobre la selección"></div>
      </div>
    </section>
    <section class="col-viajes" aria-label="Viajes propuestos">
      <div class="section-head" style="margin-top:0"><h2 class="section-title">Viajes propuestos</h2><span class="muted t-13" id="tripsSub"></span></div>
      <div id="tripsHost"></div>
    </section>
  </div>

  <div class="plan-bar" id="planBar" role="region" aria-label="Resumen y confirmación del plan"></div>
</main>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
UI.ready(function () {
  var A = ARM, F = UI.fmt, esc = UI.esc, $ = UI.$, $$ = UI.$$, ic = UI.icon;
  var HOY = A.ymd(0), MANANA = A.ymd(1), SEDE = A.sedes[0];
  var TARIFA = { Camioneta: 1600, Turbo: 2600, Sencillo: 3400, Dobletroque: 4600, Tractomula: 6200 };
  var DIAS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];

  /* ---------- estado de la pantalla ---------- */
  var S = { phase: 'idle', fecha: HOY, corte: A.plan.parametros.corteHora, ventana: A.plan.parametros.consolidacionMin, sel: new Set(), viajes: [], sinAsignar: [], q: '', zona: '', fechaComp: '', closed: {}, pane: 'pedidos', seq: 0, loading: true, stale: false };
  var planIds = {}; A.plan.viajes.forEach(function (v) { v.pedidoIds.forEach(function (id) { planIds[id] = v.viajeId; }); });

  /* ---------- utilidades ---------- */
  function hh(id) { var s = 0; for (var i = 0; i < id.length; i++) s = (s * 31 + id.charCodeAt(i)) % 997; return s / 997; }
  function toMin(t) { var p = String(t).split(':'); return (+p[0]) * 60 + (+p[1] || 0); }
  function fmtMin(m) { m = Math.max(0, Math.round(m)); return ('0' + Math.floor(m / 60)).slice(-2) + ':' + ('0' + (m % 60)).slice(-2); }
  function hav(a, b) { var R = 6371, t = Math.PI / 180, dl = (b[0] - a[0]) * t, dn = (b[1] - a[1]) * t, x = Math.sin(dl / 2) * Math.sin(dl / 2) + Math.cos(a[0] * t) * Math.cos(b[0] * t) * Math.sin(dn / 2) * Math.sin(dn / 2); return 2 * R * Math.asin(Math.sqrt(x)); }
  function ped(id) { return A.idx.pedidos[id]; }
  function cli(p) { return A.idx.clientes[p.clienteId]; }
  function veh(pl) { return A.idx.vehiculos[pl]; }
  function ruta(id) { return A.idx.rutas[id]; }
  function fechaLarga(ymd) { var d = new Date(ymd + 'T12:00:00'); var t = DIAS[d.getDay()] + ' ' + d.getDate() + ' de ' + ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'][d.getMonth()]; return t.charAt(0).toUpperCase() + t.slice(1); }
  function plural(n, s, p) { return n + ' ' + (n === 1 ? s : p); }
  function bodega(v) { return v; }

  /* minuto estimado en que el pedido queda completo (relativo al corte base de la sede) */
  var BASE = toMin(A.plan.parametros.corteHora), extras = [];
  A.pedidos.forEach(function (p) { if (['En firme', 'En preparación', 'Listo para despacho'].indexOf(p.estado) > -1 && !p.despachoId && !planIds[p.pedidoId]) extras.push(p.pedidoId); });
  extras.sort();
  function compMin(p) {
    var r = hh(p.pedidoId), off;
    if (planIds[p.pedidoId]) off = p.estado === 'Listo para despacho' ? -(120 + r * 170) : p.estado === 'En preparación' ? -(25 + r * 110) : -(10 + r * 60);
    else off = extras.indexOf(p.pedidoId) === 0 ? -(5 + r * 20) : 30 + r * 80;
    return Math.round(BASE + off);
  }
  function pool() {
    return A.pedidos.filter(function (p) { return ['En firme', 'En preparación', 'Listo para despacho'].indexOf(p.estado) > -1 && !p.despachoId; }).map(function (p) {
      var c = compMin(p), corte = toMin(S.corte); p._c = c; p._fuera = c > corte; p._vent = !p._fuera && c > corte - S.ventana; p._fcomp = p._fuera ? MANANA : HOY; return p;
    });
  }
  function dentro() { return pool().filter(function (p) { return !p._fuera; }); }
  function asignadoA(id) { var r = null; S.viajes.forEach(function (v) { if (v.pedidoIds.indexOf(id) > -1) r = v; }); return r; }
  function sumKg(ids) { return ids.reduce(function (s, id) { return s + ped(id).pesoKg; }, 0); }
  function sumM3(ids) { return ids.reduce(function (s, id) { return s + ped(id).volumenM3; }, 0); }
  function largo(ids) { return ids.some(function (id) { return ped(id).lineas.some(function (l) { return A.idx.productos[l.sku].restricciones.indexOf('LARGA') > -1; }); }); }

  /* ---------- cálculo de un viaje ---------- */
  function seq(ids) {
    var rest = ids.slice(), pos = [SEDE.lat, SEDE.lng], out = [];
    while (rest.length) { var bi = 0, bd = 1e9; rest.forEach(function (id, i) { var c = cli(ped(id)), d = hav(pos, [c.latitud, c.longitud]); if (d < bd) { bd = d; bi = i; } }); var id = rest.splice(bi, 1)[0]; out.push(id); var c2 = cli(ped(id)); pos = [c2.latitud, c2.longitud]; }
    return out;
  }
  function calc(vj) {
    var v = veh(vj.vehiculoId), ids = vj.pedidoIds = seq(vj.pedidoIds), rt = ruta(vj.rutaId);
    vj.pesoKg = Math.round(sumKg(ids) * 10) / 10; vj.volumenM3 = Math.round(sumM3(ids) * 100) / 100;
    vj.utilPeso = v ? Math.round(vj.pesoKg / v.pesoMaxKg * 100) : 0; vj.utilVol = v ? Math.round(vj.volumenM3 / v.volumenMaxM3 * 100) : 0;
    var km = 0, pos = [SEDE.lat, SEDE.lng]; ids.forEach(function (id) { var c = cli(ped(id)), q = [c.latitud, c.longitud]; km += hav(pos, q) * 1.35; pos = q; }); km += hav(pos, [SEDE.lat, SEDE.lng]) * 1.35;
    vj.km = Math.round(km * 10) / 10; vj.peajes = ids.length ? (rt.peajesCOP || 0) * 2 : 0;
    vj.costo = v && ids.length ? Math.round((km * TARIFA[v.tipo] + vj.peajes + (v.requiereAyudante ? 90000 : 0)) / 1000) * 1000 : 0;
    var al = [];
    if (v) {
      if (vj.pesoKg > v.pesoMaxKg) al.push({ n: 'peligro', t: 'Sobrecupo de peso: ' + F.kg(vj.pesoKg) + ' sobre un máximo de ' + F.kg(v.pesoMaxKg) + '.' });
      if (vj.volumenM3 > v.volumenMaxM3) al.push({ n: 'peligro', t: 'Sobrecupo de volumen: ' + F.m3(vj.volumenM3) + ' sobre un máximo de ' + F.m3(v.volumenMaxM3, 0) + '.' });
      if (largo(ids) && !v.compatibilidad.largaMas6m) al.push({ k: 'largo', n: v.carroceria === 'Furgón' ? 'peligro' : 'alerta', t: v.carroceria === 'Furgón' ? 'Hay carga de más de 6 m y el furgón no la admite.' : 'Carga de más de 6 m en carrocería de ' + v.carroceria.toLowerCase() + ': exige voladizo señalizado; se valida en cargue.' });

      body: '<div class="stack-lg"><div class="grid c3 gap-3">' + ['Disponible', 'En ruta', 'Cargando', 'Mantenimiento'].slice(0, 3).map(function (s) { return '<div class="mini-stat"><div class="v">' + A.vehiculos.filter(function (v) { return v.estado === s; }).length + '</div><div class="l">' + s + '</div></div>'; }).join('') + '</div>' +
        '<div class="table-wrap"><table class="table is-dense"><thead><tr><th>Vehículo</th><th class="num">Capacidad</th><th>Estado</th></tr></thead><tbody>' + A.vehiculos.slice().sort(function (a, b) { return (a.estado === 'Disponible' ? 0 : 1) - (b.estado === 'Disponible' ? 0 : 1) || a.pesoMaxKg - b.pesoMaxKg; }).map(function (v) { var as = asignadoPlaca(v.placa); return '<tr><td><a href="vehiculos.html?placa=' + encodeURIComponent(v.placa) + '" style="text-decoration:none">' + UI.plate(v.placa) + '</a><div class="cell-sub">' + esc(v.tipo) + ' · ' + esc(A.idx.conductores[v.conductorId].nombre) + '</div></td><td class="num">' + F.kg(v.pesoMaxKg) + '<div class="cell-sub">' + F.m3(v.volumenMaxM3, 0) + '</div></td><td>' + UI.chip(v.estado) + (as ? '<div class="cell-sub">Propuesto en ' + as + '</div>' : '') + '</td></tr>'; }).join('') + '</tbody></table></div></div>',
      footer: [{ label: 'Cerrar', kind: 'ghost' }, { label: 'Parametrizar flota', kind: 'primary', icon: 'arrow-right', onClick: function () { location.href = 'vehiculos.html'; } }] });
  }

  /* ---------- detalle de pedido ---------- */
  function pedDrawer(id) {
    var p = ped(id), c = cli(p), rt = ruta(p.rutaId), a = asignadoA(id);
    UI.drawer({ title: id, subtitleHtml: esc(p.cliente) + ' · ' + UI.chip(p.estado, { small: true }), width: 520,
      body: '<div class="stack-lg">' + UI.kv([['Cliente', '<a href="clientes.html?id=' + c.clienteIdSAP + '">' + esc(p.cliente) + '</a>'], ['Entrega', esc(p.municipio) + ' · ' + esc(c.direccionEntrega || '')], ['Ruta', esc(rt.nombre) + ' <span class="mono muted">' + rt.rutaId + '</span>'], ['Ventana de recibo', esc(c.ventanaInicio) + ' – ' + esc(c.ventanaFin)], ['Entrega solicitada', F.fecha(p.entregaSolicitada)], ['Prioridad', UI.chip(p.prioridad)], ['Peso y volumen', F.kg(p.pesoKg) + ' · ' + F.m3(p.volumenM3, 1)], ['Completo hacia', pool().filter(function (x) { return x.pedidoId === id; })[0]._fuera ? fmtMin(compMin(p)) + ' (después del corte)' : fmtMin(compMin(p))], ['Viaje', a ? a.viajeId + ' · ' + a.vehiculoId : 'Sin asignar']]) +
        '<section><h3 class="mb-2">Líneas del pedido</h3><div class="table-wrap"><table class="table is-dense"><thead><tr><th>Producto</th><th class="num">Cant.</th><th class="num">Peso</th></tr></thead><tbody>' + p.lineas.map(function (l) { return '<tr><td>' + esc(l.descripcion) + '<div class="cell-sub mono">' + l.sku + '</div></td><td class="num">' + F.num(l.cantidad) + '</td><td class="num">' + F.kg(l.pesoKg) + '</td></tr>'; }).join('') + '</tbody></table></div></section>' + (largo([id]) ? UI.banner({ tone: 'warning', text: 'Incluye productos de más de 6 m: requiere planchón o tractomula.' }) : '') + '</div>',
      footer: [{ label: 'Cerrar', kind: 'ghost' }, { label: 'Abrir pedido', kind: 'primary', icon: 'arrow-right', onClick: function () { location.href = 'pedidos.html?id=' + encodeURIComponent(id); } }] });
  }

  /* ---------- confirmar plan ---------- */
  function confirmPlan() {
    var bl = blockers();
    if (bl.length) {
      var b0 = bl[0], lg = esLargo(b0) ? largosDe(b0.vj) : [];
      UI.modal({ title: 'No se puede confirmar el plan', width: 540, body: '<div class="stack">' + UI.banner({ tone: 'danger', title: plural(bl.length, 'bloqueo debe', 'bloqueos deben') + ' resolverse', text: 'Un viaje con sobrecupo o carga incompatible no puede salir a cargue.' }) + '<ul class="stack-sm" style="padding-left:18px;margin:0">' + bl.map(function (b) { return '<li><strong>' + b.vj.viajeId + ' · ' + b.vj.vehiculoId + ':</strong> ' + esc(b.t) + '</li>'; }).join('') + '</ul>' +
        '<div class="card" style="padding:12px 14px"><div class="strong t-13">Cómo resolverlo</div><p class="muted t-13 mt-1">' + (lg.length ? 'El pedido ' + lg.map(function (id) { return '<span class="mono">' + id + '</span>'; }).join(', ') + ' lleva productos de más de 6 m y ' + b0.vj.vehiculoId + ' es un furgón. Sácalo del viaje (queda en «Sin asignar» para planearlo con un planchón o una tractomula) o cambia el vehículo del viaje.' : 'Cambia el vehículo por uno con capacidad y cobertura suficientes o mueve pedidos a otro viaje.') + '</p></div></div>',
        footer: [{ label: 'Cerrar', kind: 'ghost' }].concat(lg.length ? [{ label: 'Cambiar vehículo', kind: 'secondary', onClick: function () { setTimeout(function () { changeVehicle(b0.vj.viajeId); }, 220); } }, { label: 'Sacar de ' + b0.vj.viajeId + ' el pedido de carga larga', kind: 'primary', icon: 'check-circle', onClick: function () { sacarLargos(b0.vj.viajeId); } }] : [{ label: b0.vj.pedidoIds.length ? 'Cambiar vehículo de ' + b0.vj.viajeId : 'Ver ' + b0.vj.viajeId, kind: 'primary', icon: 'truck', onClick: function () { setTimeout(function () { var el = $('[data-vj="' + b0.vj.viajeId + '"]'); if (el) { S.pane = 'viajes'; $('#planGrid').dataset.pane = 'viajes'; el.scrollIntoView({ behavior: 'smooth', block: 'center' }); } if (b0.vj.pedidoIds.length) changeVehicle(b0.vj.viajeId); }, 220); } }]) }); return;
    }
    var vs = S.viajes, np = vs.reduce(function (s, v) { return s + v.pedidoIds.length; }, 0), warn = vs.reduce(function (s, v) { return s + v.alertas.filter(function (a) { return a.n === 'alerta'; }).length; }, 0);
    UI.confirm({ tone: 'primary', title: '¿Confirmar el plan del día?', confirmLabel: 'Confirmar plan',
      html: '<div style="white-space:normal;width:min(340px,calc(100vw - 150px))"><p>Se confirmarán <strong>' + plural(vs.length, 'viaje', 'viajes') + '</strong> con <strong>' + plural(np, 'pedido', 'pedidos') + '</strong> para el ' + esc(fechaLarga(S.fecha).toLowerCase()) + '.</p><ul style="padding-left:18px;margin:8px 0 0"><li>' + F.kg(vs.reduce(function (s, v) { return s + v.pesoKg; }, 0)) + ' de carga y ' + F.cop(vs.reduce(function (s, v) { return s + v.costo; }, 0)) + ' de costo estimado.</li>' + (S.sinAsignar.length ? '<li>' + plural(S.sinAsignar.length, 'pedido queda', 'pedidos quedan') + ' sin asignar.</li>' : '') + (warn ? '<li>' + plural(warn, 'alerta sin resolver', 'alertas sin resolver') + ' (pico y placa o paradas fuera de ruta).</li>' : '') + '</ul></div>' }).then(function (ok) {
      if (!ok) return; S.phase = 'confirmed'; A.plan.estado = 'Confirmado'; S.sel.clear(); renderAll();
      UI.modal({ title: 'Plan confirmado', subtitle: A.plan.planId + ' · ' + esc(fechaLarga(S.fecha)), width: 500, body: '<div class="stack-lg">' + UI.banner({ tone: 'success', title: plural(vs.length, 'viaje listo', 'viajes listos') + ' para cargue', text: 'Los pedidos pasan a «Planificado» y logística de bodega recibe el aviso de cargue.' }) +
        '<div class="links-row"><a href="cargue.html">' + ic('layers') + '<span>Optimizar el cargue<small>Distribución en el vehículo por viaje</small></span>' + ic('chevron-right', 'icon-sm') + '</a><a href="despachos.html">' + ic('clipboard-check') + '<span>Generar órdenes de despacho<small>Valida pedidos habilitados y asigna conductor</small></span>' + ic('chevron-right', 'icon-sm') + '</a><a href="motor-rutas.html">' + ic('route') + '<span>Optimizar secuencias de entrega<small>Motor de rutas lógicas</small></span>' + ic('chevron-right', 'icon-sm') + '</a></div></div>', footer: [{ label: 'Seguir en planeación', kind: 'ghost' }] });
    });
  }

  /* ---------- eventos ---------- */
  $('#genBtn').addEventListener('click', generate);
  $('#poolQ').addEventListener('input', function (e) { S.q = e.target.value; renderPool(); });
  $('#zoneSel').addEventListener('change', function (e) { S.zona = e.target.value; renderPool(); });
  $('#dateSel').addEventListener('change', function (e) { S.fechaComp = e.target.value; renderPool(); });
  $('#selAll').addEventListener('change', function (e) { visible().filter(selectable).forEach(function (p) { e.target.checked ? S.sel.add(p.pedidoId) : S.sel.delete(p.pedidoId); }); renderPool(); });
  $('#paneTabs').addEventListener('click', function (e) { var b = e.target.closest('[data-pane]'); if (!b) return; S.pane = b.dataset.pane; $('#planGrid').dataset.pane = S.pane; renderBar(); });
  $('#poolList').addEventListener('change', function (e) {
    var t = e.target; if (t.dataset.sel) { t.checked ? S.sel.add(t.dataset.sel) : S.sel.delete(t.dataset.sel); renderPool(); }
    else if (t.dataset.grp) { visible().filter(function (p) { return p.rutaId === t.dataset.grp && selectable(p); }).forEach(function (p) { t.checked ? S.sel.add(p.pedidoId) : S.sel.delete(p.pedidoId); }); renderPool(); }
  });
  $('#poolList').addEventListener('click', function (e) {
    var b = e.target.closest('[data-collapse]'); if (b) { S.closed[b.dataset.collapse] = !S.closed[b.dataset.collapse]; renderPool(); return; }
    var o = e.target.closest('[data-open]'); if (o) pedDrawer(o.dataset.open);
  });
  $('#selBar').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return; if (b.id === 'sbClear') { S.sel.clear(); renderPool(); }
    else if (b.id === 'sbNew') newTrip(); else if (b.id === 'sbAssign') moveMenu(b, Array.from(S.sel));
  });
  $('#tripsHost').addEventListener('click', function (e) {
    var b;
    if ((b = e.target.closest('[data-mv]'))) { moveMenu(b, [b.dataset.mv]); return; }
    if ((b = e.target.closest('[data-chveh]'))) { changeVehicle(b.dataset.chveh); return; }
    if ((b = e.target.closest('[data-outlarge]'))) { sacarLargos(b.dataset.outlarge); return; }
    if ((b = e.target.closest('[data-chruta]'))) { changeRuta(b.dataset.chruta); return; }
    if ((b = e.target.closest('[data-tmenu]'))) {
      var id = b.dataset.tmenu, vj = S.viajes.filter(function (v) { return v.viajeId === id; })[0], lock = S.phase === 'confirmed';
      UI.menu(b, [{ label: 'Cambiar vehículo', icon: 'truck', disabled: lock, onClick: function () { changeVehicle(id); } }, { label: 'Cambiar ruta', icon: 'route', disabled: lock, onClick: function () { changeRuta(id); } }, { sep: true }, { label: 'Optimizar en el motor de rutas', icon: 'git-branch', href: 'motor-rutas.html' }, { label: 'Ver cargue del viaje', icon: 'layers', href: 'cargue.html' }, { label: 'Ver vehículo', icon: 'external-link', href: 'vehiculos.html?placa=' + encodeURIComponent(vj.vehiculoId) }, { sep: true },
        { label: 'Deshacer viaje (pedidos a sin asignar)', icon: 'trash', danger: true, disabled: lock, onClick: function () { UI.confirm({ title: '¿Deshacer ' + id + '?', message: 'Sus ' + plural(vj.pedidoIds.length, 'pedido volverá', 'pedidos volverán') + ' a «Sin asignar». El vehículo ' + vj.vehiculoId + ' queda libre.', confirmLabel: 'Deshacer viaje' }).then(function (ok) { if (!ok) return; vj.pedidoIds.slice().forEach(function (pid) { S.sinAsignar.push({ pedidoId: pid, motivo: 'Viaje ' + id + ' deshecho manualmente' }); }); S.viajes = S.viajes.filter(function (v) { return v !== vj; }); renderAll(); UI.toast(id + ' deshecho.', 'info'); }); } }], { align: 'end' });
    }
  });
  /* arrastrar y soltar */
  var drag = null;
  document.addEventListener('dragstart', function (e) { var r = e.target.closest && e.target.closest('[data-pid][draggable="true"]'); if (!r) return; var id = r.dataset.pid; drag = S.sel.has(id) && S.sel.size > 1 ? Array.from(S.sel) : [id]; try { e.dataTransfer.setData('text/plain', drag.join(',')); e.dataTransfer.effectAllowed = 'move'; } catch (x) {} });
  document.addEventListener('dragend', function () { drag = null; $$('.is-over').forEach(function (x) { x.classList.remove('is-over'); }); });
  $('#tripsHost').addEventListener('dragover', function (e) { var t = e.target.closest('[data-vj]'); if (t && drag) { e.preventDefault(); $$('.is-over').forEach(function (x) { if (x !== t) x.classList.remove('is-over'); }); t.classList.add('is-over'); } });
  $('#tripsHost').addEventListener('dragleave', function (e) { var t = e.target.closest('[data-vj]'); if (t && !t.contains(e.relatedTarget)) t.classList.remove('is-over'); });
  $('#tripsHost').addEventListener('drop', function (e) { var t = e.target.closest('[data-vj]'); if (!t || !drag) return; e.preventDefault(); t.classList.remove('is-over'); var ids = drag; drag = null; movePedidos(ids, t.dataset.vj); });

  /* arranque con skeleton breve */
  renderCtx(); renderBar(); renderTrips(); renderPool();
  setTimeout(function () { S.loading = false; renderAll(); }, 420);
});
</script>
</body>
</html>
