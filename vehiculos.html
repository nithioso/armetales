<style>
  /* Layout específico de vehículos (tokens y componentes viven en app.css) */
  .kpi-row { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
  @media (max-width: 639px) { .kpi-row { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; } .kpi-row > :last-child:nth-child(odd) { grid-column: span 2; } .kpi .kpi-value { font-size: 28px; } .kpi { padding: 12px; } }
  .fleet-tools { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-bottom: 14px; }
  .fleet-tools .search { flex: 1 1 240px; max-width: 360px; }
  .fleet-tools .select { width: auto; min-width: 150px; }
  .fleet-tools .push { margin-left: auto; }
  .chip-filters { display: flex; flex-wrap: wrap; gap: 6px; }
  .veh-grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
  .veh-card { display: flex; flex-direction: column; gap: 12px; padding: 14px 16px; text-align: left; position: relative; }
  .veh-card:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .veh-card .vc-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .veh-card .vc-type { font-weight: 600; font-size: 14px; line-height: 1.3; }
  .veh-card .vc-model { font-size: 12.5px; color: var(--text-2); }
  .vc-caps { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .vc-caps .c { padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--r-ctl); background: var(--surface-2); min-width: 0; }
  .vc-caps .v { font-family: var(--font-display); font-weight: 600; font-size: 19px; line-height: 1.1; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .vc-caps .v small { font-size: 12px; font-weight: 500; color: var(--text-2); margin-left: 2px; }
  .vc-caps .l { font-size: 11.5px; color: var(--text-2); }
  .vc-drv { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .vc-drv .n { font-weight: 500; font-size: 13.5px; line-height: 1.25; }
  .vc-drv .s { font-size: 12px; color: var(--text-2); }
  .vc-foot { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding-top: 10px; border-top: 1px solid var(--border); margin-top: auto; }
  .veh-card[data-estado="Mantenimiento"], .veh-card[data-estado="Inactivo"] { background: color-mix(in srgb, var(--surface-2) 70%, var(--surface)); }
  /* matriz */
  .mx-card { overflow: hidden; }
  .mx-wrap { overflow: auto; max-height: 640px; max-width: 100%; }
  .mx { width: max-content; min-width: 100%; font-size: 13px; border-collapse: separate; border-spacing: 0; }
  .mx th, .mx td { padding: 0 10px; height: 44px; border-bottom: 1px solid var(--border); white-space: nowrap; text-align: center; background: var(--surface); }
  .mx thead th { position: sticky; top: 0; z-index: 3; background: var(--surface-2); height: 34px; font-size: 12px; font-weight: 600; color: var(--text-2); }
  .mx thead tr.grp th { top: 0; height: 30px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); border-bottom: 1px solid var(--border); border-left: 1px solid var(--border); }
  .mx thead tr.cols th { top: 30px; }
  .mx .first { position: sticky; left: 0; z-index: 2; text-align: left; min-width: 170px; border-right: 1px solid var(--border); }
  .mx thead .first { z-index: 4; background: var(--surface-2); }
  .mx td.sep, .mx th.sep { border-left: 1px solid var(--border); }
  .mx tbody tr { cursor: pointer; }
  .mx tbody tr:hover td { background: var(--surface-2); }
  .mx tbody tr:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
  .mx td.n { font-variant-numeric: tabular-nums; }
  .mx .mk { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; }
  .mx .mk.ok { background: var(--green-bg); color: var(--green-fg); }
  .mx .mk.ok .icon { width: 14px; height: 14px; stroke-width: 2.4; }
  .mx .mk.no { color: var(--text-3); }
  .mx .mk.cond { background: var(--amber-bg); color: var(--amber-fg); font-size: 11px; font-weight: 700; }
  .mx .rt-h { font-family: var(--font-mono); font-size: 11.5px; }
  .mx .dim-row td { background: var(--surface-3); }
  .mx-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding: 10px 14px; border-top: 1px solid var(--border); font-size: 12.5px; color: var(--text-2); }
  .mx-legend { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
  .mx-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .mx-tools { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--border); }
  .mx-tools .search { flex: 1 1 220px; max-width: 300px; }
  .mx-tools .select { width: auto; min-width: 140px; }
  .mx-tools .lbl { font-size: 12.5px; color: var(--text-2); font-weight: 500; }
  .mx-tools .minkg { width: 130px; }
  /* drawer de vehículo */
  .vd-head { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .vd-links { display: flex; gap: 6px; flex-wrap: wrap; }
  .vd-tabs { margin: 14px -20px 0; padding: 0 16px; position: sticky; top: -20px; background: var(--surface); z-index: 5; }
  .vd-sec + .vd-sec { margin-top: 22px; }
  .vd-sec > h3 { margin-bottom: 10px; }
  .vd-dirty { display: none; }
  .vd-dirty.on { display: inline-flex; }
  .vsvg { width: 100%; height: auto; border: 1px solid var(--border); border-radius: var(--r-card); background: var(--surface-2); }
  .vsvg text { fill: var(--text-2); font: 500 11px var(--font-mono); }
  .vsvg .body { fill: var(--surface-3); stroke: var(--steel); stroke-width: 1.5; }
  .vsvg .cab { fill: var(--surface); stroke: var(--steel); stroke-width: 1.5; }
  .vsvg .wheel { fill: var(--ink); } :root[data-theme="dark"] .vsvg .wheel { fill: var(--text-3); }
  .vsvg .dim { stroke: var(--red); stroke-width: 1.2; fill: none; }
  .vsvg .dimt { fill: var(--red-fg); }
  .vsvg .cap { fill: var(--steel); opacity: .9; }
  .geo { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .geo .c { padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--r-ctl); background: var(--surface-2); }
  .geo .v { font-family: var(--font-display); font-weight: 600; font-size: 18px; font-variant-numeric: tabular-nums; }
  .geo .l { font-size: 11.5px; color: var(--text-2); }
  .toggle-line { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .toggle-line:last-child { border-bottom: 0; }
  .toggle-line .tl-t { font-weight: 500; font-size: 13.5px; }
  .toggle-line .tl-d { font-size: 12.5px; color: var(--text-2); }
  .prod-grid { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); }
  .prod-grid .p { display: flex; justify-content: space-between; gap: 8px; align-items: center; padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--r-ctl); background: var(--surface-2); }
  .prod-grid .pn { font-weight: 500; font-size: 13px; line-height: 1.25; }
  .prod-grid .pd { font-size: 11.5px; color: var(--text-2); }
  .doc-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .doc-row:last-child { border-bottom: 0; }
  .doc-row .di { width: 36px; height: 36px; border-radius: 9px; background: var(--surface-3); display: grid; place-items: center; color: var(--text-2); flex: none; }
  .doc-row .dm { flex: 1; min-width: 160px; }
  .cov-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .week { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
  .week .d { padding: 8px 4px; text-align: center; border: 1px solid var(--border); border-radius: var(--r-ctl); font-size: 12px; color: var(--text-2); }
  .week .d b { display: block; font-size: 13px; color: var(--text); }
  .week .d.on { background: var(--amber-bg); border-color: var(--amber-line); color: var(--amber-fg); }
  .week .d.on b { color: var(--amber-fg); }
  .week .d.today { box-shadow: 0 0 0 2px var(--focus); }
  .sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  @media (max-width: 479px) { .vc-caps .v { font-size: 17px; } .geo { grid-template-columns: 1fr 1fr; } .vd-tabs { margin-left: -16px; margin-right: -16px; } }
  .kpi, .kpi .kpi-foot, .kpi .kpi-note { white-space: normal; }
  :root[data-theme="dark"] a.btn { color: var(--b-fg); } /* el color de enlace del tema oscuro pisaba el de los botones-enlace */
</style>
</head>

          <button type="button" data-v="table" aria-pressed="false"><svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Tabla</button>

          <div class="mx-legend"><span><i class="mk ok" style="display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;background:var(--green-bg);color:var(--green-fg)"><svg class="icon" style="width:13px;height:13px;stroke-width:2.4" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></i>Apto / cubre</span><span><b class="subtle">–</b>No apto / no cubre</span><span><i class="dot warn"></i>Restricción hoy</span></div></div>
      </div>

  </section>
</main>

<script>
UI.ready(function () {
  var A = ARM, F = UI.fmt, esc = UI.esc, $ = UI.$, $$ = UI.$$, ic = UI.icon;
  var TIPOS = ['Camioneta', 'Turbo', 'Sencillo', 'Dobletroque', 'Tractomula'];
  var CARROC = ['Estacas', 'Furgón', 'Planchón'];
  var ESTADOS = ['Disponible', 'En ruta', 'Cargando', 'Mantenimiento', 'Inactivo'];
  var DIAS = ['lunes', 'martes', 'miércoles', 'jueves', 'viernes'], DIG = [[1, 2], [3, 4], [5, 6], [7, 8], [9, 0]];
  var LIC = { C2: 2, C3: 3 };
  var state = { q: '', tipo: '', estado: '', view: 'cards', mx: { q: '', tipo: '', ruta: '', kg: '', req: {} } };
  var HOY = new Date(A.hoy); HOY.setHours(0, 0, 0, 0);

  /* ---------- utilidades de dominio ---------- */
  function vehs() { return A.vehiculos; }
  function driver(id) { return A.idx.conductores[id] || null; }
  function initials(n) { return n; }
  function daysTo(ymd) { if (!ymd) return null; var p = String(ymd).split('-'); return Math.round((new Date(+p[0], +p[1] - 1, +p[2]) - HOY) / 86400000); }
  function docChip(ymd) { var d = daysTo(ymd); if (d == null) return UI.chip('Sin dato', { tone: 'neutral' }); if (d < 0) return UI.chip('Vencido hace ' + (-d) + ' d', { tone: 'danger' }); if (d <= 60) return UI.chip('Vence en ' + d + ' d', { tone: 'warning' }); return UI.chip('Vigente', { tone: 'success' }); }
  function docWorst(v) { return Math.min(daysTo(v.soat), daysTo(v.tecnomecanica)); }
  function digitDia(placa) { var dg = parseInt(String(placa).replace(/\D/g, '').slice(-1), 10), r = -1; DIG.forEach(function (p, k) { if (p.indexOf(dg) > -1) r = k; }); return { dig: dg, idx: r, dia: DIAS[r] }; }
  function activeDsp(placa) { return A.despachos.filter(function (d) { return d.vehiculoId === placa && (d.estado === 'En ruta' || d.estado === 'Cargando'); })[0] || null; }
  function planTrip(placa) { return A.plan.viajes.filter(function (v) { return v.vehiculoId === placa; })[0] || null; }
  function rutaN(id) { return A.idx.rutas[id] ? A.idx.rutas[id].nombre : id; }
  function ejesNombre(n) { return n + ' ejes'; }
  function geoVol(v) { return v.largoM * v.anchoM * v.altoM; }
  function defCompat(o) { var plan = o.carroceria === 'Planchón' || o.tipo === 'Tractomula'; return { largaMas6m: plan, montacargas: o.carroceria !== 'Furgón', protegeHumedad: o.carroceria === 'Furgón' || o.carroceria === 'Estacas', lamina: o.carroceria !== 'Estacas' || o.pesoMaxKg > 3000 }; }
  function num(s) { if (typeof s === 'number') return s; s = String(s == null ? '' : s).trim().replace(/\s/g, ''); if (!s) return NaN; if (/,/.test(s)) s = s.replace(/\./g, '').replace(',', '.'); return parseFloat(s); }
  function fnum(n, d) { return F.num(n, d == null ? 1 : d); }
  function normPlaca(s) { var t = String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); return /^[A-Z]{3}\d{3}$/.test(t) ? t.slice(0, 3) + ' ' + t.slice(3) : null; }
  var ESTADO_TONO = { 'Disponible': 'success', 'En ruta': 'info', 'Cargando': 'warning', 'Mantenimiento': 'warning', 'Inactivo': 'neutral' };

  /* aptitud por familia de producto (HU-029): derivada de las marcas de compatibilidad */
  var FAMILIAS = [
    { f: 'Varilla de 6 m', d: 'Barras corrugadas y lisas', t: function (v) { return v.largoM >= 6 ? ['Apto', 'success'] : v.largoM >= 4 ? ['Con condición', 'warning', 'Voladizo máx. 2 m con bandera'] : ['No apto', 'danger', 'Plataforma menor a 4 m']; } },
    { f: 'Varilla y viga de 12 m', d: 'Longitud mayor a 6 m', t: function (v) { return v.compatibilidad.largaMas6m ? ['Apto', 'success'] : ['No apto', 'danger', 'Exige planchón o tractomula']; } },
    { f: 'Malla electrosoldada', d: 'Paneles de 2,35 × 6 m', t: function (v) { return v.largoM >= 6 ? ['Apto', 'success'] : v.largoM >= 4 ? ['Con condición', 'warning', 'Voladizo máx. 2 m con bandera'] : ['No apto', 'danger', 'Plataforma menor a 4 m']; } },
    { f: 'Perfiles y tubería', d: 'Barras de 6 m', t: function (v) { return v.largoM >= 6 ? ['Apto', 'success'] : v.largoM >= 4 ? ['Con condición', 'warning', 'Voladizo máx. 2 m con bandera'] : ['No apto', 'danger', 'Plataforma menor a 4 m']; } },
    { f: 'Láminas', d: 'Estibas planas, montacargas', t: function (v) { return v.compatibilidad.lamina ? (v.compatibilidad.montacargas ? ['Apto', 'success'] : ['Con condición', 'warning', 'Cargue lateral sin montacargas']) : ['No apto', 'danger', 'Carrocería sin soporte para lámina']; } },
    { f: 'Teja y cemento', d: 'Sensibles a la humedad', t: function (v) { return v.compatibilidad.protegeHumedad ? (v.carroceria === 'Furgón' ? ['Apto', 'success'] : ['Con condición', 'warning', 'Cubrir con carpa']) : ['No apto', 'danger', 'Sin protección contra la lluvia']; } },
    { f: 'Alambre y puntilla', d: 'Rollos y cajas', t: function (v) { return v.compatibilidad.protegeHumedad ? ['Apto', 'success'] : ['Con condición', 'warning', 'Cubrir con carpa']; } }
  ];

  /* ---------- validación (compartida: registro y edición) ---------- */
  function validate(o, ctx) {
    var e = {}; ctx = ctx || {};
    if (ctx.isNew) {
      var pn = normPlaca(o.placa);
      if (!String(o.placa || '').trim()) e.placa = 'Escribe la placa del vehículo.';
      else if (!pn) e.placa = 'Formato inválido. Usa tres letras y tres números, por ejemplo ABC 123.';
      else if (A.idx.vehiculos[pn]) { var ex = A.idx.vehiculos[pn]; e.placa = 'La placa ' + pn + ' ya está registrada (' + ex.tipo + ' ' + ex.marca + ' ' + ex.modelo + '). No se permiten duplicados.'; }
    }
    if (!String(o.marca || '').trim()) e.marca = 'Indica la marca.';
    if (!String(o.modelo || '').trim()) e.modelo = 'Indica el modelo o línea.';
    var yr = num(o.anio); if (isNaN(yr) || yr < 1990 || yr > HOY.getFullYear() + 1) e.anio = 'Año entre 1990 y ' + (HOY.getFullYear() + 1) + '.';
    var kg = num(o.pesoMaxKg); if (isNaN(kg) || kg <= 0) e.pesoMaxKg = 'La capacidad de peso debe ser mayor que cero.'; else if (kg > 60000) e.pesoMaxKg = 'Supera el máximo legal de 60.000 kg para vehículos de carga.';
    var vm = num(o.volumenMaxM3); if (isNaN(vm) || vm <= 0) e.volumenMaxM3 = 'El volumen debe ser mayor que cero.';
    var L = num(o.largoM), W = num(o.anchoM), H = num(o.altoM);
    if (isNaN(L) || L <= 0) e.largoM = 'Largo mayor que cero.'; else if (L > 14) e.largoM = 'Máximo 14 m de plataforma.';
    if (isNaN(W) || W <= 0) e.anchoM = 'Ancho mayor que cero.'; else if (W > 2.6) e.anchoM = 'El ancho máximo permitido es 2,6 m.';
    if (isNaN(H) || H <= 0) e.altoM = 'Alto mayor que cero.'; else if (H > 4.4) e.altoM = 'El alto máximo es 4,4 m.';
    if (!e.largoM && !e.anchoM && !e.altoM && !e.volumenMaxM3) { var gv = L * W * H; if (vm > gv * 1.05) e.volumenMaxM3 = 'El volumen declarado (' + fnum(vm) + ' m³) supera el geométrico L × A × H (' + fnum(gv) + ' m³). Corrige las dimensiones o el volumen.'; }

      fld('carroceria', 'Carrocería', sel('carroceria', CARROC, 'Estacas')) + '</div></div>' +
      '<div class="vd-sec"><h3>Capacidad y dimensiones</h3><div class="form-grid c2">' +
      fld('pesoMaxKg', 'Capacidad de peso (kg)', inp('pesoMaxKg', '', { inputmode: 'decimal', ph: '4000' })) + fld('volumenMaxM3', 'Capacidad de volumen (m³)', inp('volumenMaxM3', '', { inputmode: 'decimal', ph: '17' })) +
      fld('largoM', 'Largo (m)', inp('largoM', '', { inputmode: 'decimal', ph: '4,2' })) + fld('anchoM', 'Ancho (m)', inp('anchoM', '', { inputmode: 'decimal', ph: '2,0' })) +
      fld('altoM', 'Alto (m)', inp('altoM', '', { inputmode: 'decimal', ph: '2,0' })) + fld('ejes', 'Ejes', inp('ejes', '2', { inputmode: 'numeric' })) +
      fld('estibas', 'Estibas que caben', inp('estibas', '', { inputmode: 'numeric', ph: '6' })) + '</div></div>' +
      '<div class="vd-sec"><h3>Operación</h3><div class="stack">' + fld('conductorId', 'Conductor', sel('conductorId', driverOpts('', 'Turbo'), ''), { opt: true }) +
      '<div data-f="rutas"><div class="label mb-2">Cobertura geográfica</div>' + covChips(cov) + '<span class="error-text" hidden></span></div>' +
      sw('requiereAyudante', 'Requiere ayudante', false, 'Marca esta opción para tractomulas y dobletroques con cargue manual.') + '</div></div></div>';
    UI.modal({ title: 'Registrar vehículo', subtitle: 'El vehículo queda disponible para planeación en cuanto lo guardes.', width: 720, body: '', onOpen: function (api) { api.body.innerHTML = body; bindCov(api.body, cov); var f = $('#f-placa', api.body); if (f) f.focus(); },
      footer: [{ label: 'Cancelar', kind: 'ghost' }, { label: 'Registrar vehículo', kind: 'primary', icon: 'check', onClick: function (api) {
        var b = api.body, o = { rutas: cov, compat: {} };
        $$('[data-k]', b).forEach(function (el) { o[el.dataset.k] = el.type === 'checkbox' ? el.checked : el.value; });
        o.compat = defCompat({ carroceria: o.carroceria, tipo: o.tipo, pesoMaxKg: num(o.pesoMaxKg) });
        var errs = validate(o, { isNew: true }); showErrors(b, errs);
        if (Object.keys(errs).length) { var f = $('[data-f].is-invalid input,[data-f].is-invalid select', b); if (f) f.focus(); UI.toast('Corrige los campos marcados para registrar el vehículo.', 'error'); return false; }
        var placa = normPlaca(o.placa), cd = o.conductorId || null, c = cd ? driver(cd) : null;
        var nv = { placa: placa, tipo: o.tipo, marca: o.marca.trim(), modelo: o.modelo.trim(), anio: num(o.anio), pesoMaxKg: num(o.pesoMaxKg), volumenMaxM3: num(o.volumenMaxM3), largoM: num(o.largoM), anchoM: num(o.anchoM), altoM: num(o.altoM), ejes: num(o.ejes), carroceria: o.carroceria, estibas: num(o.estibas), requiereAyudante: !!o.requiereAyudante, conductorId: cd,
          rutasCobertura: A.rutas.map(function (r) { return r.rutaId; }).filter(function (id) { return cov.indexOf(id) > -1; }), estado: 'Disponible', restricciones: { picoPlacaCarga: { ciudad: 'Manizales', diaRestriccion: digitDia(placa).dia, horario: '06:00–09:00 y 16:00–19:00', aplicaHoy: false }, centro: num(o.pesoMaxKg) > 3500 ? 'Sin ingreso al centro ampliado (> 3,5 t)' : 'Sin restricción de tonelaje en el centro', alturaMaxM: o.tipo === 'Tractomula' ? 4.4 : 4.1 }, compatibilidad: o.compat,
          soat: A.ymd(365), tecnomecanica: A.ymd(365), gps: true, ultimoMantenimiento: A.ymd(0), kmOdometro: 0, sedeId: A.sedeActual };
        var hoyIdx = HOY.getDay() - 1; nv.restricciones.picoPlacaCarga.aplicaHoy = hoyIdx >= 0 && hoyIdx <= 4 && digitDia(placa).idx === hoyIdx;
        A.vehiculos.push(nv); A.idx.vehiculos[placa] = nv;
        if (c) { if (c.vehiculoId && A.idx.vehiculos[c.vehiculoId]) A.idx.vehiculos[c.vehiculoId].conductorId = null; c.vehiculoId = placa; }
        renderKpis(); drawFilters(); drawFleet(); drawMx();
        UI.toast('Vehículo ' + placa + ' registrado y disponible para planeación.', 'success');
        setTimeout(function () { openVehicle(placa, 't-doc'); }, 260);
      } }] });
  }

  /* ---------- eventos ---------- */
  var mainTabs = UI.tabs($('#mainTabs'), { onChange: function (id) { if (id === 'pMx') drawMx(); } });
  $('#q').addEventListener('input', function (e) { state.q = e.target.value; drawFleet(); });
  $('#fTipo').addEventListener('change', function (e) { state.tipo = e.target.value; drawFleet(); });
  $('#fEstado').addEventListener('click', function (e) { var b = e.target.closest('[data-e]'); if (!b) return; state.estado = b.dataset.e; drawFilters(); drawFleet(); });
  $('#viewSeg').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; state.view = b.dataset.v; $$('button', $('#viewSeg')).forEach(function (x) { x.setAttribute('aria-pressed', x === b); }); drawFleet(); });
  $('#fleetCards').addEventListener('click', function (e) {
    if (e.target.closest('[data-empty-action]')) { state.q = ''; state.tipo = ''; state.estado = ''; $('#q').value = ''; drawFilters(); drawFleet(); return; }
    var c = e.target.closest('[data-placa]'); if (c) openVehicle(c.dataset.placa);
  });
  $('#fleetCards').addEventListener('keydown', function (e) { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-placa]')) { e.preventDefault(); openVehicle(e.target.dataset.placa); } });
  $('#pMx').addEventListener('click', function (e) {
    if (e.target.closest('[data-empty-action]')) { state.mx = { q: '', tipo: '', ruta: '', kg: '', req: {} }; drawMxTools(); drawMx(); return; }
    var r = e.target.closest('tr[data-placa]'); if (r) openVehicle(r.dataset.placa);
  });
  $('#pMx').addEventListener('keydown', function (e) { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('tr[data-placa]')) { e.preventDefault(); openVehicle(e.target.dataset.placa); } });
  $('#addBtn').addEventListener('click', openCreate);

  /* arranque con skeleton breve */
  $('#kpiRow').innerHTML = [1, 2, 3, 4, 5].map(function () { return '<div class="card kpi"><span class="skeleton sk-line" style="width:50%"></span><span class="skeleton" style="height:34px;width:60%"></span><span class="skeleton sk-line" style="width:70%"></span></div>'; }).join('');
  $('#fleetCards').innerHTML = '<div class="veh-grid">' + [1, 2, 3, 4, 5, 6].map(function () { return '<div class="card veh-card"><span class="skeleton" style="height:34px;width:60%"></span><span class="skeleton sk-line" style="width:80%"></span><span class="skeleton" style="height:50px"></span><span class="skeleton sk-line" style="width:50%"></span></div>'; }).join('') + '</div>';
  drawMxTools();
  setTimeout(function () {
    renderKpis(); drawFilters(); drawFleet(); drawMx();
    var p = UI.param('placa'); if (p) { var norm = p.toUpperCase().replace(/[^A-Z0-9]/g, ''); var found = vehs().filter(function (v) { return v.placa.replace(/\s/g, '') === norm; })[0]; if (found) openVehicle(found.placa); else UI.toast('No encontramos el vehículo con placa ' + p + '.', 'warning'); }
  }, 320);
});
</script>
</body>
</html>
