<script>try{var t=localStorage.getItem('arm.theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  select.select.input-sm { padding-right: 32px; }

  /* Layout específico de despachos */
  .kpi-row { display: grid; gap: 12px; grid-template-columns: repeat(5, minmax(0, 1fr)); }
  @media (max-width: 1099px) { .kpi-row { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 639px) { .kpi-row { grid-template-columns: repeat(2, minmax(0, 1fr)); } .kpi-row > :last-child:nth-child(odd) { grid-column: span 2; } .kpi .kpi-value { font-size: 26px; } .kpi { padding: 12px; } }
  .kpi.is-active { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
  :root[data-theme="dark"] .kpi.is-active { border-color: var(--text); box-shadow: 0 0 0 1px var(--text); }
  .view-bar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; margin: 20px 0 12px; }
  .board { display: grid; gap: 12px; grid-template-columns: repeat(5, minmax(220px, 1fr)); overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin; }
  .b-col { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r-card); min-width: 0; display: flex; flex-direction: column; }
  .b-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px; font-weight: 600; font-size: 13.5px; }
  .b-list { display: grid; gap: 8px; padding: 0 8px 8px; align-content: start; min-height: 80px; }
  .b-card { text-align: left; width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-ctl); padding: 10px 12px; display: grid; gap: 6px; box-shadow: var(--shadow-1); transition: border-color .12s; }
  .b-card:hover { border-color: var(--border-strong); }
  .b-card .bc-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .b-card .bc-sub { font-size: 12.5px; color: var(--text-2); }
  .b-empty { font-size: 12.5px; color: var(--text-3); padding: 14px 6px; text-align: center; }
  .head-block { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .link-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .mini-stat { padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--r-ctl); background: var(--surface-2); }
  .mini-stat .v { font-family: var(--font-display); font-weight: 600; font-size: 22px; line-height: 1.1; font-variant-numeric: tabular-nums; } .mini-stat .l { font-size: 12px; color: var(--text-2); }
  .wiz-steps { margin-bottom: 18px; }
  .wiz-actions { display: flex; gap: 8px; justify-content: flex-end; padding-top: 16px; margin-top: 18px; border-top: 1px solid var(--border); flex-wrap: wrap; }
  .pick { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--r-ctl); cursor: pointer; }
  .pick:hover { background: var(--surface-2); } .pick:has(input:checked) { border-color: var(--blue); background: color-mix(in srgb, var(--blue) 7%, var(--surface)); }
  .pick.is-dup { background: var(--surface-2); }
  .pick .o-sub { font-size: 12.5px; color: var(--text-2); }
  .chk { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .chk:last-child { border-bottom: 0; }
  .chk-ico { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; }
  .chk-ico .icon { width: 14px; height: 14px; }
  .chk-ico.ok { background: var(--green-bg); color: var(--green-fg); } .chk-ico.warn { background: var(--amber-bg); color: var(--amber-fg); } .chk-ico.block { background: var(--red-bg); color: var(--red-fg); }
  .chk .c-t { font-weight: 500; } .chk .c-s { font-size: 12.5px; color: var(--text-2); margin-top: 1px; }
  .res-row { display: grid; grid-template-columns: minmax(0, 1fr) 190px; gap: 8px 12px; align-items: start; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .res-row:last-child { border-bottom: 0; }
  @media (max-width: 559px) { .res-row { grid-template-columns: minmax(0, 1fr); } }
  .res-row .r-sub { font-size: 12.5px; color: var(--text-2); }
  .doc-sheet { background: var(--surface); border: 1px solid var(--border-strong); border-radius: 6px; padding: 24px; font-size: 13px; }
  .doc-head { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; border-bottom: 2px solid var(--ink); padding-bottom: 14px; flex-wrap: wrap; }
  :root[data-theme="dark"] .doc-head { border-color: var(--text); }
  .doc-head img { height: 34px; width: auto; }
  .doc-title { font-family: var(--font-display); font-size: 26px; font-weight: 700; line-height: 1.1; }
  .doc-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 24px; margin: 14px 0; }
  .doc-grid div span { display: block; font-size: 11.5px; color: var(--text-2); text-transform: uppercase; letter-spacing: .04em; }
  .doc-sheet table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .doc-sheet th, .doc-sheet td { border: 1px solid var(--border-strong); padding: 6px 8px; text-align: left; vertical-align: top; }
  .doc-sheet th { background: var(--surface-3); font-weight: 600; }
  .doc-sign { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; margin-top: 40px; }
  .doc-sign div { border-top: 1px solid var(--text-2); padding-top: 6px; font-size: 12px; color: var(--text-2); text-align: center; }
  @media (max-width: 559px) { .doc-sheet { padding: 14px; } .doc-grid, .doc-sign { grid-template-columns: minmax(0, 1fr); gap: 14px; } .doc-sheet .tbl-scroll { overflow-x: auto; } }
  @media print {
    body * { visibility: hidden !important; }
    .doc-sheet, .doc-sheet * { visibility: visible !important; }
    .doc-sheet { position: absolute; left: 0; top: 0; width: 100%; border: 0; }
    .overlay { background: none !important; }
  }
</style>

<body data-page="despachos">
<main id="app">
  <header class="page-head">
    <div class="ph-text">
      <div class="page-eyebrow">Operación</div>
      <h1 class="page-title">Gestión de despachos</h1>
      <p class="page-desc">Genera órdenes de despacho desde los viajes confirmados, registra la salida de cada vehículo y cierra con el resultado por pedido.</p>
    </div>
    <div class="page-actions">
      <a class="btn btn-secondary" href="seguimiento.html"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 11 19-9-9 19-2-8z"/></svg>Seguimiento</a>
      <button type="button" class="btn btn-primary" id="newBtn"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Generar orden de despacho</button>
    </div>
  </header>

  <section aria-label="Resumen por estado"><div class="kpi-row" id="kpiRow"></div></section>

  <div class="view-bar">
    <h2 class="section-title" id="listTitle">Todos los despachos</h2>
    <div class="segmented" role="group" aria-label="Vista" id="viewSeg"><button type="button" data-v="tabla" aria-pressed="true">Tabla</button><button type="button" data-v="tablero" aria-pressed="false">Tablero</button></div>
  </div>
  <div id="tableHost"></div>
  <div id="boardHost" hidden></div>
</main>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
UI.ready(function () {
  var A = ARM, F = UI.fmt, esc = UI.esc, $ = UI.$, $$ = UI.$$, ic = UI.icon;
  var HOY = A.ymd(0), MANANA = A.ymd(1);
  var ESTADOS = ['Programado', 'En cargue', 'En ruta', 'Cerrado', 'Reprogramado'];
  var TONE = { 'Programado': 'neutral', 'En cargue': 'warning', 'En ruta': 'info', 'Cerrado': 'success', 'Reprogramado': 'danger' };
  var PREF = A.despachos[0].despachoId.slice(0, 8), nextNum = Math.max.apply(null, A.despachos.map(function (d) { return +d.despachoId.slice(9); })) + 1;
  var MOTIVOS = ['Falla mecánica del vehículo', 'Cierre vial en la ruta', 'Pico y placa de carga', 'Cliente solicita aplazar la entrega', 'Preparación sin certificar', 'Otro motivo'];
  function chipE(e) { return UI.chip(e, { tone: TONE[e] }); }
  function ped(id) { return A.idx.pedidos[id]; }
  function veh(pl) { return A.idx.vehiculos[pl]; }
  function cond(id) { return A.idx.conductores[id]; }
  function plural(n, s, p) { return n + ' ' + (n === 1 ? s : p); }
  function dtLocal(d) { var p = function (n) { return ('0' + n).slice(-2); }; return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes()); }
  function errTxt(el, msg) { el.hidden = false; el.innerHTML = ic('alert-circle', 'icon-sm') + esc(msg); }

  /* ---------- datos: despachos reales + órdenes ya generadas desde el plan ---------- */
  var rows = A.despachos.map(function (d) { return { id: d.despachoId, estado: d.estado === 'Cargando' ? 'En cargue' : d.estado, placa: d.vehiculoId, rutaId: d.rutaId, conductorId: d.conductorId, pedidoIds: d.pedidoIds.slice(), kg: d.pesoKg, m3: d.volumenM3, util: d.utilizacionPesoPct, utilVol: d.utilizacionVolPct, salida: d.fechaSalida || d.salidaPrevista, fecha: d.fecha, paradas: d.paradas, entregadas: d.entregadas, km: d.kmEstimados, viajeId: null, fechaCierre: d.fechaCierre, real: true }; });
  var ordenDe = {};
  function fromViaje(vj, estado, extra) {
    var v = veh(vj.vehiculoId), id = PREF + '-' + ('00' + (nextNum++)).slice(-3), r = { id: id, estado: estado, placa: vj.vehiculoId, rutaId: vj.rutaId, conductorId: v.conductorId, pedidoIds: vj.pedidoIds.slice(), kg: pesoDe(vj.pedidoIds), m3: volDe(vj.pedidoIds), salida: vj.salidaPrevista, fecha: HOY, paradas: vj.pedidoIds.length, entregadas: 0, km: vj.kmEstimados, viajeId: vj.viajeId, real: false };
    r.util = Math.round(r.kg / v.pesoMaxKg * 100); r.utilVol = Math.round(r.m3 / v.volumenMaxM3 * 100); for (var k in extra) r[k] = extra[k]; ordenDe[vj.viajeId] = id; rows.push(r); return r;
  }
  function pesoDe(ids) { return Math.round(ids.reduce(function (s, i) { return s + ped(i).pesoKg; }, 0) * 10) / 10; }
  function volDe(ids) { return Math.round(ids.reduce(function (s, i) { return s + ped(i).volumenM3; }, 0) * 100) / 100; }
  var PV = {}; A.plan.viajes.forEach(function (v) { PV[v.viajeId] = v; });
  fromViaje(PV['VJ-2'], 'Programado'); fromViaje(PV['VJ-3'], 'Programado');
  fromViaje(PV['VJ-5'], 'Reprogramado', { fecha: MANANA, nuevaFecha: MANANA + 'T06:00', motivo: 'Cierre vial en la ruta', detalleMotivo: 'Cierre por derrumbe en la vía Bogotá – Tunja; se reprograma para mañana a primera hora.' });
  function byId(id) { return rows.filter(function (r) { return r.id === id; })[0]; }
  function pendCargue(r) { return A.cargue.filter(function (c) { return c.despachoId === r.id && c.estado === 'Pendiente'; }).length; }

  /* ---------- KPIs por estado y tabla ---------- */
  var filtroE = '';
  function renderKpis() {
    var icons = { 'Programado': 'calendar', 'En cargue': 'layers', 'En ruta': 'truck', 'Cerrado': 'check-circle', 'Reprogramado': 'refresh' };
    $('#kpiRow').innerHTML = ESTADOS.map(function (e) { var n = rows.filter(function (r) { return r.estado === e; }).length, kg = rows.filter(function (r) { return r.estado === e; }).reduce(function (s, r) { return s + r.kg; }, 0); return UI.kpi({ id: e, label: e, icon: icons[e], value: n, note: n ? F.ton(kg) : 'Sin despachos', onClick: true }); }).join('');
    $$('#kpiRow .kpi').forEach(function (k) { var on = k.dataset.kpi === filtroE; k.classList.toggle('is-active', on); k.setAttribute('aria-pressed', on); });
  }
  $('#kpiRow').addEventListener('click', function (e) { var k = e.target.closest('[data-kpi]'); if (!k) return; setFiltro(filtroE === k.dataset.kpi ? '' : k.dataset.kpi); });
  function setFiltro(v) { filtroE = v; tbl.setFilter('estado', v); renderKpis(); renderBoard(); $('#listTitle').textContent = v ? 'Despachos · ' + v : 'Todos los despachos'; }

  var tbl = UI.table($('#tableHost'), {
    rows: rows, rowKey: 'id', pageSize: 8, caption: 'Despachos', emptyText: 'No hay despachos con estos filtros.', searchable: { placeholder: 'Buscar por despacho, placa, ruta o conductor' }, sort: { key: 'salida', dir: 'desc' },
    searchKeys: ['id', 'placa', 'rutaId'],
    filters: [{ key: 'estado', label: 'Estado', all: 'Todos los estados', options: ESTADOS }, { key: 'rutaId', label: 'Ruta', all: 'Todas las rutas', options: A.rutas.map(function (r) { return { value: r.rutaId, label: r.nombre }; }) }],
    columns: [
      { key: 'id', label: 'Despacho', mono: true },
      { key: 'placa', label: 'Vehículo', title: true, render: function (r) { return UI.plate(r.placa) + '<div class="cell-sub">' + esc(veh(r.placa).tipo) + ' · ' + esc(cond(r.conductorId).nombre) + '</div>'; } },
      { key: 'rutaId', label: 'Ruta', value: function (r) { return A.idx.rutas[r.rutaId].nombre; }, render: function (r) { return esc(A.idx.rutas[r.rutaId].nombre) + '<div class="cell-sub">' + r.rutaId + '</div>'; } },
      { key: 'paradas', label: 'Pedidos', num: true, hideMobile: true, render: function (r) { return r.estado === 'En ruta' ? r.entregadas + ' / ' + r.paradas : r.paradas; } },
      { key: 'kg', label: 'Carga', num: true, render: function (r) { return F.kg(r.kg) + '<div class="cell-sub">' + r.util + ' % de la capacidad</div>'; } },
      { key: 'salida', label: 'Salida', render: function (r) { var d = r.estado === 'Reprogramado' ? r.nuevaFecha : r.salida; return '<span class="nowrap">' + (String(d).slice(0, 10) === HOY ? 'Hoy' : F.fecha(d)) + ' · ' + F.hora(d) + '</span>' + (r.estado === 'Programado' || r.estado === 'En cargue' ? '<div class="cell-sub">prevista</div>' : ''); } },
      { key: 'estado', label: 'Estado', render: function (r) { return chipE(r.estado); } }
    ],
    onRowClick: function (r) { openDsp(r.id); },
    actions: function (r) { return [{ label: 'Ver detalle', icon: 'eye', onClick: function () { openDsp(r.id); } }, { label: 'Ver orden de despacho', icon: 'file-text', onClick: function () { orderDoc(r.id); } }, { sep: true }, { label: 'Seguimiento', icon: 'navigation', href: 'seguimiento.html', disabled: r.estado !== 'En ruta' }, { label: 'Cargue', icon: 'layers', href: 'cargue.html' }, { label: 'Evidencias', icon: 'camera', href: 'evidencias.html' }]; }
  });

  /* ---------- tablero (HU-117) ---------- */
  function renderBoard() {
    $('#boardHost').innerHTML = '<div class="board">' + ESTADOS.map(function (e) {
      var l = rows.filter(function (r) { return r.estado === e; });
      return '<section class="b-col" aria-label="' + e + '"><div class="b-head"><span>' + chipE(e) + '</span><span class="muted">' + l.length + '</span></div><div class="b-list">' + (l.length ? l.map(function (r) {
        return '<button type="button" class="b-card" data-open="' + r.id + '"><span class="bc-top">' + UI.plate(r.placa) + '<span class="mono t-12 muted">' + r.id.slice(5) + '</span></span><span class="strong">' + esc(A.idx.rutas[r.rutaId].nombre) + '</span><span class="bc-sub">' + esc(cond(r.conductorId).nombre) + '</span>' + (e === 'En ruta' ? UI.meter(r.entregadas, r.paradas, { level: 'info', text: r.entregadas + ' / ' + r.paradas, label: 'Paradas' }) : UI.meter(r.util, 100, { label: 'Utilización' })) + '<span class="bc-sub">' + F.kg(r.kg) + ' · ' + plural(r.paradas, 'pedido', 'pedidos') + '</span></button>'; }).join('') : '<div class="b-empty">Sin despachos en este estado</div>') + '</div></section>'; }).join('') + '</div>';
  }
  $('#boardHost').addEventListener('click', function (e) { var b = e.target.closest('[data-open]'); if (b) openDsp(b.dataset.open); });
  $('#viewSeg').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; $$('button', this).forEach(function (x) { x.setAttribute('aria-pressed', x === b); }); $('#tableHost').hidden = b.dataset.v !== 'tabla'; $('#boardHost').hidden = b.dataset.v !== 'tablero'; });
  function refreshAll() { tbl.setRows(rows); if (filtroE) tbl.setFilter('estado', filtroE); renderKpis(); renderBoard(); }

  /* ---------- detalle (HU-114/116/118/119) ---------- */
  function openDsp(id) {
    var r = byId(id); if (!r) return; var v = veh(r.placa), c = cond(r.conductorId), rt = A.idx.rutas[r.rutaId], pend = pendCargue(r);
    var step = function (l, k) { var order = { 'Programado': 0, 'En cargue': 1, 'En ruta': 2, 'Cerrado': 3, 'Reprogramado': 0 }, cur = order[r.estado]; return { label: l, state: r.estado === 'Reprogramado' && k === 0 ? 'error' : k < cur ? 'done' : k === cur ? (r.estado === 'Cerrado' ? 'done' : 'current') : 'pending' }; };
    var pedRows = r.pedidoIds.map(function (pid, i) {
      var p = ped(pid), pa = A.paradas.filter(function (x) { return x.pedidoId === pid && x.despachoId === r.id; })[0], st = r.resultados && r.resultados[pid] ? r.resultados[pid] : pa ? ({ Entregada: 'Entregado', Parcial: 'Entrega parcial', Fallida: 'Fallido' }[pa.estado] || pa.estado) : p.estado;
      return '<tr><td class="num">' + (i + 1) + '</td><td><a class="mono" href="pedidos.html?id=' + encodeURIComponent(pid) + '">' + pid + '</a><div class="cell-sub"><a href="clientes.html?id=' + p.clienteId + '">' + esc(p.cliente) + '</a></div></td><td class="num">' + F.kg(p.pesoKg) + '</td><td>' + UI.chip(st, { small: true, tone: st === 'Pendiente' || st === 'En camino' ? 'neutral' : undefined }) + '</td></tr>'; }).join('');
    var body = '<div class="stack-lg">' +
      '<div class="head-block">' + UI.plate(r.placa, { large: true }) + '<div><div class="strong">' + esc(v.tipo + ' · ' + v.marca + ' ' + v.modelo) + '</div><div class="muted t-13">' + esc(v.carroceria) + ' · ' + F.kg(v.pesoMaxKg) + ' · ' + F.m3(v.volumenMaxM3, 0) + '</div></div></div>' +
      UI.kv([['Ruta', '<a href="rutas.html">' + esc(rt.nombre) + '</a>&nbsp; <span class="mono muted">' + rt.rutaId + '</span>'], ['Conductor', esc(c.nombre) + ' · ' + esc(c.telefono)], ['Licencia', c.licencia + ' · vence ' + F.fecha(c.licenciaVence)], ['Vehículo', '<a href="vehiculos.html?placa=' + encodeURIComponent(r.placa) + '">Ver ficha de ' + esc(r.placa) + '</a>'], [r.estado === 'Programado' || r.estado === 'En cargue' ? 'Salida prevista' : r.estado === 'Reprogramado' ? 'Reprogramado para' : 'Salida', F.fecha(r.estado === 'Reprogramado' ? r.nuevaFecha : r.salida) + ' · ' + F.hora(r.estado === 'Reprogramado' ? r.nuevaFecha : r.salida)]].concat(r.precinto ? [['Precinto', '<span class="mono">' + esc(r.precinto) + '</span>'], ['Kilometraje de salida', F.num(r.kmSalida) + ' km']] : []).concat(r.viajeId ? [['Viaje de origen', '<a href="planeacion.html">' + r.viajeId + '</a>']] : [])) +
      '<div>' + UI.stepper([step('Programado', 0), step('En cargue', 1), step('En ruta', 2), step('Cerrado', 3)]) + '</div>' +
      (r.estado === 'Reprogramado' ? UI.banner({ tone: 'warning', title: 'Reprogramado · ' + r.motivo, text: (r.detalleMotivo || '') + ' Nueva salida: ' + F.fecha(r.nuevaFecha) + ' ' + F.hora(r.nuevaFecha) + '.' }) : '') +
      (r.estado === 'En cargue' && pend ? UI.banner({ tone: 'warning', title: plural(pend, 'pedido sin', 'pedidos sin') + ' confirmar en el cargue', text: 'Confirma el cargue antes de registrar la salida o autoriza la salida con excepción.' }) : '') +
      (r.estado === 'Cerrado' && r.cierreObs ? UI.banner({ tone: 'success', title: 'Despacho cerrado', text: r.cierreObs }) : '') +

      }
      host.innerHTML = h + '<div class="wiz-actions">' + actions + '</div>';
      var o = $('#wzOpen', host); if (o) o.addEventListener('click', function (e) { e.preventDefault(); var id = ordenDe[st.vj]; m.close(); setTimeout(function () { openDsp(id); }, 200); });
    }
    host.addEventListener('change', function (e) { if (e.target.name === 'vj') { st.vj = e.target.value; render(); } else if (e.target.id === 'wzExcl') st.excl = e.target.checked; else if (e.target.id === 'wzNot') st.notif = e.target.checked; });
    host.addEventListener('click', function (e) {
      var b = e.target.closest('[data-x]'); if (!b) return; var x = b.dataset.x;
      if (x === 'cancel') m.close();
      else if (x === 'back') { st.step--; render(); }
      else if (x === 'next') {
        if (st.step === 0) { if (!st.vj) { var er = $('#wzE', host); er.hidden = false; er.innerHTML = ic('alert-circle', 'icon-sm') + 'Selecciona el viaje para el que se genera la orden.'; return; } st.step = 1; render(); }
        else { var val = validar(PV[st.vj]), er2 = $('#wzE', host);
          if (val.hardBlock) { UI.toast('Hay validaciones que bloquean la orden. Resuélvelas en vehículos o conductores.', 'error'); return; }
          if (!val.habil.length) { UI.toast('Ningún pedido del viaje está habilitado todavía.', 'error'); return; }
          if (val.bloq.length && !st.excl) { er2.hidden = false; er2.innerHTML = ic('alert-circle', 'icon-sm') + 'Confirma que generas la orden solo con los pedidos habilitados.'; return; }
          st.step = 2; render(); }
      } else if (x === 'gen') {
        var vj = PV[st.vj]; if (ordenDe[vj.viajeId]) { UI.toast('Ese viaje ya tiene una orden. No se genera un duplicado.', 'error'); return; }
        var ids = validar(vj).habil, copy = { viajeId: vj.viajeId, vehiculoId: vj.vehiculoId, rutaId: vj.rutaId, pedidoIds: ids, salidaPrevista: vj.salidaPrevista, kmEstimados: vj.kmEstimados };
        var r = fromViaje(copy, 'Programado'); m.close(); refreshAll(); UI.toast('Orden ' + r.id + ' generada con ' + plural(ids.length, 'pedido', 'pedidos') + '.', 'success', { title: 'Despacho programado' }); setTimeout(function () { openDsp(r.id); }, 250);
      }
    });
    render();
  }
  $('#newBtn').addEventListener('click', function () { wizard(); });

  /* arranque */
  renderKpis(); renderBoard();
  var pid = UI.param('id');
  if (pid) { if (byId(pid)) openDsp(pid); else UI.toast('No se encontró el despacho ' + pid + '. Revisa el identificador.', 'warning'); }
});
</script>
</body>
</html>
