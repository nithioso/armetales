<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auditoría y trazabilidad · Armetales</title>
<meta name="description" content="Registro inmutable de eventos de la plataforma: quién cambió qué, cuándo y desde dónde, con historial completo por pedido, despacho o reserva.">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<script>try{var t=localStorage.getItem('arm.theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/app.css">
<style>
  /* Layout específico de auditoría (tokens y componentes viven en app.css) */
  .kpi-row { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); margin-bottom: 20px; }
  @media (max-width: 639px) { .kpi-row { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; } .kpi .kpi-value { font-size: 28px; } .kpi { padding: 12px; } }
  .select.input-sm { padding-right: 30px; }
  .date-filter { display: flex; gap: 6px; align-items: center; font-size: 12.5px; color: var(--text-2); flex-wrap: wrap; }
  .date-filter .input { width: 138px; }
  @media (max-width: 639px) { .date-filter { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 10px; width: 100%; } .date-filter .input { width: 100%; } .date-filter .btn { grid-column: 1 / -1; justify-self: start; } }
  .seal { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: var(--r-pill); border: 1px solid var(--green-line); background: var(--green-bg); color: var(--green-fg); font-size: 12.5px; font-weight: 600; }
  .seal .icon { width: 14px; height: 14px; }
  .diff { border: 1px solid var(--border); border-radius: var(--r-ctl); overflow: hidden; font-size: 13px; }
  .diff-row { display: grid; grid-template-columns: minmax(84px, 28%) minmax(0, 1fr) minmax(0, 1fr); border-bottom: 1px solid var(--border); }
  .diff-row:last-child { border-bottom: 0; }
  .diff-row > div { padding: 8px 10px; overflow-wrap: anywhere; min-width: 0; }
  .diff-head { background: var(--surface-3); font-size: 11.5px; font-weight: 600; color: var(--text-2); text-transform: none; }
  .diff-field { font-family: var(--font-mono); font-size: 12px; color: var(--text-2); }
  .diff-row.is-same { color: var(--text-3); }
  .diff-cell.del { background: var(--red-bg); color: var(--red-fg); }
  .diff-cell.add { background: var(--green-bg); color: var(--green-fg); }
  .diff-cell .sgn { font-weight: 700; margin-right: 6px; font-family: var(--font-mono); }
  .hash { font-family: var(--font-mono); font-size: 11.5px; line-height: 1.5; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--r-ctl); background: var(--surface-2); word-break: break-all; color: var(--text-2); }
  .hash b { color: var(--text); font-weight: 500; }
  .ent-search { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; }
  .sugg { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 10px; font-size: 12.5px; color: var(--text-2); }
  .hist-head { display: grid; gap: 16px; }
  @media (min-width: 900px) { .hist-head { grid-template-columns: minmax(0, 1fr) auto; align-items: center; } }
  .hist-stats { display: flex; flex-wrap: wrap; gap: 8px 28px; }
  .hist-stats .stat-v { font-family: var(--font-display); font-weight: 600; font-size: 22px; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .hist-stats .stat-l { font-size: 12px; color: var(--text-2); }
  .tl-src { margin-right: 8px; vertical-align: 1px; }
  .code { font-family: var(--font-mono); font-size: 12px; line-height: 1.55; padding: 12px 14px; border-radius: var(--r-ctl); background: var(--surface-3); border: 1px solid var(--border); white-space: pre-wrap; word-break: break-word; }
  @media print { .sidebar, .topbar, .page-actions, .shell-scrim { display: none !important; } .shell-main { margin-left: 0 !important; } }
  .kpi, .kpi .kpi-foot, .kpi .kpi-note { white-space: normal; }
  :root[data-theme="dark"] a.btn { color: var(--b-fg); } /* el color de enlace del tema oscuro pisaba el de los botones-enlace */
</style>
</head>
<body data-page="auditoria">
<main id="app">
  <header class="page-head">
    <div class="ph-text">
      <div class="page-eyebrow">Análisis</div>
      <h1 class="page-title">Auditoría y trazabilidad</h1>
      <p class="page-desc">Quién hizo qué, cuándo y desde dónde. Los registros son de solo anexado: nadie puede editarlos ni borrarlos.</p>
    </div>
    <div class="page-actions">
      <button type="button" class="btn btn-secondary" id="verifyBtn"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>Verificar integridad</button>
      <button type="button" class="btn btn-secondary" id="exportBtn" aria-haspopup="menu" aria-expanded="false"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>Exportar</button>
    </div>
  </header>

  <section aria-label="Indicadores de auditoría"><div class="kpi-row" id="kpiRow"></div></section>

  <div class="tabs" role="tablist" aria-label="Vistas de auditoría" id="mainTabs">
    <button type="button" class="tab" role="tab" id="tabLog" aria-controls="pnlLog" aria-selected="true">Registro de eventos <span class="count" id="logCount">0</span></button>
    <button type="button" class="tab" role="tab" id="tabHist" aria-controls="pnlHist" aria-selected="false">Historial por entidad</button>
  </div>

  <div class="tab-panel" role="tabpanel" id="pnlLog" aria-labelledby="tabLog"><div id="logTable"></div></div>

  <div class="tab-panel" role="tabpanel" id="pnlHist" aria-labelledby="tabHist" hidden>
    <div class="stack-lg">
      <div class="card"><div class="card-body">
        <form id="entForm" class="ent-search" novalidate>
          <div class="field" id="entField">
            <label class="label" for="entInput">Pedido, despacho o reserva</label>
            <div class="search"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input class="input" id="entInput" list="entList" autocomplete="off" placeholder="ES-489684, DSP-2611-018 o RSV-2611-0174"><datalist id="entList"></datalist></div>
            <div class="error-text" id="entErr" hidden></div>
          </div>
          <button type="submit" class="btn btn-primary" style="align-self:start;margin-top:22px">Armar historial</button>
        </form>
        <div class="sugg" id="sugg"></div>
      </div></div>
      <div id="histOut"></div>
    </div>
  </div>
</main>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
UI.ready(function () {
  var A = ARM, F = UI.fmt, esc = UI.esc, $ = UI.$;

  /* ---------- utilidades ---------- */
  function h53(s, seed) { var h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed, i, ch; for (i = 0; i < s.length; i++) { ch = s.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); } h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909); h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909); return ('00000000' + (h2 >>> 0).toString(16)).slice(-8) + ('00000000' + (h1 >>> 0).toString(16)).slice(-8); }
  function hash(s) { return h53(s, 1) + h53(s, 2) + h53(s, 3) + h53(s, 4); }
  function rn(e) { return parseInt(e.hash.slice(0, 8), 16); }
  function ymdLocal(d) { d = new Date(d); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  function usr(id) { return A.idx.usuarios[id] || null; }
  function nombreActor(id) { var u = usr(id); if (u) return u.nombre; var c = A.idx.conductores[id]; if (c) return c.nombre + ' (conductor)'; return id || 'Sistema'; }
  function fh(v) { return F.fecha(v) + ' · ' + F.hora(v); }
  function toast(m, t, o) { UI.toast(m, t, o); }
  function download(name, mime, text) { var blob = new Blob(['﻿' + text], { type: mime + ';charset=utf-8' }), a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500); }
  function csvCell(v) { v = v == null ? '' : String(v); return /[;"\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
  function toCsv(head, rows) { return [head.map(csvCell).join(';')].concat(rows.map(function (r) { return r.map(csvCell).join(';'); })).join('\r\n'); }

  var LINK = { 'Pedido': function (id) { return 'pedidos.html?id=' + encodeURIComponent(id); }, 'Despacho': function (id) { return 'despachos.html?id=' + encodeURIComponent(id); }, 'Vehículo': function (id) { return 'vehiculos.html?placa=' + encodeURIComponent(id); }, 'Cliente': function (id) { return 'clientes.html?id=' + encodeURIComponent(id); }, 'Reserva': function () { return 'reservas.html'; }, 'Ruta': function (id) { return 'rutas.html?id=' + encodeURIComponent(id); }, 'Usuario': function () { return 'usuarios.html'; }, 'Rol': function () { return 'usuarios.html'; }, 'Integración': function () { return 'integraciones.html'; }, 'Reporte': function () { return 'reportes.html'; }, 'Inventario': function () { return 'inventario.html'; } };
  function entHref(e) { return LINK[e.entidad] ? LINK[e.entidad](e.entidadId) : null; }

  /* ---------- eventos: copia local, cadena de huellas y diffs ---------- */
  var EV = A.auditoria.map(function (e) { var o = {}; Object.keys(e).forEach(function (k) { o[k] = e[k]; }); return o; });
  var CHAIN_SEED = 'armetales-audit-v1';
  function rechain() {
    var asc = EV.slice().sort(function (a, b) { return a.fechaHora < b.fechaHora ? -1 : a.fechaHora > b.fechaHora ? 1 : (a.registroId < b.registroId ? -1 : 1); }), prev = hash(CHAIN_SEED);
    asc.forEach(function (e) { e.prev = prev; e.hash = hash(prev + '|' + e.registroId + '|' + e.fechaHora + '|' + e.usuarioId + '|' + e.tipo + '|' + e.entidad + '|' + e.entidadId + '|' + (e.observaciones || '')); prev = e.hash; });
  }
  rechain();
  EV.forEach(function (e) { e.rol = usr(e.usuarioId) ? usr(e.usuarioId).rol : ''; e.fecha = ymdLocal(e.fechaHora); });
  function pickR(e, arr, off) { return arr[(rn(e) + (off || 0)) % arr.length]; }
  function find(col, key, id) { return A[col].filter(function (x) { return x[key] === id; })[0]; }

  /* diffOf → { cambios: [[campo, antes, después]], atributos: [[campo, valor]] } */
  function diffOf(e) {
    var D = [], at = null, r = rn(e), ped = e.entidad === 'Pedido' ? A.idx.pedidos[e.entidadId] : null, actor = e.usuario;
    switch (e.tipo) {
      case 'Modificación':
        if (e.entidad === 'Ruta') { D = [['secuencia de municipios', 'Mosquera → Madrid → Facatativá', 'Madrid → Mosquera → Facatativá'], ['kmTotales', '88,4', '91,0'], ['motivo', '—', 'Cierre parcial de la vía principal (cambio manual)'], ['vigencia', 'Vigente', 'Vigente']]; }
        else if (e.antes) { var a = e.antes.split(': '), b = e.despues.split(': '); D = [[a[0], a.slice(1).join(': '), b.slice(1).join(': ')], ['id', e.entidadId, e.entidadId], ['estado', 'Activo', 'Activo']]; }
        else D = [['id', e.entidadId, e.entidadId]];
        break;
      case 'Cambio de estado': var T = [['Recibido', 'Stock validado'], ['Stock validado', 'En firme'], ['En firme', 'En preparación'], ['En preparación', 'Listo para despacho'], ['Listo para despacho', 'Planificado']], t = T[r % T.length]; D = [['estado', t[0], t[1]], ['actualizadoPor', 'Sistema', actor], ['prioridad', ped ? ped.prioridad : 'Media', ped ? ped.prioridad : 'Media'], ['pedidoId', e.entidadId, e.entidadId]]; break;
      case 'Creación':
        if (e.entidad === 'Reserva') { var rv = find('reservas', 'reservaId', e.entidadId); D = [['reservaId', '—', e.entidadId], ['sku', '—', rv ? rv.sku : '1000241'], ['cantidad', '—', rv ? rv.cantidad + ' ' + rv.unidad.toLowerCase() + 's' : '40 unidades'], ['bodegaId', '—', rv ? rv.bodegaId : 'CEDI-BOG'], ['estado', '—', 'Activa']]; }
        else { var ds = A.idx.despachos[e.entidadId]; D = [['despachoId', '—', e.entidadId], ['vehículo', '—', ds ? ds.vehiculoId : 'WNK 482'], ['ruta', '—', ds ? ds.rutaId : 'R-01'], ['pedidos', '—', ds ? ds.pedidoIds.length : 3], ['estado', '—', 'Programado']]; }
        break;
      case 'Liberación': D = [['estado', 'Activa', 'Liberada'], ['cantidadReservada', String(20 + r % 180), '0'], ['motivo', '—', 'Entrega fallida: se libera el inventario'], ['reservaId', e.entidadId, e.entidadId]]; break;
      case 'Aprobación': D = [['estado', 'Pendiente de aprobación', 'Aprobado'], ['excepción', '—', 'Utilización de ' + (62 + r % 20) + ' %, por debajo del mínimo'], ['aprobadoPor', '—', actor], ['despachoId', e.entidadId, e.entidadId]]; break;
      case 'Cambio de permisos': D = [['permiso · ' + pickR(e, ['Despachos', 'Planeación', 'Reportes', 'Inventario']), 'Consultar', 'Gestionar'], ['alcance', 'CEDI Bogotá', 'CEDI Bogotá'], ['rolId', e.entidadId, e.entidadId]]; break;
      case 'Sincronización': D = [['estado', 'Pendiente', 'Procesado'], ['registros', '0', String(40 + r % 300)], ['errores', '0', '0'], ['logId', e.entidadId, e.entidadId]]; break;
      case 'Exportación': D = [['formato', '—', pickR(e, ['CSV', 'Excel', 'PDF'])], ['filas', '—', String(60 + r % 500)], ['filtros', '—', 'Últimos 30 días · todas las rutas']]; break;
      case 'Ajuste de inventario': var f = 100 + r % 400, g = f - (1 + r % 9); D = [['stockFísico', String(f), String(g)], ['diferencia', '0', String(g - f)], ['estadoConteo', 'Con diferencia', 'Ajustado'], ['conteoId', e.entidadId, e.entidadId]]; break;
      case 'Anotación': D = [['anotación', '—', e.observaciones], ['registroOriginal', '—', e.referenciaRegistro || '—']]; break;
      case 'Inicio de sesión': at = [['Resultado', 'Acceso concedido'], ['Navegador', pickR(e, ['Chrome 126 · Windows', 'Edge 125 · Windows', 'Safari 17 · macOS'])], ['Segundo factor', 'Verificado']]; break;
      case 'Cierre de sesión': at = [['Resultado', 'Sesión cerrada'], ['Duración', (30 + r % 400) + ' min'], ['Navegador', pickR(e, ['Chrome 126 · Windows', 'Edge 125 · Windows'])]]; break;
      case 'Acceso denegado': at = [['Motivo', 'Credenciales inválidas'], ['Intentos consecutivos', (1 + r % 4) + ' de 5'], ['Acción tomada', 'Intento rechazado y notificado al administrador de seguridad']]; break;
    }
    return { cambios: D, atributos: at };
  }

  /* ---------- indicadores ---------- */
  var hoy = ymdLocal(A.ahora), ayer = ymdLocal(new Date(A.ahora.getTime() - 864e5)), desde24 = new Date(A.ahora.getTime() - 864e5).toISOString();
  function kpis() {
    var hoyN = EV.filter(function (e) { return e.fechaHora >= desde24; }).length, rutas = EV.filter(function (e) { return e.entidad === 'Ruta' && e.tipo === 'Modificación'; }).length, den = EV.filter(function (e) { return e.tipo === 'Acceso denegado'; }), us = {}; den.forEach(function (e) { us[e.usuarioId] = 1; });
    $('#kpiRow').innerHTML =
      UI.kpi({ id: 'hoy', label: 'Eventos en 24 horas', icon: 'list', value: hoyN, note: 'de ' + EV.length + ' en los últimos 7 días', onClick: true }) +
      UI.kpi({ id: 'rutas', label: 'Cambios manuales de ruta', icon: 'route', value: rutas, note: 'últimos 7 días', onClick: true }) +
      UI.kpi({ id: 'den', label: 'Accesos denegados', icon: 'ban', value: den.length, note: Object.keys(us).length + ' usuarios distintos', onClick: true }) +
      UI.kpi({ id: 'int', label: 'Integridad del registro', icon: 'shield-check', valueHtml: '100<small>%</small>', note: 'Cadena sin rupturas', onClick: true });
  }
  $('#kpiRow').addEventListener('click', function (e) {
    var k = e.target.closest('[data-kpi]'); if (!k) return; clearAll(); UI.tabsApi.select('pnlLog');
    if (k.dataset.kpi === 'hoy') { setDates(ayer, hoy); } else if (k.dataset.kpi === 'rutas') { tbl.setFilter('entidad', 'Ruta'); tbl.setFilter('tipo', 'Modificación'); } else if (k.dataset.kpi === 'den') { tbl.setFilter('tipo', 'Acceso denegado'); } else { verify(); return; }
    toast('Registro filtrado: ' + $('.kpi-label', k).textContent.toLowerCase() + '.', 'info');
  });

  /* ---------- tabla de eventos ---------- */
  function opts(key, extra) { return Array.from(new Set(EV.map(function (e) { return e[key]; }).concat(extra || []))).sort(function (a, b) { return a.localeCompare(b, 'es'); }); }
  var dateBox = '<div class="date-filter"><label for="dFrom">Desde</label><input class="input input-sm" type="date" id="dFrom" aria-label="Fecha desde"><label for="dTo">hasta</label><input class="input input-sm" type="date" id="dTo" aria-label="Fecha hasta"><button type="button" class="btn btn-ghost btn-sm" id="clearBtn">Limpiar filtros</button></div>';
  var tbl = UI.table($('#logTable'), {
    rows: EV, pageSize: 12, dense: true, rowKey: 'registroId', caption: 'Registro de eventos de auditoría', sort: { key: 'fechaHora', dir: 'desc' },
    searchable: { placeholder: 'Buscar por usuario, ID o texto' }, searchKeys: ['registroId', 'entidadId', 'observaciones', 'ip'], emptyText: 'Ningún evento coincide con los filtros.',
    filters: [{ key: 'usuario', label: 'Usuario', all: 'Todos los usuarios', options: opts('usuario') }, { key: 'tipo', label: 'Tipo', all: 'Todos los tipos', options: opts('tipo', ['Anotación']) }, { key: 'entidad', label: 'Entidad', all: 'Todas las entidades', options: opts('entidad') }, { key: 'estado', label: 'Estado', all: 'Todos los estados', options: ['Exitoso', 'Rechazado'] }],
    toolbar: dateBox,
    columns: [
      { key: 'fechaHora', label: 'Fecha y hora', render: function (e) { return '<span class="nowrap">' + F.fecha(e.fechaHora) + '</span><div class="cell-sub num">' + F.hora(e.fechaHora) + '</div>'; } },
      { key: 'usuario', label: 'Usuario', render: function (e) { return '<div class="row nowrap gap-2">' + UI.avatar(e.usuario, { size: 'sm' }) + '<div><div class="cell-main">' + esc(e.usuario) + '</div><div class="cell-sub">' + esc(e.rol) + '</div></div></div>'; } },
      { key: 'entidad', label: 'Entidad', render: function (e) { return '<span class="cell-main">' + esc(e.entidad) + '</span><div class="cell-sub mono">' + esc(e.entidadId) + '</div>'; } },
      { key: 'tipo', label: 'Tipo', title: true, render: function (e) { return '<span class="cell-main">' + esc(e.tipo) + '</span>'; } },
      { key: 'estado', label: 'Estado', render: function (e) { return UI.chip(e.estado); } },
      { key: 'referenciaOrigen', label: 'Origen', hideMobile: true },
      { key: 'ip', label: 'IP', mono: true, hideMobile: true }
    ],
    onRowClick: function (e) { openEvent(e); },
    actions: function (e) { var h = entHref(e), it = [{ label: 'Ver detalle', icon: 'eye', onClick: function () { openEvent(e); } }, { label: 'Historial de la entidad', icon: 'clock', onClick: function () { showHistory(e.entidadId, true); } }]; if (h) it.push({ sep: true }, { label: 'Abrir ' + e.entidad.toLowerCase(), icon: 'arrow-up-right', href: h }); return it; }
  });

  $('#logCount').textContent = EV.length;
  var dFrom = $('#dFrom'), dTo = $('#dTo'), baseRows = EV;
  function applyDates() { var f = dFrom.value, t = dTo.value; tbl.setRows(EV.filter(function (e) { return (!f || e.fecha >= f) && (!t || e.fecha <= t); })); }
  function setDates(f, t) { dFrom.value = f || ''; dTo.value = t || ''; applyDates(); }
  [dFrom, dTo].forEach(function (i) { i.addEventListener('change', function () { if (dFrom.value && dTo.value && dFrom.value > dTo.value) { toast('La fecha inicial no puede ser posterior a la final.', 'warning'); dTo.value = dFrom.value; } applyDates(); }); });
  function clearAll() { ['usuario', 'tipo', 'entidad', 'estado'].forEach(function (k) { tbl.setFilter(k, ''); }); UI.$$('#logTable select').forEach(function (s) { s.value = ''; }); var q = $('#logTable input[type=search]'); if (q) { q.value = ''; tbl.search(''); } setDates('', ''); }
  $('#clearBtn').addEventListener('click', function () { clearAll(); toast('Filtros restablecidos.', 'info'); });

  /* ---------- drawer de evento ---------- */
  function diffHtml(e) {
    var d = diffOf(e);
