<style>
  /* Layout específico de la pantalla de clientes (tokens y componentes viven en app.css) */

  .kpi-row { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
  @media (max-width: 639px) { .kpi-row { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; } .kpi-row > :last-child:nth-child(odd) { grid-column: span 2; } .kpi .kpi-value { font-size: 28px; } .kpi { padding: 12px; } }
  .cl-tools { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .cl-tools .grp { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; min-width: 0; }

  .filter-bar { margin: 0; }
  .cl-map .map { --h: 580px; border: 0; border-radius: 0; }
  @media (max-width: 639px) { .cl-map .map { --h: 420px; } }
  .cl-lock { display: inline-flex; align-items: center; gap: 4px; color: var(--text-3); font-size: 12px; }
  .cl-lock .icon { width: 13px; height: 13px; }
  .f-locked .input { padding-right: 34px; }
  .f-locked { position: relative; }
  .f-locked > .icon { position: absolute; right: 11px; bottom: 11px; width: 14px; height: 14px; color: var(--text-3); pointer-events: none; }
  .cd-head { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--r-ctl); background: var(--surface-2); margin-bottom: 14px; }
  .cd-head.is-blocked { border-color: var(--red-line, var(--border-strong)); background: var(--red-bg); }
  .cd-head .grow { min-width: 200px; }
  .cd-tabs { margin: 0 -20px 16px; padding: 0 20px; }
  .sec-title { font-size: 13px; font-weight: 600; margin: 0 0 8px; }
  .addr-list { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .addr-btn { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border: 1px solid var(--border-strong); border-radius: var(--r-ctl); background: var(--surface); text-align: left; min-height: 44px; font-size: 13px; }
  .addr-btn[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink) inset; }
  :root[data-theme="dark"] .addr-btn[aria-pressed="true"] { border-color: #E9EDF0; box-shadow: 0 0 0 1px #E9EDF0 inset; }
  .addr-btn .a-sub { display: block; font-size: 12px; color: var(--text-2); }
  .addr-grid { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 760px) { .addr-grid.in-wide { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
  .pin-map .map { --h: 300px; }
  .coord { font-family: var(--font-mono); font-size: 12.5px; }
  .wk-head, .wk-row { display: grid; grid-template-columns: 130px 268px minmax(0, 1fr); gap: 14px; align-items: center; }
  .wk-head { padding: 0 0 6px; font-size: 11.5px; color: var(--text-3); }
  .wk-head .ticks { position: relative; height: 14px; } .wk-head .ticks span { position: absolute; transform: translateX(-50%); } .wk-head .ticks span:first-child { transform: none; } .wk-head .ticks span:last-child { transform: translateX(-100%); }
  .wk-row { padding: 9px 0; border-top: 1px solid var(--border); }
  .wk-row .times { display: flex; align-items: center; gap: 6px; }
  .wk-row .times .input { width: 122px; padding: 0 8px; }
  .wk-track { position: relative; height: 24px; border-radius: 6px; background: var(--surface-3); overflow: hidden; }
  .wk-fill { position: absolute; top: 3px; bottom: 3px; border-radius: 4px; border: 1px solid var(--blue); background-color: var(--blue-bg); }
  .wk-row.is-off .wk-track { opacity: .55; }
  .wk-row .wk-msg { grid-column: 1 / -1; }
  @media (max-width: 719px) { .wk-head { display: none; } .wk-row { grid-template-columns: 1fr; gap: 8px; } }
  .chk-grid { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
  .chk-card { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--r-ctl); background: var(--surface); min-height: 44px; }
  .chk-card:has(input:checked) { border-color: var(--blue-line); background: var(--blue-bg); }
  .stepper-num { display: inline-flex; align-items: center; gap: 6px; }
  .stepper-num .input { width: 84px; text-align: center; font-variant-numeric: tabular-nums; }
  .day-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .day-chips .filter-chip { min-width: 40px; justify-content: center; height: 36px; }
  .mini-stat { padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--r-ctl); background: var(--surface-2); }
  .mini-stat .v { font-family: var(--font-display); font-weight: 600; font-size: 26px; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .mini-stat .l { font-size: 12px; color: var(--text-2); }
  .ck-list { display: grid; gap: 0; }
  .ck-row { display: flex; gap: 12px; align-items: flex-start; padding: 11px 0; border-bottom: 1px solid var(--border); }
  .ck-row:last-child { border-bottom: 0; }
  .ck-ico { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; flex: none; }
  .ck-ico .icon { width: 14px; height: 14px; }
  .ck-ico.ok { background: var(--green-bg); color: var(--green-fg); } .ck-ico.warn { background: var(--amber-bg); color: var(--amber-fg); } .ck-ico.fail { background: var(--red-bg); color: var(--red-fg); }
  .sync-steps { display: grid; gap: 10px; margin: 14px 0; }
  .sync-step { display: flex; gap: 10px; align-items: center; font-size: 13.5px; color: var(--text-3); }
  .sync-step.is-on { color: var(--text); font-weight: 500; } .sync-step.is-done { color: var(--text-2); }
  .sync-step .ss-dot { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--border-strong); display: grid; place-items: center; flex: none; }
  .sync-step.is-done .ss-dot { background: var(--green); border-color: var(--green); color: #fff; } .sync-step .ss-dot .icon { width: 12px; height: 12px; }
  .sync-step.is-on .ss-dot { border-color: var(--blue); }
  .cell-id { font-size: 12px; color: var(--text-2); font-family: var(--font-mono); }
  .upd { font-size: 12.5px; color: var(--text-2); }
  .map-pop { font-size: 13px; line-height: 1.45; min-width: 180px; }
  .map-pop button { margin-top: 8px; }
  :root[data-theme="dark"] a.btn { color: var(--b-fg); } /* el color de enlace del tema oscuro pisaba el de los botones-enlace */
</style>

<body data-page="clientes">
<main id="app">
  <header class="page-head">
    <div class="ph-text">
      <div class="page-eyebrow">Maestros</div>
      <h1 class="page-title">Maestro de clientes</h1>
      <p class="page-desc">Datos de SAP y coordenadas del Data Lake, más lo que el equipo logístico completa: direcciones, ventanas horarias y restricciones de acceso. <span id="syncInfo" class="upd"></span></p>
    </div>
    <div class="page-actions">
      <button type="button" class="btn btn-primary" id="syncBtn"></button>
    </div>
  </header>

  <section aria-label="Resumen de calidad de datos"><div class="kpi-row" id="kpiRow"></div></section>

  <div class="section" id="gateBanner"></div>

  <section class="section" aria-label="Listado de clientes">
    <div class="cl-tools">
      <div class="grp">
        <div class="filter-bar" id="calChips" role="group" aria-label="Filtrar por calidad de dirección"></div>
      </div>
      <div class="grp">
        <div class="search"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><input class="input" type="search" id="qInput" placeholder="Cliente, NIT, municipio o barrio" aria-label="Buscar cliente"></div>
        <select class="select input-sm" id="zonaSel" aria-label="Filtrar por zona" style="width:auto;min-width:150px"></select>
        <div class="segmented" role="group" aria-label="Vista" id="viewSeg">
          <button type="button" data-v="tabla" aria-pressed="true">Tabla</button>
          <button type="button" data-v="mapa" aria-pressed="false">Mapa</button>
        </div>
      </div>
    </div>
    <div id="viewTabla"><div id="cliTable"></div></div>
    <div id="viewMapa" hidden>
      <div class="card cl-map">
        <div class="card-head"><div><h2 class="card-title">Clientes en el mapa</h2><p class="card-sub" id="mapSub"></p></div></div>
        <div id="cliMap" role="region" aria-label="Mapa de clientes por calidad de dirección"></div>
      </div>
    </div>
  </section>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
UI.ready(function () {
  var A = ARM, F = UI.fmt, esc = UI.esc, $ = UI.$, $$ = UI.$$;
  var CAL = { 'Verificada': 'success', 'Aproximada': 'warning', 'Por validar': 'danger' };
  var CAL_RANK = { 'Por validar': 0, 'Aproximada': 1, 'Verificada': 2 };
  function calChip(q, small) { return UI.chip(q, { tone: CAL[q] || 'neutral', small: !!small }); }

  /* ---------- utilidades locales (datos derivados, en memoria) ---------- */
  function hash(s) { var h = 2166136261; s = String(s); for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  function rng(seed) { var s = hash(seed) || 1; return function () { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }
  function km(a, b, c, d) { var R = 6371, t = Math.PI / 180, dl = (c - a) * t, dg = (d - b) * t, x = Math.sin(dl / 2) * Math.sin(dl / 2) + Math.cos(a * t) * Math.cos(c * t) * Math.sin(dg / 2) * Math.sin(dg / 2); return R * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1 - x)); }
  function hm(s) { var p = String(s || '0:0').split(':'); return (+p[0]) * 60 + (+p[1]); }
  function dur(min) { var h = Math.floor(min / 60), m = min % 60; return (h ? h + ' h' : '') + (h && m ? ' ' : '') + (m ? m + ' min' : (h ? '' : '0 min')); }
  function nowIso() { return new Date().toISOString(); }
  var ZONAS = Array.from(new Set(A.clientes.map(function (c) { return c.zona; }))).sort();
  var MUNIS = {};
  A.clientes.forEach(function (c) { var m = MUNIS[c.municipio] || (MUNIS[c.municipio] = { n: 0, lat: 0, lng: 0, z: {} }); m.n++; m.lat += c.latitud; m.lng += c.longitud; m.z[c.zona] = (m.z[c.zona] || 0) + 1; });
  Object.keys(MUNIS).forEach(function (k) { var m = MUNIS[k]; m.lat /= m.n; m.lng /= m.n; m.zona = Object.keys(m.z).sort(function (a, b) { return m.z[b] - m.z[a]; })[0]; m.radio = k === 'Manizales' ? 35 : 18; });
  var MUNI_LIST = Object.keys(MUNIS).sort(function (a, b) { return a.localeCompare(b, 'es'); });
  var RESTR = ['Acceso máximo para turbo (calle estrecha)', 'Descargue con ayudante (sin montacargas)', 'Vía destapada en los últimos 600 m', 'Descargue restringido en horas pico (zona residencial)', 'Requiere montacargas del cliente', 'Ingreso con EPP y planilla de seguridad social', 'Portería exige cita previa'];
  var VEH_MAX = ['Sin límite de tamaño', 'Hasta tractocamión', 'Hasta camión sencillo', 'Hasta turbo (4,5 t)'];
  var DAYS = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado', 'Domingo'], DAYS_S = ['L', 'M', 'X', 'J', 'V', 'S', 'D'];
  var DIRS = {}, WEEK = {}, FREQD = {}, ACC = {}, state = { cal: '', zona: '', q: '', view: 'tabla' };

  function mkPrincipal(c) {
    return { id: 'principal', alias: 'Entrega principal', principal: true,
      get direccion() { return c.direccionEntrega; }, set direccion(v) { c.direccionEntrega = v; },
      get municipio() { return c.municipio; }, set municipio(v) { c.municipio = v; },
      get barrio() { return c.barrio; }, set barrio(v) { c.barrio = v; },
      get zona() { return c.zona; }, set zona(v) { c.zona = v; },
      get lat() { return c.latitud; }, set lat(v) { c.latitud = v; },
      get lng() { return c.longitud; }, set lng(v) { c.longitud = v; },
      get calidad() { return c.calidadDireccion; }, set calidad(v) { c.calidadDireccion = v; } };
  }
  function dirsOf(c) {
    if (!DIRS[c.clienteIdSAP]) {
      var r = rng('dir' + c.clienteIdSAP), l = [mkPrincipal(c)];
      if (r() < 0.34) { var mu = MUNIS[c.municipio]; l.push({ id: 'obra1', alias: c.tipoCodigo === 'C' ? 'Obra torre 2' : 'Bodega auxiliar', principal: false, direccion: 'Cra ' + Math.round(10 + r() * 90) + ' # ' + Math.round(10 + r() * 60) + '-' + Math.round(1 + r() * 90) + ', ' + c.barrio, municipio: c.municipio, barrio: c.barrio, zona: c.zona, lat: +(c.latitud + 0.006 + r() * 0.006).toFixed(5), lng: +(c.longitud - 0.005 - r() * 0.006).toFixed(5), calidad: r() < 0.5 ? 'Aproximada' : 'Verificada' }); }
      DIRS[c.clienteIdSAP] = l;
    }
    return DIRS[c.clienteIdSAP];
  }
  function weekOf(c) {
    if (!WEEK[c.clienteIdSAP]) {
      var r = rng('wk' + c.clienteIdSAP), w = [];
      for (var i = 0; i < 7; i++) w.push({ on: i < 5, ini: c.ventanaInicio, fin: c.ventanaFin });
      if (r() < 0.55) { w[5] = { on: true, ini: c.ventanaInicio, fin: hm(c.ventanaFin) > 13 * 60 ? '13:00' : c.ventanaFin }; }
      WEEK[c.clienteIdSAP] = w;
    }
    return WEEK[c.clienteIdSAP];
  }
  function freqOf(c) {
    if (!FREQD[c.clienteIdSAP]) { var r = rng('fq' + c.clienteIdSAP), d = [false, false, false, false, false, false]; var k = c.frecuencia === 'Diaria' ? [0, 1, 2, 3, 4] : c.frecuencia === 'Semanal' ? [Math.floor(r() * 5)] : c.frecuencia === 'Quincenal' ? [Math.floor(r() * 5)] : []; k.forEach(function (i) { d[i] = true; }); FREQD[c.clienteIdSAP] = d; }
    return FREQD[c.clienteIdSAP];
  }
  function accOf(c) { if (!ACC[c.clienteIdSAP]) { var r = rng('ac' + c.clienteIdSAP); ACC[c.clienteIdSAP] = { veh: c.restricciones.some(function (x) { return /turbo/i.test(x); }) ? VEH_MAX[3] : VEH_MAX[0] }; } return ACC[c.clienteIdSAP]; }
  function observedUnload(c) { var r = rng('ob' + c.clienteIdSAP); return Math.max(8, Math.round(c.descargueMin * (0.82 + r() * 0.5))); }
  function rutaName(c) { var r = A.idx.rutas[c.rutaId]; return r ? r.nombre : '—'; }
  function planeable(c) { return c.calidadDireccion !== 'Por validar'; }

  /* ---------- lista de verificación antes de planear (HU-051) ---------- */
  function checks(c) {
    var q = c.calidadDireccion, tel = c.contacto && c.contacto.telefono;
    return [
      { k: 'geo', label: 'Georreferencia de la dirección de entrega', state: q === 'Verificada' ? 'ok' : q === 'Aproximada' ? 'warn' : 'fail',
        detail: q === 'Verificada' ? 'Punto confirmado: ' + c.latitud.toFixed(5) + ', ' + c.longitud.toFixed(5) + '.' : q === 'Aproximada' ? 'El punto es aproximado. Se puede planear, pero confirma la ubicación para evitar paradas mal secuenciadas.' : 'El Data Lake no entregó coordenadas válidas. El cliente no puede entrar a planeación hasta ubicarlo en el mapa.' },
      { k: 'zona', label: 'Zona, municipio y barrio', state: c.zona && c.municipio && c.barrio ? 'ok' : 'fail', detail: c.zona && c.municipio && c.barrio ? c.barrio + ', ' + c.municipio + ' · zona ' + c.zona + '.' : 'Falta la zona, el municipio o el barrio.' },
      { k: 'ruta', label: 'Ruta poblacional asignada', state: c.rutaId && A.idx.rutas[c.rutaId] ? 'ok' : 'fail', detail: c.rutaId ? rutaName(c) + ' (' + c.rutaId + ').' : 'Asigna una ruta para que el cliente aparezca agrupado en planeación.' },
      { k: 'vent', label: 'Ventana horaria de atención', state: hm(c.ventanaInicio) < hm(c.ventanaFin) ? 'ok' : 'fail', detail: c.ventanaInicio + '–' + c.ventanaFin + ' de lunes a viernes.' },
      { k: 'desc', label: 'Tiempo promedio de descargue', state: c.descargueMin > 0 ? 'ok' : 'fail', detail: c.descargueMin + ' min por parada.' },
      { k: 'cont', label: 'Contacto de recepción', state: tel ? 'ok' : 'warn', detail: tel ? c.contacto.nombre + ' · ' + tel : 'Sin teléfono: el conductor no podrá avisar su llegada.' }
    ];
  }
  function completeness(c) { var ch = checks(c), pts = ch.reduce(function (s, x) { return s + (x.state === 'ok' ? 1 : x.state === 'warn' ? 0.5 : 0); }, 0); return Math.round(pts / ch.length * 100); }

  /* ---------- KPIs y filtros ---------- */
  function stats() {
    var l = A.clientes, v = l.filter(function (c) { return c.calidadDireccion === 'Verificada'; }).length, a = l.filter(function (c) { return c.calidadDireccion === 'Aproximada'; }).length, p = l.length - v - a;
    return { n: l.length, v: v, a: a, p: p, listos: v + a };
  }
  function renderKpis() {
    var s = stats();
    $('#kpiRow').innerHTML =
      UI.kpi({ id: 'tot', label: 'Clientes activos', icon: 'users', value: s.n, note: 'Origen SAP · coordenadas Data Lake', onClick: true }) +
      UI.kpi({ id: 'listos', label: 'Listos para planear', icon: 'check-circle', valueHtml: s.listos + '<small>de ' + s.n + '</small>', note: Math.round(s.listos / s.n * 100) + ' % del maestro', onClick: true }) +
      UI.kpi({ id: 'aprox', label: 'Ubicación aproximada', icon: 'map-pin', value: s.a, note: 'Planeables, pero conviene confirmar', onClick: true }) +
      UI.kpi({ id: 'pend', label: 'Sin georreferencia', icon: 'alert-triangle', valueHtml: '<span style="color:' + (s.p ? 'var(--red-fg)' : 'inherit') + '">' + s.p + '</span>', note: s.p ? 'Bloqueados para planeación' : 'Todo el maestro es planeable', onClick: true });
    var ch = [['', 'Todos', s.n], ['Verificada', 'Verificada', s.v], ['Aproximada', 'Aproximada', s.a], ['Por validar', 'Por validar', s.p]];
    $('#calChips').innerHTML = ch.map(function (x) { return '<button type="button" class="filter-chip" data-cal="' + x[0] + '" aria-pressed="' + (state.cal === x[0]) + '">' + x[1] + ' <span class="n">' + x[2] + '</span></button>'; }).join('');
    $('#gateBanner').innerHTML = s.p ? UI.banner({ tone: 'warning', title: s.p + ' cliente' + (s.p === 1 ? '' : 's') + ' sin georreferencia no entra' + (s.p === 1 ? '' : 'n') + ' a planeación', html: 'La planeación excluye a los clientes con dirección «Por validar» porque el motor de rutas no puede secuenciar sus paradas. <button type="button" class="link-btn" id="gateFilter">Ver pendientes</button> · <a href="integraciones.html">Revisar cola del Data Lake</a>' }) : UI.banner({ tone: 'success', title: 'Maestro listo para planear', text: 'Todos los clientes tienen una ubicación utilizable. ' + s.a + ' tienen punto aproximado.' });
    var g = $('#gateFilter'); if (g) g.onclick = function () { setCal('Por validar'); };
    $('#syncBtn').innerHTML = UI.icon('refresh') + 'Sincronizar desde SAP / Data Lake';
    $('#syncInfo').textContent = 'Última sincronización ' + F.relativo(lastSync()) + '.';
  }
  function lastSync() { return A.clientes.reduce(function (m, c) { return c.sincronizado > m ? c.sincronizado : m; }, ''); }
  $('#kpiRow').addEventListener('click', function (e) {
    var k = e.target.closest('[data-kpi]'); if (!k) return;
    var m = { tot: '', listos: '', aprox: 'Aproximada', pend: 'Por validar' }[k.dataset.kpi]; if (k.dataset.kpi === 'listos') { checklistSummary(); return; } setCal(m);
  });
  function setCal(v) { state.cal = v; renderKpis(); applyFilters(); }
  $('#calChips').addEventListener('click', function (e) { var b = e.target.closest('[data-cal]'); if (b) setCal(b.dataset.cal); });
  $('#zonaSel').innerHTML = '<option value="">Todas las zonas</option>' + ZONAS.map(function (z) { return '<option>' + esc(z) + '</option>'; }).join('');
  $('#zonaSel').addEventListener('change', function (e) { state.zona = e.target.value; applyFilters(); });
  $('#qInput').addEventListener('input', function (e) { state.q = e.target.value; applyFilters(); });

  /* --- Historial de entregas (HU-050) --- */
  function histOf(c) {

      var mu = MUNIS[{ nei: 'Neira', sal: 'Salamina' }[n[2]]]; if (!mu) mu = MUNIS['Aranzazu'] || MUNIS[MUNI_LIST[0]];
      var nm = i ? { n: 'Fabio Quintero', c: 'Residente de obra' } : { n: 'Rocío Acosta', c: 'Almacenista' }, mname = { nei: 'Neira', sal: 'Salamina' }[n[2]] || 'Aranzazu', ref = A.clientes.filter(function (x) { return x.municipio === mname; })[0] || A.clientes[0];
      var c = { clienteIdSAP: 'CL' + (1005800 + i * 23), nit: i ? '901.482.337-5' : '860.511.904-2', razonSocial: n[0], tipo: n[1] === 'C' ? 'Constructora' : 'Ferretería', tipoCodigo: n[1], direccionEntrega: i ? 'Autopista Norte Km 28, vereda Río Grande' : 'Cra 4 # 3-20, Centro', municipio: mname, localidad: null, departamento: 'Caldas', barrio: n[3], zona: mu.zona, rutaId: ref.rutaId, municipioKey: n[2], latitud: +mu.lat.toFixed(5), longitud: +mu.lng.toFixed(5), ventanaInicio: '07:00', ventanaFin: '16:00', restricciones: [], contacto: { nombre: nm.n, cargo: nm.c, telefono: '31' + (i ? '8' : '2') + ' 604 ' + (i ? '1129' : '7740'), correo: nm.n.split(' ')[0].toLowerCase() + '@' + (i ? 'andina.com.co' : 'losalamos.com.co') }, descargueMin: i ? 45 : 25, frecuencia: 'Semanal', calidadDireccion: 'Por validar', estado: 'Activo', sincronizado: nowIso(), vendedor: null, cupoCreditoCOP: 80000000 };
      A.clientes.push(c); A.idx.clientes[c.clienteIdSAP] = c;
    });
  }
  function syncModal() {
    var running = false, done = false, retried = false;
    var steps = ['Conectando con SAP por el canal seguro', 'Leyendo el maestro de clientes (ZSD_CLIENTES_GET)', 'Cruzando coordenadas con el Data Lake', 'Aplicando cambios al maestro'];
    function stepsHtml(k) { return '<div class="sync-steps" aria-live="polite">' + steps.map(function (s, i) { return '<div class="sync-step ' + (i < k ? 'is-done' : i === k ? 'is-on' : '') + '"><span class="ss-dot">' + (i < k ? UI.icon('check') : i === k ? '<span class="spin"></span>' : '') + '</span>' + s + '</div>'; }).join('') + '</div>'; }
    var m = UI.modal({ title: 'Sincronizar maestro de clientes', width: 540, dismissible: true,
      body: '<div id="syBody"><p class="muted t-14">Trae los cambios del maestro desde SAP y las coordenadas normalizadas del Data Lake. Los datos logísticos que editaste en esta pantalla no se sobrescriben.</p><div class="mt-3">' + UI.kv([['Última sincronización', F.fechaHora(lastSync())], ['Origen', 'SAP (on premises) + Data Lake'], ['Frecuencia automática', 'Cada 15 minutos']]) + '</div></div>',
      footer: [{ label: 'Cerrar', kind: 'ghost' }, { label: 'Iniciar sincronización', kind: 'primary', id: 'syGo', keepOpen: true, onClick: function () { if (running) return false; if (done) { m.close(); return false; } run(); return false; } }] });
    var go = $('#syGo', m.el);
    function run() {
      running = true; go.disabled = true; go.innerHTML = '<span class="spin"></span>Sincronizando…'; var k = 0, body = $('#syBody', m.el);
      body.innerHTML = '<div class="meter-cap"><span>Progreso</span></div>' + UI.meter(5, 100, { level: 'info', showValue: false, label: 'Progreso de la sincronización' }) + stepsHtml(0);
      var t = setInterval(function () {
        k++; var pct = Math.min(100, k * 25); body.innerHTML = '<div class="meter-cap"><span>Progreso</span><span>' + pct + ' %</span></div>' + UI.meter(pct, 100, { level: 'info', showValue: false, label: 'Progreso de la sincronización' }) + stepsHtml(k);
        if (k >= steps.length) { clearInterval(t); finish(); }
      }, 750);
    }
    function finish() {
      var body = $('#syBody', m.el), first = !synced; running = false; done = true;
      var now = nowIso(); A.clientes.forEach(function (c) { c.sincronizado = now; });
      var nuevos = 0, dl = 0;
      if (first) { addNewClients(); synced = true; nuevos = NUEVOS.length; dl = 2; }
      var n = A.clientes.length;
      body.innerHTML = '<div class="stack">' + (first ? UI.banner({ tone: 'warning', title: 'Sincronización terminada con avisos', html: 'El Data Lake respondió con retraso: ' + nuevos + ' clientes nuevos llegaron sin coordenadas y quedaron «Por validar». <button type="button" class="link-btn" id="syRetry">Reintentar coordenadas</button>' }) : UI.banner({ tone: 'success', title: 'Maestro al día', text: 'No hubo clientes nuevos ni cambios en SAP desde la última sincronización.' })) +
        '<div class="grid c3 gap-3"><div class="mini-stat"><div class="v">' + (n - nuevos) + '</div><div class="l">Revisados</div></div><div class="mini-stat"><div class="v">' + (first ? 6 : 0) + '</div><div class="l">Actualizados</div></div><div class="mini-stat"><div class="v">' + nuevos + '</div><div class="l">Nuevos</div></div></div>' +
        UI.kv([['Duplicados descartados', first ? '1 (idempotencia por código SAP)' : '0'], ['Sin georreferencia', stats().p + ' clientes'], ['Finalizó', F.hora(now)]]) + '</div>';
      go.disabled = false; go.textContent = 'Listo'; refreshAll();
      UI.toast(first ? 'Sincronización completa: ' + nuevos + ' clientes nuevos, ' + stats().p + ' sin georreferencia.' : 'El maestro ya estaba al día.', first ? 'warning' : 'success');
      var rr = $('#syRetry', m.el); if (rr) rr.onclick = function () {
        rr.disabled = true; rr.textContent = 'Reintentando…';
        setTimeout(function () { NUEVOS.forEach(function (x, i) { var c = A.clientes[A.clientes.length - NUEVOS.length + i]; if (i === 0) { c.calidadDireccion = 'Aproximada'; c.latitud = +(c.latitud + 0.004).toFixed(5); c.longitud = +(c.longitud - 0.003).toFixed(5); } }); refreshAll(); body.innerHTML = '<div class="stack">' + UI.banner({ tone: 'success', title: 'Coordenadas recibidas para 1 de 2 clientes', text: 'Construcciones Andina Salamina sigue sin coordenadas válidas en el Data Lake. Ubícalo manualmente desde su ficha.' }) + '<div class="row gap-2"><button type="button" class="btn btn-secondary btn-sm" id="syOpen">Abrir ficha</button><a class="btn btn-ghost btn-sm" href="integraciones.html">Ver cola del Data Lake</a></div></div>'; $('#syOpen', m.el).onclick = function () { m.close(); openClient(A.clientes[A.clientes.length - 1].clienteIdSAP, 'cd-dir'); }; UI.toast('Reintento terminado: 1 cliente recibió coordenadas aproximadas.', 'success'); }, 900);
      };
    }
  }
  $('#syncBtn').addEventListener('click', syncModal);

  /* ---------- arranque ---------- */
  var load = [1, 2, 3, 4].map(function () { return '<div class="card kpi"><span class="skeleton sk-line" style="width:50%"></span><span class="skeleton" style="height:34px;width:60%"></span><span class="skeleton sk-line" style="width:70%"></span></div>'; }).join('');
  $('#kpiRow').innerHTML = load; tbl.setLoading(true);
  setTimeout(function () { renderKpis(); tbl.setLoading(false); applyFilters(); var id = UI.param('id'); if (id) openClient(id, UI.param('tab') ? 'cd-' + UI.param('tab') : undefined); }, 350);
});
</script>
</body>
