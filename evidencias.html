  .ev-toolbar .search { flex: 1 1 240px; max-width: 360px; } .ev-toolbar .select { width: auto; min-width: 150px; max-width: 100%; flex: 0 1 auto; }
  .ev-toolbar .grow { margin-left: auto; }

  @media (max-width: 639px) { .ev-toolbar .select { flex: 1 1 140px; } .ev-toolbar .search { max-width: none; } .ev-toolbar .grow { margin-left: 0; } }

  .ev-card:hover { border-color: var(--border-strong); box-shadow: var(--shadow-pop); transform: translateY(-1px); }
  .ev-thumb { position: relative; aspect-ratio: 4 / 3; background: var(--surface-3); overflow: hidden; border-bottom: 1px solid var(--border); }
  .ev-thumb svg { width: 100%; height: 100%; display: block; } .ev-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ev-thumb .tl { position: absolute; top: 8px; left: 8px; } .ev-thumb .tr { position: absolute; top: 8px; right: 8px; width: 26px; height: 26px; border-radius: 50%; background: var(--surface); border: 1px solid var(--border); display: grid; place-items: center; color: var(--text-2); }

  .ev-info .t2 { font-size: 12px; color: var(--text-2); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
  .ev-pager { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 16px 14px; flex-wrap: wrap; border-top: 1px solid var(--border); font-size: 13px; color: var(--text-2); }
  .tbl-thumb { width: 52px; height: 39px; border-radius: 6px; overflow: hidden; border: 1px solid var(--border); background: var(--surface-3); flex: none; } .tbl-thumb svg, .tbl-thumb img { width: 100%; height: 100%; display: block; object-fit: cover; }
  .cell-ev { display: flex; align-items: center; gap: 10px; }

  .vw-box { border: 1px solid var(--border); border-radius: var(--r-card); padding: 12px 14px; background: var(--surface); min-width: 0; }
  .vw-box h3 { font-size: 13px; font-weight: 600; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }

  .hash { font-family: var(--font-mono); font-size: 12px; word-break: break-all; padding: 8px 10px; border-radius: var(--r-ctl); background: var(--surface-2); border: 1px solid var(--border); color: var(--text-2); }

  .log-row { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 12.5px; } .log-row:last-child { border-bottom: 0; } .log-row .t { font-family: var(--font-mono); font-size: 11.5px; color: var(--text-2); }
  .vw-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  /* por entrega */
  .stop-card { display: grid; gap: 14px 20px; padding: 14px 16px; border-bottom: 1px solid var(--border); grid-template-columns: minmax(0, 1fr); }
  .stop-card:last-child { border-bottom: 0; }
  @media (min-width: 900px) { .stop-card { grid-template-columns: minmax(220px, 1fr) minmax(0, 1.6fr) auto; align-items: center; } }
  .stop-head { display: flex; gap: 12px; align-items: flex-start; min-width: 0; } .stop-n { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-3); border: 2px solid var(--border-strong); font-weight: 600; font-size: 12.5px; }

  .req .ri { flex: none; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-3); color: var(--text-2); } .req .ri .icon { width: 13px; height: 13px; stroke-width: 2.4; }
  .req.ok .ri { background: var(--green); color: #fff; } .req.bad .ri { background: var(--red); color: #fff; } .req.warn .ri { background: var(--amber); color: #fff; }
  .req .rt { flex: 0 1 230px; min-width: 150px; } .req .rt small { display: block; color: var(--text-2); font-size: 12px; } .req.bad .rt small { color: var(--red-fg); font-weight: 500; }
  .mini-th { width: 44px; height: 33px; border-radius: 5px; overflow: hidden; border: 1px solid var(--border); padding: 0; background: var(--surface-3); cursor: pointer; } .mini-th svg, .mini-th img { width: 100%; height: 100%; display: block; object-fit: cover; } .mini-th:hover { border-color: var(--steel); }
  .stop-act { display: flex; flex-direction: column; gap: 6px; align-items: stretch; min-width: 150px; }
  .dz { border: 1.5px dashed var(--border-strong); border-radius: var(--r-card); background: var(--surface-2); padding: 20px 14px; text-align: center; cursor: pointer; transition: border-color .15s, background .15s; display: flex; flex-direction: column; gap: 4px; align-items: center; width: 100%; color: inherit; }
  .dz:hover, .dz.is-over { border-color: var(--blue); background: var(--blue-bg); } .dz[aria-invalid="true"] { border-color: var(--red); } .dz .icon { width: 26px; height: 26px; color: var(--text-2); }
  .dz.has { border-style: solid; border-color: var(--green-line); background: var(--green-bg); } .dz.has .icon { color: var(--green-fg); }

    </div>

      <div class="card">
        <div class="ev-toolbar" role="search">

          <div class="field" style="min-width:min(100%,300px)"><label class="label sr-only" for="dSel">Despacho</label><select class="select" id="dSel"></select></div>

        <div id="entHead" class="card-body" style="padding-bottom:0"></div>
        <div id="entBody"></div>

</main>

<script>
UI.ready(function () {
  var A = ARM, F = UI.fmt, esc = UI.esc, $ = UI.$, ic = UI.icon, pageSize = 12;
  var TIPOS = ['Foto de entrega', 'Firma del receptor', 'Remisión firmada', 'Foto de novedad'];
  var TIPO_ICON = { 'Foto de entrega': 'camera', 'Firma del receptor': 'pen', 'Remisión firmada': 'file-text', 'Foto de novedad': 'alert-triangle' };
  var CERRADA = { Entregada: 1, Parcial: 1, Fallida: 1 };
  var PARAD = {}; A.paradas.forEach(function (p) { PARAD[p.paradaId] = Object.assign({}, p); });
  var EV = A.evidencias.map(function (e) { return Object.assign({ origen: 'App del conductor' }, e); });
  var LOG = {}, st = { q: '', dsp: '', tipo: '', val: '', view: 'grid', page: 1, dsel: null, tab: 'gal' }, seq = EV.length, uid = 0;

  /* ---------- datos derivados ---------- */
  function ped(e) { return A.get('pedidos', e.pedidoId); }
  function cli(e) { var p = ped(e); return p ? A.get('clientes', p.clienteId) : null; }
  function cliente(e) { var p = ped(e); return p ? p.cliente : '—'; }
  function autor(id) { var c = A.get('conductores', id); if (c) return c.nombre; var u = A.get('usuarios', id); return u ? u.nombre : (id || '—'); }
  function evsDe(paradaId) { return EV.filter(function (e) { return e.paradaId === paradaId; }); }
  function tieneVal(paradaId, tipo) { return EV.some(function (e) { return e.paradaId === paradaId && e.tipo === tipo && e.validacion !== 'Rechazada'; }); }
  function requisitos(p) { return p.estado === 'Fallida' ? ['Foto de novedad'] : ['Foto de entrega', 'Firma del receptor']; }
  function entregaOk(p) { return requisitos(p).every(function (t) { return tieneVal(p.paradaId, t); }); }
  function valChip(v) { return UI.chip(v, { label: v === 'Pendiente' ? 'Pendiente de validar' : v, tone: v === 'Validada' ? 'success' : v === 'Rechazada' ? 'danger' : 'warning', small: true }); }
  function haversine(a, b, c, d) { var R = 6371000, r = Math.PI / 180, dl = (c - a) * r, dg = (d - b) * r, x = Math.sin(dl / 2) * Math.sin(dl / 2) + Math.cos(a * r) * Math.cos(c * r) * Math.sin(dg / 2) * Math.sin(dg / 2); return Math.round(2 * R * Math.asin(Math.sqrt(x))); }
  function fhFull(v) { var d = new Date(v); return F.fecha(d) + ' · ' + F.hora(d) + ':' + ('0' + d.getSeconds()).slice(-2); }
  function integridadTexto(e) { return [e.evidenciaId, e.pedidoId, e.paradaId, e.tipo, e.fechaHora, e.latitud, e.longitud, e.autorId].join('|'); }
  function hashear(e) {
    if (e.hash) return Promise.resolve(e.hash);
    var s = integridadTexto(e), fb = function () { var h = 2166136261 >>> 0, o = ''; for (var k = 0; k < 8; k++) { for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i) + k; h = Math.imul(h, 16777619) >>> 0; } o += ('00000000' + h.toString(16)).slice(-8); } return o; };
    if (window.crypto && crypto.subtle && window.TextEncoder) return crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)).then(function (b) { e.hash = Array.from(new Uint8Array(b)).map(function (x) { return ('0' + x.toString(16)).slice(-2); }).join(''); return e.hash; }, function () { e.hash = fb(); return e.hash; });
    e.hash = fb(); return Promise.resolve(e.hash);
  }
  function logDe(e) {
    if (LOG[e.evidenciaId]) return LOG[e.evidenciaId]; var t = new Date(e.fechaHora).getTime(), u = A.usuarios;
    LOG[e.evidenciaId] = [{ ms: t, quien: autor(e.autorId), accion: 'Captura y envío (' + e.origen.toLowerCase() + ')' }, { ms: t + 4000, quien: 'Sistema', accion: 'Sello de integridad calculado y archivo bloqueado' }, { ms: t + 90000 + (e.evidenciaId.length * 61000), quien: (u[2] || u[0]).nombre, accion: 'Consultó la evidencia' }];
    return LOG[e.evidenciaId];
  }
  function addLog(e, accion) { logDe(e).push({ ms: Date.now(), quien: A.usuarioActual.nombre, accion: accion }); }

  /* ---------- miniaturas generadas (SVG) ---------- */
  function rng(seed) { var h = 2166136261; for (var i = 0; i < seed.length; i++) { h ^= seed.charCodeAt(i); h = Math.imul(h, 16777619); } return function () { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return ((h >>> 0) % 10000) / 10000; }; }
  function sigPath(r) { var x = 30, y = 140, d = 'M' + x + ' ' + y, i; for (i = 0; i < 5; i++) { var nx = x + 24 + r() * 16, ny = 120 + r() * 50, cx1 = x + 6 + r() * 10, cy1 = 70 + r() * 40, cx2 = nx - 8, cy2 = 190 - r() * 40; d += ' C' + cx1.toFixed(0) + ' ' + cy1.toFixed(0) + ' ' + cx2.toFixed(0) + ' ' + cy2.toFixed(0) + ' ' + nx.toFixed(0) + ' ' + ny.toFixed(0); x = nx; y = ny; } return d + ' c14 5 24 -3 34 -8'; }
  function artSVG(e) {
    var r = rng(e.evidenciaId), id = 'h' + (++uid), W = 320, H = 240, t = e.tipo, fh = new Date(e.fechaHora), out = '', i;
    var head = '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid slice" role="img" aria-label="' + esc(t) + ' (imagen de ejemplo)" xmlns="http://www.w3.org/2000/svg">';
    if (t === 'Firma del receptor') {
      var nom = (e.firma || '').split(' · ')[0];
      return head + '<rect width="' + W + '" height="' + H + '" fill="var(--surface-2)"/><rect x="14" y="14" width="292" height="212" rx="8" fill="var(--surface)" stroke="var(--border-strong)"/>' +
        '<path d="' + sigPath(r) + '" fill="none" stroke="var(--text)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M34 176H286" stroke="var(--border-strong)" stroke-dasharray="4 4"/>' +
        '<text x="34" y="196" fill="var(--text-2)" font-family="Instrument Sans, sans-serif" font-size="11">' + esc(nom || 'Receptor') + '</text><text x="34" y="212" fill="var(--text-3)" font-family="IBM Plex Mono, monospace" font-size="9.5">' + esc(e.pedidoId) + ' · ' + esc(F.hora(fh)) + '</text></svg>';
    }
    if (t === 'Remisión firmada') {
      var rows = ''; for (i = 0; i < 5; i++) rows += '<rect x="30" y="' + (92 + i * 16) + '" width="' + (150 + r() * 80).toFixed(0) + '" height="5" rx="2" fill="var(--border-strong)"/><rect x="250" y="' + (92 + i * 16) + '" width="40" height="5" rx="2" fill="var(--border-strong)"/>';
      return head + '<rect width="' + W + '" height="' + H + '" fill="var(--surface-3)"/><g transform="rotate(-1.2 160 120)"><rect x="22" y="12" width="276" height="216" rx="4" fill="var(--surface)" stroke="var(--border-strong)"/>' +
        '<rect x="30" y="22" width="90" height="12" rx="2" fill="var(--steel)"/><text x="30" y="52" fill="var(--text)" font-family="IBM Plex Mono, monospace" font-size="10">REMISIÓN ' + esc(e.pedidoId) + '</text><text x="30" y="66" fill="var(--text-2)" font-family="Instrument Sans, sans-serif" font-size="9">' + esc(cliente(e).slice(0, 38)) + '</text>' +
        '<path d="M30 76H290" stroke="var(--border-strong)"/>' + rows + '<g transform="translate(206 168) rotate(-12)"><rect width="76" height="28" rx="4" fill="none" stroke="var(--red)" stroke-width="2"/><text x="38" y="19" text-anchor="middle" fill="var(--red)" font-family="Barlow Semi Condensed, sans-serif" font-weight="700" font-size="14">RECIBIDO</text></g>' +
        '<path d="M34 204 c14 -22 22 6 34 -10 s16 -14 30 2 s20 -8 32 -2" fill="none" stroke="var(--text)" stroke-width="2" stroke-linecap="round"/></g></svg>';
    }
    var x = 18, ground = 150; for (i = 0; i < 5; i++) { var w = 38 + r() * 46, h = 24 + r() * 52, y = ground - h; out += '<rect x="' + x.toFixed(0) + '" y="' + y.toFixed(0) + '" width="' + w.toFixed(0) + '" height="' + h.toFixed(0) + '" rx="2" fill="var(--steel)" opacity=".92"/><rect x="' + x.toFixed(0) + '" y="' + y.toFixed(0) + '" width="' + w.toFixed(0) + '" height="' + h.toFixed(0) + '" rx="2" fill="url(#' + id + ')"/>'; x += w + 6; if (x > 262) break; }
    var nov = t === 'Foto de novedad';
    return head + '<defs><pattern id="' + id + '" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="2" height="8" fill="rgba(255,255,255,.42)"/></pattern></defs>' +
      '<rect width="' + W + '" height="' + H + '" fill="var(--surface-3)"/><rect x="0" y="40" width="' + W + '" height="' + (ground - 40) + '" fill="var(--surface-2)" opacity=".7"/><rect y="' + ground + '" width="' + W + '" height="' + (H - ground) + '" fill="var(--border-strong)" opacity=".7"/>' +
      (nov ? '<g opacity=".95"><rect x="18" y="' + (ground - 30) + '" width="' + (80 + r() * 60).toFixed(0) + '" height="30" fill="var(--steel)" opacity=".4"/><path d="M200 ' + (ground - 56) + 'h60v56h-60z" fill="none" stroke="var(--red)" stroke-width="3" stroke-dasharray="7 5"/></g>' : out) +
      '<path d="M0 ' + (ground + 16) + ' H' + W + '" stroke="var(--steel)" stroke-width="1" opacity=".35" stroke-dasharray="14 10"/><g fill="none" stroke="rgba(255,255,255,.75)" stroke-width="1.5"><path d="M12 24v-10h10M308 14h-10v10M12 ' + (H - 54) + 'v-10h10"/></g>' +
      '<rect y="' + (H - 44) + '" width="' + W + '" height="44" fill="rgba(10,12,14,.66)"/><text x="12" y="' + (H - 27) + '" fill="#fff" font-family="IBM Plex Mono, monospace" font-size="11.5">' + esc(F.fecha(fh) + ' · ' + F.hora(fh) + ':' + ('0' + fh.getSeconds()).slice(-2)) + '</text>' +

      else if (CERRADA[p.estado]) btnCierre = '<span>' + (entregaOk(p) ? UI.chip('Evidencia completa', { tone: 'success', small: true }) : UI.chip('Evidencia incompleta', { tone: 'danger', small: true })) + '</span>';
      return '<div class="stop-card"><div class="stop-head"><span class="stop-n">' + p.secuencia + '</span><div style="min-width:0"><div class="strong t-14">' + esc(p.cliente) + '</div><div class="muted t-12"><span class="mono">' + esc(p.pedidoId) + '</span> · ' + esc(p.municipio) + '</div><div style="margin-top:6px">' + UI.chip(p.estado, { small: true }) + '</div></div></div><div class="req-list">' + items + '</div><div class="stop-act">' + btnCierre + '</div></div>';
    }).join('');
    $('#entFoot').innerHTML = '<span class="muted t-13">' + (d.estado === 'Cerrado' ? 'Despacho cerrado' + (d.fechaCierre ? ' · ' + F.fechaHora(d.fechaCierre) : '') : okAll ? 'Todo listo para cerrar el despacho.' : 'El despacho se cierra cuando todas las entregas tengan su evidencia.') + '</span><span class="row"><a class="btn btn-secondary" href="despachos.html?id=' + d.despachoId + '">Abrir despacho</a><button type="button" class="btn btn-primary" id="cierraD"' + (okAll && d.estado !== 'Cerrado' ? '' : ' disabled') + '>Cerrar despacho</button></span>';
    var cd = $('#cierraD'); if (cd) cd.onclick = function () { UI.confirm({ title: '¿Cerrar el despacho ' + d.despachoId + '?', message: 'Todas las entregas tienen evidencia completa. El despacho pasará a Cerrado.', confirmLabel: 'Cerrar despacho', tone: 'primary' }).then(function (ok) { if (ok) { d.estado = 'Cerrado'; d.fechaCierre = new Date().toISOString(); UI.toast('Despacho cerrado.', 'success'); renderEntrega(); } }); };
  }
  $('#dSel').addEventListener('change', function () { st.dsel = this.value; renderEntrega(); });
  $('#entBody').addEventListener('click', function (ev) {
    var b = ev.target.closest('button'); if (!b) return;
    if (b.dataset.add) { openAttach({ paradaId: b.dataset.add, tipo: b.dataset.tipo }); }
    else if (b.dataset.open) { var l = evsDe(b.dataset.par); openViewer(b.dataset.open, l); }
    else if (b.dataset.close) {
      var p = PARAD[b.dataset.close]; if (!entregaOk(p)) { UI.toast(tieneVal(p.paradaId, 'Firma del receptor') ? 'No se puede cerrar: falta la foto de la entrega.' : 'No se puede cerrar: falta la firma del receptor.', 'error'); return; }
      UI.confirm({ title: '¿Cerrar la entrega de ' + p.cliente + '?', message: 'La evidencia obligatoria está completa. La parada quedará como entregada.', confirmLabel: 'Cerrar entrega', tone: 'primary' }).then(function (ok) { if (ok) { p.estado = 'Entregada'; p.horaEvento = new Date().toISOString(); UI.toast('Entrega cerrada.', 'success'); refreshAll(); } });
    }
  });

  /* ---------- novedades asociadas (HU-148) ---------- */
  function renderNov() {
    var rows = A.novedades.map(function (n) { var ev = n.paradaId ? evsDe(n.paradaId) : EV.filter(function (e) { return e.pedidoId === n.pedidoId; }); var c = A.get('clientes', n.clienteId); return Object.assign({}, n, { cliente: c ? c.razonSocial : '—', nEv: ev.length, evs: ev }); });
    UI.table($('#novTable'), {
      rows: rows, pageSize: 8, rowKey: 'novedadId', caption: 'Novedades con sus evidencias', searchable: { placeholder: 'Buscar novedad, pedido o cliente' }, searchKeys: ['novedadId', 'pedidoId', 'cliente', 'motivo'],
      filters: [{ key: 'tipo', label: 'Tipo', all: 'Todos los tipos', options: 'auto' }, { key: 'estado', label: 'Estado', all: 'Todos los estados', options: 'auto' }],
      columns: [
        { key: 'novedadId', label: 'Novedad', mono: true, title: true }, { key: 'tipo', label: 'Tipo' }, { key: 'motivo', label: 'Motivo', hideMobile: true },
        { key: 'pedidoId', label: 'Pedido', mono: true, render: function (r) { return r.pedidoId ? esc(r.pedidoId) : '—'; } }, { key: 'cliente', label: 'Cliente' },
        { key: 'estado', label: 'Estado', render: function (r) { return UI.chip(r.estado); } },
        { key: 'nEv', label: 'Evidencias', num: true, render: function (r) { return r.nEv ? '<span class="tag">' + ic('image', 'icon-sm') + r.nEv + '</span>' : '<span class="muted">Sin evidencias</span>'; } },
        { key: 'fechaHora', label: 'Fecha', render: function (r) { return F.fechaHora(r.fechaHora); } }
      ],
      emptyText: 'No hay novedades con esos filtros.',
      onRowClick: function (r) {
        UI.drawer({ title: r.novedadId, subtitle: r.tipo + ' · ' + r.cliente, width: 560, body: function (b, api) {
          b.innerHTML = UI.kv([['Estado', UI.chip(r.estado)], ['Motivo', esc(r.motivo)], ['Pedido', r.pedidoId ? '<a class="mono" href="pedidos.html?id=' + encodeURIComponent(r.pedidoId) + '">' + esc(r.pedidoId) + '</a>' : '—'], ['Despacho', '<a class="mono" href="despachos.html?id=' + encodeURIComponent(r.despachoId) + '">' + esc(r.despachoId) + '</a>'], ['Registrada', F.fechaHora(r.fechaHora)], ['Reportó', esc(autor(r.reportadoPor))]]) +
            '<h3 class="section-title" style="margin:18px 0 10px">Evidencias asociadas (' + r.nEv + ')</h3>' + (r.nEv ? '<div class="grid c2 gap-3">' + r.evs.map(function (e) { return '<button type="button" class="ev-card" data-id="' + e.evidenciaId + '"><div class="ev-thumb">' + media(e) + '</div><div class="ev-info"><div class="t1">' + esc(e.tipo) + '</div><div class="t2">' + valChip(e.validacion) + '<span class="mono">' + esc(e.evidenciaId) + '</span></div></div></button>'; }).join('') + '</div>' : UI.empty({ icon: 'image', title: 'Sin evidencias vinculadas', text: 'Esta novedad se reportó sin foto ni documento. Puedes adjuntar una desde la entrega.' }));
          UI.$$('.ev-card', b).forEach(function (c) { c.onclick = function () { openViewer(c.dataset.id, r.evs); }; });
        }, footer: [{ label: 'Cerrar', kind: 'ghost' }, { label: 'Abrir en novedades', kind: 'primary', onClick: function () { location.href = 'novedades.html?id=' + encodeURIComponent(r.novedadId); } }] });
      }
    });
  }

  /* ---------- adjuntar (HU-141 / HU-142) ---------- */
  function openAttach(pre) {
    pre = pre || {}; var file = null, objUrl = null;
    var elegibles = Object.keys(PARAD).map(function (k) { return PARAD[k]; }).filter(function (p) { return CERRADA[p.estado] || p.estado === 'En sitio'; }).sort(function (a, b) { return a.despachoId === b.despachoId ? a.secuencia - b.secuencia : (a.despachoId < b.despachoId ? 1 : -1); });
    var m = UI.modal({ title: 'Adjuntar evidencia', width: 560, body: '<form id="atF" novalidate class="stack" style="gap:14px">' +
      '<div class="field"><label class="label" for="atP">Entrega (parada)</label><select class="select" id="atP"><option value="">Selecciona la entrega</option>' + elegibles.map(function (p) { return '<option value="' + p.paradaId + '"' + (pre.paradaId === p.paradaId ? ' selected' : '') + '>' + esc(p.despachoId.slice(-3) + ' · P' + p.secuencia + ' · ' + p.cliente + ' (' + p.estado + ')') + '</option>'; }).join('') + '</select><span class="error-text" id="atPE" hidden>' + ic('alert-circle', 'icon-sm') + 'Selecciona la entrega a la que pertenece.</span></div>' +
      '<div class="field"><label class="label" for="atT">Tipo de evidencia</label><select class="select" id="atT"><option value="">Selecciona el tipo</option>' + TIPOS.map(function (t) { return '<option' + (pre.tipo === t ? ' selected' : '') + '>' + esc(t) + '</option>'; }).join('') + '</select><span class="error-text" id="atTE" hidden></span></div>' +
      '<div class="field"><span class="label" id="atFl">Archivo</span><button type="button" class="dz" id="atDz" aria-labelledby="atFl atDzT"><span id="atDzI">' + ic('upload') + '</span><strong id="atDzT">Arrastra el archivo aquí o haz clic para elegirlo</strong><span class="muted t-12" id="atDzS">Imagen JPG o PNG, o PDF · máximo 10 MB</span></button><input type="file" id="atFile" accept="image/*,.pdf" hidden><div><button type="button" class="btn btn-ghost btn-sm" id="atDemo">Usar archivo de ejemplo</button></div><span class="error-text" id="atFE" hidden></span></div>' +
      '<div class="field"><label class="label" for="atO">Observación <span class="opt">(opcional)</span></label><textarea class="textarea" id="atO" placeholder="Ej.: la firma se tomó en portería"></textarea></div><div id="atPr" hidden><div class="row between t-13"><span>Subiendo y sellando…</span><strong id="atPn">0 %</strong></div><div class="meter" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="atBar"><div class="meter-fill hatch" style="width:0"></div></div></div></form>',
      footer: [{ label: 'Cancelar' }, { label: 'Adjuntar y sellar', kind: 'primary', id: 'atGo', keepOpen: true, onClick: function () { guardar(); } }] });
    var b = m.body, dz = $('#atDz', b), inp = $('#atFile', b);
    function setFile(f, url) {
      file = f; objUrl = url || null; dz.classList.toggle('has', !!f); dz.removeAttribute('aria-invalid'); $('#atFE', b).hidden = true;
      $('#atDzT', b).textContent = f ? f.name : 'Arrastra el archivo aquí o haz clic para elegirlo'; $('#atDzS', b).textContent = f ? (Math.max(1, Math.round(f.size / 1024)) + ' KB · listo para adjuntar') : 'Imagen JPG o PNG, o PDF · máximo 10 MB'; $('#atDzI', b).innerHTML = ic(f ? 'check-circle' : 'upload');
    }
    function intake(f) { if (!f) return; var tipo = $('#atT', b).value, isImg = /^image\//.test(f.type), isPdf = f.type === 'application/pdf' || /\.pdf$/i.test(f.name), er = $('#atFE', b);
      var msg = ''; if (f.size > 10 * 1024 * 1024) msg = 'El archivo pesa más de 10 MB.'; else if (!isImg && !isPdf) msg = 'Formato no admitido. Usa JPG, PNG o PDF.'; else if ((tipo === 'Firma del receptor' || /^Foto/.test(tipo)) && !isImg) msg = 'Para ' + tipo.toLowerCase() + ' sube una imagen, no un PDF.';
      if (msg) { setFile(null); er.hidden = false; er.innerHTML = ic('alert-circle', 'icon-sm') + msg; dz.setAttribute('aria-invalid', 'true'); return; } setFile(f, isImg ? URL.createObjectURL(f) : null); }
    dz.onclick = function () { inp.click(); }; inp.onchange = function () { intake(inp.files[0]); };
    ['dragenter', 'dragover'].forEach(function (k) { dz.addEventListener(k, function (e) { e.preventDefault(); dz.classList.add('is-over'); }); }); ['dragleave', 'drop'].forEach(function (k) { dz.addEventListener(k, function (e) { e.preventDefault(); dz.classList.remove('is-over'); }); });
    dz.addEventListener('drop', function (e) { intake(e.dataTransfer && e.dataTransfer.files[0]); });
    $('#atDemo', b).onclick = function () { var t = $('#atT', b).value; setFile({ name: (t === 'Firma del receptor' ? 'firma' : t === 'Remisión firmada' ? 'remision' : 'foto') + '_' + Date.now().toString().slice(-6) + '.jpg', size: 412 * 1024, type: 'image/jpeg', demo: true }); };
    function guardar() {
      var pv = $('#atP', b).value, tp = $('#atT', b).value, ok = true; $('#atPE', b).hidden = !!pv; if (!pv) ok = false; var te = $('#atTE', b); te.hidden = !!tp; te.innerHTML = ic('alert-circle', 'icon-sm') + 'Selecciona el tipo de evidencia.'; if (!tp) ok = false;
      if (!file) { var fe = $('#atFE', b); fe.hidden = false; fe.innerHTML = ic('alert-circle', 'icon-sm') + 'Adjunta un archivo para continuar.'; dz.setAttribute('aria-invalid', 'true'); ok = false; } if (!ok) return;
      var p = PARAD[pv], go = $('#atGo', m.footer), n = 0; go.disabled = true; go.innerHTML = '<span class="spin"></span>Sellando…'; $('#atPr', b).hidden = false;
      var iv = setInterval(function () { n = Math.min(100, n + 12 + Math.random() * 14); $('#atPn', b).textContent = Math.round(n) + ' %'; $('.meter-fill', b).style.width = n + '%'; $('#atBar', b).setAttribute('aria-valuenow', Math.round(n)); if (n >= 100) { clearInterval(iv);
        seq++; var jit = function (v) { return +(v + (Math.random() - .5) * .0005).toFixed(5); };
        var e = { evidenciaId: 'EVD-' + ('00000' + seq).slice(-5), pedidoId: p.pedidoId, paradaId: p.paradaId, despachoId: p.despachoId, tipo: tp, archivo: 'evidencias/' + p.pedidoId + '-' + seq + (tp === 'Firma del receptor' ? '.png' : /pdf/i.test(file.name) ? '.pdf' : '.jpg'), firma: tp === 'Firma del receptor' ? (A.get('clientes', p.clienteId).contacto.nombre + ' · Receptor') : null, fechaHora: new Date().toISOString(), latitud: jit(p.latitud), longitud: jit(p.longitud), autorId: A.usuarioActual.usuarioId, validacion: 'Pendiente', precisionM: 0, origen: 'Consola web', objUrl: objUrl };
        e.precisionM = 6; EV.push(e); hashear(e); addLog(e, 'Adjuntó la evidencia' + ($('#atO', b).value.trim() ? ': ' + $('#atO', b).value.trim() : '')); m.close(); UI.toast('Evidencia adjuntada y sellada. Quedó pendiente de validar.', 'success'); st.page = 1; refreshAll(); } }, 130);
    }
  }
  $('#attachBtn').addEventListener('click', function () { openAttach(); });

  /* ---------- pestañas y refresco ---------- */
  var tabApi = UI.tabs($('#mainTabs'), { onChange: function (id) { st.tab = id === 'tpGal' ? 'gal' : id === 'tpEnt' ? 'ent' : 'nov'; if (st.tab === 'ent') renderEntrega(); } });
  function switchTab(k) { var id = { gal: 'tabGal', ent: 'tabEnt', nov: 'tabNov' }[k]; $('#' + id).click(); }
  function refreshAll() { renderKpis(); renderGal(); if (st.tab === 'ent') renderEntrega(); renderNov(); }

  /* ---------- inicio (con esqueleto breve) ---------- */
  var q = { id: UI.param('id'), dsp: UI.param('despacho'), ped: UI.param('pedido'), vista: UI.param('vista') };
  if (q.dsp && A.get('despachos', q.dsp)) st.dsp = q.dsp; if (q.ped) st.q = q.ped;
  syncFilters(); renderKpis(); $('#galBody').innerHTML = '<div class="card-body">' + UI.skeleton(5) + '</div>'; renderNov();
  setTimeout(function () {
    renderGal();
    if (q.vista === 'entrega' || (q.dsp && A.get('despachos', q.dsp) && q.vista)) { if (q.dsp) st.dsel = q.dsp; switchTab('ent'); }
    if (q.id) { var e = EV.find(function (x) { return x.evidenciaId === q.id; }); if (e) openViewer(e.evidenciaId, filtered()); }
  }, 380);
});
</script>
