<style>
  /* Layout específico de la torre de control (tokens y componentes viven en app.css) */
  .live-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .clock { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border: 1px solid var(--border); border-radius: var(--r-ctl); background: var(--surface); font-size: 13px; color: var(--text-2); white-space: nowrap; }
  .clock b { font-family: var(--font-mono); font-weight: 500; color: var(--text); font-size: 13px; }
  .live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 0 color-mix(in srgb, var(--green) 55%, transparent); animation: livePulse 1.8s ease-out infinite; flex: none; }
  .is-paused .live-dot { background: var(--amber); animation: none; }
  @keyframes livePulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--green) 55%, transparent); } 100% { box-shadow: 0 0 0 9px transparent; } }
  @media (prefers-reduced-motion: reduce) { .live-dot { animation: none; } }

  .strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-card); box-shadow: var(--shadow-1); margin-bottom: 16px; overflow: hidden; }
  .strip .cell { padding: 12px 16px; display: flex; flex-direction: column; gap: 2px; min-width: 0; border-left: 1px solid var(--border); text-align: left; }
  .strip .cell:first-child { border-left: 0; }
  .strip button.cell { cursor: pointer; transition: background .12s; }
  .strip button.cell:hover { background: var(--surface-2); }
  .strip .l { font-size: 12px; color: var(--text-2); }
  .strip .v { font-family: var(--font-display); font-weight: 600; font-size: 26px; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .strip .v small { font-size: 14px; color: var(--text-2); font-weight: 500; margin-left: 3px; }
  .strip .v.is-bad { color: var(--red-fg); }
  @media (max-width: 719px) { .strip { grid-template-columns: repeat(2, minmax(0, 1fr)); } .strip .cell:nth-child(3) { border-left: 0; } .strip .cell:nth-child(n+3) { border-top: 1px solid var(--border); } .strip .v { font-size: 22px; } .strip .cell { padding: 10px 14px; } }

  .tower { display: grid; grid-template-columns: minmax(0, 1fr); background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-card); box-shadow: var(--shadow-1); overflow: hidden; }
  .tower-map { position: relative; height: 340px; }
  .tower-map .map { --h: 100%; height: 100%; border: 0; border-radius: 0; }
  .map-tools { position: absolute; z-index: 500; top: 12px; right: 12px; display: flex; gap: 8px; }
  .map-tools .btn { box-shadow: var(--shadow-1); }
  .tower-panel { display: flex; flex-direction: column; min-height: 0; background: var(--surface); position: relative; z-index: 2; border-top: 1px solid var(--border); border-radius: 16px 16px 0 0; margin-top: -14px; box-shadow: 0 -6px 18px rgba(0,0,0,.08); }
  .tower-panel::before { content: ""; align-self: center; width: 36px; height: 4px; border-radius: 2px; background: var(--border-strong); margin: 8px 0 2px; flex: none; }
  @media (min-width: 900px) {
    .tower { grid-template-columns: 400px minmax(0, 1fr); height: clamp(580px, calc(100vh - 262px), 880px); }
    .tower-map { height: auto; order: 2; }
    .tower-panel { order: 1; border-top: 0; border-radius: 0; margin-top: 0; box-shadow: none; border-right: 1px solid var(--border); }
    .tower-panel::before { display: none; }
  }
  .tp-head { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; flex: none; }
  .tp-scroll { flex: 1; overflow: auto; min-height: 0; overscroll-behavior: contain; }
  @media (max-width: 899px) { .tp-scroll { overflow: visible; } }
  .tp-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 14px 16px 6px; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-2); }
  .tp-h .n { font-family: var(--font-mono); letter-spacing: 0; }

  .alert-row .ar-body { flex: 1; min-width: 0; }
  .alert-row .ar-title { font-weight: 600; font-size: 13.5px; line-height: 1.35; }
  .alert-row .ar-meta { font-size: 12.5px; color: var(--text-2); margin-top: 2px; }
  .alert-row .ar-actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .alert-row .ar-actions .btn { height: 28px; font-size: 12.5px; padding: 0 10px; }

  .run-card { display: block; width: 100%; text-align: left; padding: 12px 16px; border-bottom: 1px solid var(--border); background: transparent; cursor: pointer; transition: background .12s; position: relative; }
  .run-card:hover { background: var(--surface-2); }
  .run-card:focus-visible { outline: 2px solid var(--red); outline-offset: -2px; }
  .run-card .rc-top { display: flex; align-items: center; gap: 8px; }
  .run-card .rc-sw { width: 4px; align-self: stretch; border-radius: 2px; flex: none; }
  .run-card .rc-name { font-weight: 600; font-size: 14px; margin-top: 8px; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .run-card .rc-sub { font-size: 12.5px; color: var(--text-2); }
  .run-card .rc-next { margin-top: 8px; font-size: 12.5px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; color: var(--text-2); }
  .run-card .rc-next strong { color: var(--text); font-weight: 600; }
  .run-card .rc-bad { color: var(--red-fg); font-weight: 600; }
  .run-card .meter { margin-top: 8px; }
  .badge-n { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; display: inline-grid; place-items: center; font-size: 11.5px; font-weight: 700; background: var(--red-bg); color: var(--red-fg); }

  .feed { padding: 0 16px 16px; display: grid; gap: 0; }
  .feed li { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 8px; padding: 7px 0; border-bottom: 1px dashed var(--border); font-size: 13px; }
  .feed li:last-child { border-bottom: 0; }
  .feed time { font-family: var(--font-mono); font-size: 12px; color: var(--text-2); padding-top: 1px; }

  .dt-top { padding: 14px 16px; border-bottom: 1px solid var(--border); display: grid; gap: 12px; }
  .dt-id { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .dt-id .sw { width: 6px; height: 36px; border-radius: 3px; flex: none; }
  .dt-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .dt-grid .mini { padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--r-ctl); background: var(--surface-2); min-width: 0; }
  .dt-grid .mini .l { font-size: 11.5px; color: var(--text-2); }
  .dt-grid .mini .v { font-size: 13.5px; font-weight: 600; overflow-wrap: anywhere; }
  .dt-actions { display: flex; flex-wrap: wrap; gap: 8px; }

  .stops { list-style: none; margin: 0; padding: 4px 0 24px; }
  .stop { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 12px; padding: 12px 16px; position: relative; border-bottom: 1px solid var(--border); }
  .stop:last-child { border-bottom: 0; }
  .stop.is-sel { background: color-mix(in srgb, var(--blue) 7%, transparent); }
  .stop-n { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font: 600 12px/1 var(--font-mono); background: var(--surface); border: 2px solid var(--steel); color: var(--text); flex: none; }
  .stop.is-Entregada .stop-n { background: var(--green); border-color: var(--green); color: #fff; }
  .stop.is-Parcial .stop-n { background: var(--amber); border-color: var(--amber); color: #111; }
  .stop.is-Fallida .stop-n { background: var(--ink); border-color: var(--red); color: #fff; }
  .stop.is-En-camino .stop-n, .stop.is-En-sitio .stop-n { background: var(--red); border-color: var(--red); color: #fff; }
  .stop-name { font-weight: 600; font-size: 14px; text-align: left; line-height: 1.3; color: var(--text); }
  .stop-name:hover { text-decoration: underline; }
  .stop-meta, .stop-times { font-size: 12.5px; color: var(--text-2); margin-top: 2px; display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: center; }
  .stop-times b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  .stop-flags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .stop-side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .stop-cta { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
  .stop-cta .btn { height: 28px; font-size: 12.5px; padding: 0 10px; }

  .rt-legend { position: absolute; z-index: 500; left: 12px; bottom: 28px; }
  .modal .field + .field { margin-top: 0; }
  .call-card { display: flex; gap: 12px; align-items: center; padding: 12px; border: 1px solid var(--border); border-radius: var(--r-ctl); background: var(--surface-2); margin-bottom: 16px; }
  .call-card a.phone { font-family: var(--font-mono); font-size: 18px; font-weight: 500; color: var(--text); }
  .dev-note { font-size: 12px; color: var(--text-2); }
.map-legend span { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
</style>
</head>
<body data-page="seguimiento">
<main id="app">
  <header class="page-head">
    <div class="ph-text">
      <div class="page-eyebrow">Operación</div>
      <h1 class="page-title">Seguimiento de ruta</h1>
      <p class="page-desc">Torre de control de los despachos en curso: posición de cada vehículo, avance por parada y ETA contra la ventana horaria del cliente.</p>
    </div>
    <div class="page-actions live-bar" id="liveBar" aria-label="Control de la simulación en vivo">
      <span class="clock" title="Hora simulada de la operación">Hora de operación <b id="clock">--:--</b></span>
      <span class="chip chip-success" id="liveChip"><span class="live-dot" aria-hidden="true"></span>En vivo</span>
      <div class="segmented" role="group" aria-label="Velocidad de la simulación" id="rateSeg">
        <button type="button" data-r="1" aria-pressed="true">1×</button><button type="button" data-r="4" aria-pressed="false">4×</button><button type="button" data-r="10" aria-pressed="false">10×</button>
      </div>
      <button type="button" class="btn btn-secondary btn-sm" id="pauseBtn"></button>
    </div>
  </header>

  <section class="strip" id="strip" aria-label="Resumen de la operación en ruta"></section>

  <section class="tower" aria-label="Torre de control">
    <div class="tower-map">
      <div id="tMap" role="region" aria-label="Mapa con vehículos, rutas y paradas"></div>
      <div class="map-tools" id="mapTools"></div>
    </div>
    <aside class="tower-panel" id="panel" aria-label="Despachos en ruta" aria-live="off"></aside>
  </section>
</main>

<script>
/* Seguimiento de ruta · HU-121…129
   Todo se calcula en memoria a partir de ARM y del reloj global del demo (new Date() = 2:10 p. m. de hoy). */
UI.ready(function () {
  var A = ARM, F = UI.fmt, esc = UI.esc, $ = UI.$, $$ = UI.$$;
  var COLORS = ['#2A6BDB', '#0E8F9E', '#7A4B9A', '#C98A00', '#15915A', '#56616B'];
  var COS = Math.cos(4.7 * Math.PI / 180), RATE = 0.6; /* minutos simulados por segundo real, a 1× */
  function p2(n) { return (n < 10 ? '0' : '') + n; }
  function hhmm(ms) { var d = new Date(ms); return p2(d.getHours()) + ':' + p2(d.getMinutes()); }
  function dur(min) { min = Math.round(min); if (min < 60) return min + ' min'; var h = Math.floor(min / 60), m = min % 60; return h + ' h' + (m ? ' ' + m + ' min' : ''); }

  /* ---------- reloj de operación ---------- */
  var tgt = new Date(A.ahora), simNow = tgt.getTime(), dayStart = new Date(tgt).setHours(0, 0, 0, 0);
  function T(iso) { return iso ? new Date(iso).getTime() : null; }
  function winOf(v) { var m = String(v || '00:00–23:59').split('–'); function mm(x) { var p = x.split(':'); return +p[0] * 60 + +p[1]; } return { a: mm(m[0]), b: mm(m[1]) }; }
  function minOfDay(ms) { return (ms - dayStart) / 60000; }

  /* ---------- geometría ---------- */
  function hav(a, b) { var R = 6371, dLa = (b[0] - a[0]) * Math.PI / 180, dLo = (b[1] - a[1]) * Math.PI / 180, x = Math.sin(dLa / 2) * Math.sin(dLa / 2) + Math.cos(a[0] * Math.PI / 180) * Math.cos(b[0] * Math.PI / 180) * Math.sin(dLo / 2) * Math.sin(dLo / 2); return 2 * R * Math.asin(Math.sqrt(x)); }
  function proj(r, lat, lng) {
    var best = { dist: 0, off: 1e9 };
    for (var i = 1; i < r.poly.length; i++) {
      var a = r.poly[i - 1], b = r.poly[i], ax = a[1] * COS, ay = a[0], bx = b[1] * COS, by = b[0], px = lng * COS, py = lat, dx = bx - ax, dy = by - ay, L2 = dx * dx + dy * dy, t = L2 ? ((px - ax) * dx + (py - ay) * dy) / L2 : 0;
      t = Math.max(0, Math.min(1, t)); var qx = ax + dx * t, qy = ay + dy * t, off = Math.hypot(px - qx, py - qy) * 111.32;

  function pointAt(r, dist, off) {
    var c = r.cum, i = 1; while (i < c.length - 1 && c[i] < dist) i++;
    var d0 = c[i - 1], d1 = c[i], t = d1 > d0 ? Math.max(0, Math.min(1, (dist - d0) / (d1 - d0))) : 0, a = r.poly[i - 1], b = r.poly[i];
    var lat = a[0] + (b[0] - a[0]) * t, lng = a[1] + (b[1] - a[1]) * t;

  /* Los trazos de ARM.polilineas son rectas largas entre pocos puntos: se densifican con una ondulación suave

  function curvy(poly, seed) {
    var out = [poly[0]];
    for (var i = 1; i < poly.length; i++) {

      if (L > 1.6) {
        var n = Math.round(L / 0.9), amp = Math.min(0.6, 0.06 * L) * (((seed + i) % 2) ? 1 : -1), ph = (seed * 1.7 + i) % 6.28;
        var dy = b[0] - a[0], dx = (b[1] - a[1]) * COS, nn = Math.hypot(dx, dy) || 1;
        for (var j = 1; j < n; j++) {
          var t = j / n, o = amp * Math.sin(Math.PI * t) * (0.75 + 0.25 * Math.sin(2 * Math.PI * 2 * t + ph));
          out.push([a[0] + dy * t + (dx / nn) * o / 111.32, a[1] + (b[1] - a[1]) * t + (-dy / nn) * o / (111.32 * COS)]);
        }
      }
      out.push(b);
    }
    return out;
  }
  var CEDI = A.sedes[0];

  /* ---------- modelo de la simulación ---------- */
  var CLOSED = { Entregada: 1, Parcial: 1, Fallida: 1 };
  var runs = [], feed = [], ack = {}, state = { sel: null, filter: 'all', alertsAll: false, rate: 1, paused: false, selStop: null };
  A.despachos.filter(function (d) { return d.estado === 'En ruta'; }).forEach(function (d, i) {
    var poly = curvy(A.polilineas[d.despachoId], i + 1), cum = [0], pos = A.posiciones.filter(function (p) { return p.despachoId === d.despachoId; })[0];
    for (var k = 1; k < poly.length; k++) cum.push(cum[k - 1] + hav(poly[k - 1], poly[k]));
    var r = { id: d.despachoId, d: d, ru: A.idx.rutas[d.rutaId], ve: A.idx.vehiculos[d.vehiculoId], cd: A.idx.conductores[d.conductorId], pos: pos, color: COLORS[i % COLORS.length], poly: poly, cum: cum, total: cum[cum.length - 1], speed: Math.max(38, Math.min(52, pos.velocidadKmh || 42)), dev: 0, devTarget: 0, lostAt: null, batt: pos.bateriaPct };
    r.stops = A.paradas.filter(function (s) { return s.despachoId === d.despachoId; }).sort(function (a, b) { return a.secuencia - b.secuencia; }).map(function (s) {
      var nov = A.novedades.filter(function (n) { return n.paradaId === s.paradaId; })[0], c = A.idx.clientes[s.clienteId], pe = A.idx.pedidos[s.pedidoId];
      return { id: s.paradaId, seq: s.secuencia, pedidoId: s.pedidoId, clienteId: s.clienteId, cliente: s.cliente, municipio: s.municipio, lat: s.latitud, lng: s.longitud, ventana: s.ventana, w: winOf(s.ventana), descMin: s.descargueMin, estado: s.estado, evento: CLOSED[s.estado] ? T(s.horaEvento) : null, llegada: null, etaMs: null, motivo: nov ? nov.motivo : '', obs: s.observacion || '', kg: pe ? pe.pesoKg : 0, m3: pe ? pe.volumenM3 : 0, dir: c ? c.direccionEntrega + ', ' + c.barrio : s.municipio, contacto: c ? c.contacto : null, intentos: 1, reintento: nov && nov.reintento ? { fecha: nov.reintento.programado, franja: 'Dentro de la ventana del cliente', vehiculo: d.vehiculoId, estado: nov.reintento.estado } : null, novId: nov ? nov.novedadId : null, evid: A.evidencias.filter(function (e) { return e.paradaId === s.paradaId; }), log: [] };
    });
    /* eventos de paradas ya cerradas, ajustados a su ventana y en orden */
    var prev = tgt.getTime() - 300 * 60000;
    r.stops.forEach(function (s, k) {
      if (!CLOSED[s.estado]) return;
      var lo = dayStart + (s.w.a + 8 + (k * 7) % 25) * 60000, hi = Math.min(dayStart + s.w.b * 60000, simNow - 4 * 60000), ev = s.evento;
      ev = Math.max(ev, lo, prev + 14 * 60000); ev = Math.min(ev, Math.max(hi, lo)); s.evento = Math.min(ev, simNow - 3 * 60000); prev = s.evento;
      s.llegada = s.evento - s.descMin * 60000;
      s.log = [{ t: s.llegada, e: 'En sitio', n: 'Llegada al cliente' }, { t: s.evento, e: s.estado, n: s.motivo || s.obs || 'Registrado desde la app del conductor' }];
    });
    /* posición inicial sobre la polilínea */
    var N = r.stops.findIndex(function (s) { return !CLOSED[s.estado]; }), pj = proj(r, pos.lat, pos.lng), dd = 0;
    r.stops.forEach(function (s) { dd = Math.max(dd + 0.9, proj(r, s.lat, s.lng).dist); s.dist = Math.min(dd, r.total); dd = s.dist; });
    r.vdist = pj.dist; if (N > 0) r.vdist = Math.max(r.vdist, r.stops[N - 1].dist + 0.4);
    if (N < 0) { r.status = 'complete'; r.vdist = r.total; }
    else if (r.stops[N].estado === 'En sitio' || pos.estado === 'Descargando') { r.status = 'dwell'; r.stops[N].estado = 'En sitio'; r.vdist = r.stops[N].dist; r.stops[N].llegada = simNow - 8 * 60000; r.dwellLeft = Math.max(4, r.stops[N].descMin - 8); r.stops[N].log = [{ t: r.stops[N].llegada, e: 'En sitio', n: 'Llegada al cliente' }]; }
    else { r.status = 'moving'; r.stops[N].estado = 'En camino'; r.vdist = Math.max((N > 0 ? r.stops[N - 1].dist : 0.2) + 0.4, Math.min(r.vdist, r.stops[N].dist - (7 + 3 * i))); if (r.stops[N].dist <= r.vdist + 0.8) r.stops[N].dist = Math.min(r.total, r.vdist + 1.6); for (var q = N + 1; q < r.stops.length; q++) r.stops[q].dist = Math.min(r.total, Math.max(r.stops[q].dist, r.stops[q - 1].dist + 0.9)); }
    runs.push(r);
  });
  /* escenarios de alerta: sin señal (último despacho) y desvío (segundo) */
  var rLost = runs[runs.length - 1], rDev = runs[1];
  if (rLost) { rLost.status = 'nosignal'; rLost.lostAt = simNow - 14 * 60000; }
  if (rDev) { rDev.dev = rDev.devTarget = 900; }

    mp.layer.eachLayer(function (l) { if (l.getLatLng && l.getLatLng().lat === s.lat && l.getLatLng().lng === s.lng && open) l.openPopup(); });
    var row = $('#st-' + sid); if (row && row.scrollIntoView) row.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
  function clearSel() { state.sel = null; state.selStop = null; renderPanel(); drawMap(true); }

  /* ---------- acciones ---------- */
  panel.addEventListener('click', onAct); $('#mapTools').addEventListener('click', onAct);
  function onAct(e) {
    var rc = e.target.closest('.run-card'); if (rc) { selectRun(rc.dataset.run); return; }
    var f = e.target.closest('[data-f]'); if (f) { state.filter = f.dataset.f; renderPanel(); return; }
    var b = e.target.closest('[data-act]'); if (!b) return; var act = b.dataset.act, r = b.dataset.run && runById(b.dataset.run), s = b.dataset.stop && stopById(b.dataset.stop);
    if (act === 'back') clearSel();
    else if (act === 'fit-all') drawMap(true);
    else if (act === 'center') { var rr = runById(state.sel), vp = vehPos(rr); mp.map.setView(vp, 14, { animate: true }); }
    else if (act === 'alerts-toggle') { state.alertsAll = !state.alertsAll; renderPanel(); }
    else if (act === 'focus') { selectRun(r.id); }
    else if (act === 'stop') { selectRun(r.id, s.s.id); }
    else if (act === 'stop-focus') { if (state.sel !== r.id) selectRun(r.id, s.s.id); else focusStop(r.id, s.s.id, true); }
    else if (act === 'ack') { ack[b.dataset.aid] = true; if (b.dataset.aid.indexOf('desvio:') === 0) runById(b.dataset.aid.split(':')[1]).devTarget = 0; UI.toast('Alerta marcada como revisada. Queda en el registro del turno.', 'success'); renderAll(); needMap = true; }
    else if (act === 'call') callModal(r);
    else if (act === 'upd') stateModal(s.r, s.s);
    else if (act === 'retry') retryModal(s.r, s.s);
    else if (act === 'stop-menu') stopMenu(b, s.r, s.s);
    else if (act === 'empty-action') { state.filter = 'all'; renderPanel(); }
  }
  panel.addEventListener('click', function (e) { if (e.target.closest('.empty .btn')) { state.filter = 'all'; renderPanel(); } });

  function stopMenu(anchor, r, s) {
    var items = [{ heading: 'Parada ' + s.seq }, { label: 'Ver detalle y eventos', icon: 'eye', onClick: function () { stopDrawer(r, s); } }, { label: 'Actualizar estado', icon: 'edit', disabled: !!CLOSED[s.estado], onClick: function () { stateModal(r, s); } }];
    if (s.estado === 'Fallida') items.push({ label: s.reintento ? 'Reprogramar reintento' : 'Registrar reintento', icon: 'refresh', onClick: function () { retryModal(r, s); } });
    items.push({ sep: true }, { label: 'Ver pedido ' + s.pedidoId, icon: 'package', href: 'pedidos.html?id=' + encodeURIComponent(s.pedidoId) }, { label: 'Ver cliente', icon: 'users', href: 'clientes.html?id=' + encodeURIComponent(s.clienteId) }, { label: 'Ver evidencias', icon: 'camera', href: 'evidencias.html?despacho=' + r.id });
    if (s.estado === 'Fallida' || s.estado === 'Parcial') items.push({ label: 'Ver novedad', icon: 'alert-triangle', href: 'novedades.html' + (s.novId ? '?id=' + s.novId : '') });
    UI.menu(anchor, items, { align: 'end' });
  }

  /* detalle de parada con historial de eventos (HU-126) */
  function stopDrawer(r, s) {
    var ev = [{ state: 'done', title: 'Salida del CEDI', meta: hhmm(T(r.d.fechaSalida)) + ' · ' + r.d.vehiculoId }];
    s.log.forEach(function (l) { ev.push({ state: l.e === 'Fallida' ? 'error' : 'done', titleHtml: UI.chip(l.e, { small: true }) + ' ' + esc(l.n || ''), meta: hhmm(l.t) }); });
    if (!CLOSED[s.estado]) ev.push({ state: 'current', title: s.estado === 'En sitio' ? 'Descargando en el cliente' : 'ETA a la parada', meta: s.etaMs ? hhmm(s.etaMs) + ' · ventana ' + s.ventana : 'Pendiente' });
    if (s.reintento) ev.push({ state: 'pending', title: 'Reintento programado', meta: /^\d{4}-/.test(s.reintento.fecha) ? F.fecha(s.reintento.fecha) + ' · ' + s.reintento.franja : s.reintento.fecha });
    var c = s.contacto;
    UI.drawer({ title: s.seq + '. ' + s.cliente, subtitleHtml: UI.plate(r.d.vehiculoId) + ' ' + esc(r.ru.nombre) + ' · ' + UI.chip(s.estado, { small: true }), width: 480,
      body: '<div class="stack-lg">' + UI.kv([['Pedido', '<a class="mono" href="pedidos.html?id=' + s.pedidoId + '">' + s.pedidoId + '</a>'], ['Cliente', '<a href="clientes.html?id=' + s.clienteId + '">' + esc(s.cliente) + '</a>'], ['Dirección', esc(s.dir)], ['Contacto', c ? esc(c.nombre) + ' · ' + esc(c.telefono) : '—'], ['Ventana horaria', s.ventana.replace('–', ' – ')], ['Descargue estimado', s.descMin + ' min'], ['Carga', F.kg(s.kg) + ' · ' + F.m3(s.m3)], ['Ventana vs. ETA', winChip(s) || '—']]) +
        '<section><h3 class="mb-2">Eventos de la parada</h3>' + UI.timeline(ev) + '</section>' + (s.evid.length ? '<section><h3 class="mb-2">Evidencias</h3><div class="row gap-2" style="flex-wrap:wrap">' + s.evid.map(function (e) { return '<span class="tag">' + esc(e.tipo) + ' · ' + hhmm(T(e.fechaHora)) + '</span>'; }).join('') + '</div></section>' : '') + '</div>',
      footer: [{ label: 'Cerrar', kind: 'ghost' }, { label: 'Actualizar estado', kind: 'primary', onClick: function () { if (CLOSED[s.estado]) { UI.toast('La parada ya está cerrada. Si hubo un error, registra una novedad.', 'warning'); return false; } setTimeout(function () { stateModal(r, s); }, 220); } }] });
  }

  /* HU-128: actualizar estado de una entrega */
  function stateModal(r, s) {
    var N = nextIdx(r), idx = r.stops.indexOf(s), opts = ['En camino', 'En sitio', 'Entregada', 'Parcial', 'Fallida'], def = s.estado === 'En camino' ? 'En sitio' : s.estado === 'En sitio' ? 'Entregada' : 'En camino';
    var m = UI.modal({ title: 'Actualizar estado de la entrega', subtitleHtml: esc(s.seq + '. ' + s.cliente) + ' · <span class="mono">' + s.pedidoId + '</span>', width: 520,
      body: '<form class="form-grid" id="fsForm" novalidate>' +
        '<div class="field"><label class="label" for="fsEst">Nuevo estado</label><select class="select" id="fsEst">' + opts.map(function (o) { return '<option' + (o === def ? ' selected' : '') + '>' + o + '</option>'; }).join('') + '</select><span class="error-text" id="fsEstE" hidden></span></div>' +
        '<div class="field"><label class="label" for="fsHora">Hora del evento</label><input class="input" id="fsHora" type="time" value="' + hhmm(simNow) + '"><span class="hint">Hora de operación actual: ' + hhmm(simNow) + '. No puede ser posterior.</span><span class="error-text" id="fsHoraE" hidden></span></div>' +
        '<div class="field" id="fsMotG" hidden><label class="label" for="fsMot">Motivo</label><select class="select" id="fsMot"></select><span class="error-text" id="fsMotE" hidden></span></div>' +
        '<div class="field"><label class="label" for="fsObs">Observación <span class="opt" id="fsObsOpt">(opcional)</span></label><textarea class="textarea" id="fsObs" placeholder="Quién recibió, qué quedó pendiente, cómo se contactó al cliente…"></textarea><span class="error-text" id="fsObsE" hidden></span></div></form>',
      footer: [{ label: 'Cancelar', kind: 'ghost' }, { label: 'Guardar estado', kind: 'primary', onClick: function () { return save(); } }] });
    var est = $('#fsEst', m.el), motG = $('#fsMotG', m.el), mot = $('#fsMot', m.el);
    function sync() { var v = est.value, lst = v === 'Fallida' ? A.motivos.fallida : v === 'Parcial' ? A.motivos.parcial : null; motG.hidden = !lst; if (lst) mot.innerHTML = '<option value="">Selecciona un motivo</option>' + lst.map(function (x) { return '<option>' + esc(x) + '</option>'; }).join(''); $('#fsObsOpt', m.el).textContent = v === 'Parcial' ? '(obligatoria)' : '(opcional)'; }
    est.addEventListener('change', sync); sync();
    function err(id, msg) { var e = $('#' + id + 'E', m.el), c = $('#' + id, m.el); e.hidden = !msg; e.innerHTML = msg ? UI.icon('alert-circle', 'icon-sm') + esc(msg) : ''; if (c) c.setAttribute('aria-invalid', msg ? 'true' : 'false'); return !!msg; }
    function save() {
      var v = est.value, bad = false, hv = $('#fsHora', m.el).value, hm = hv ? +hv.split(':')[0] * 60 + +hv.split(':')[1] : null, ms = hv ? dayStart + hm * 60000 : simNow;
      bad = err('fsEst', CLOSED[s.estado] ? 'La parada ya está cerrada como «' + s.estado + '». Registra una novedad para corregirla.' : v === s.estado ? 'La parada ya está en ese estado.' : (idx > N && v !== 'En camino') ? 'Primero cierra la parada ' + r.stops[N].seq + ' (' + r.stops[N].cliente + '): la secuencia de la ruta es obligatoria.' : (idx > N) ? 'La parada ' + s.seq + ' aún no es la siguiente en la ruta.' : '') || bad;
      bad = err('fsHora', !hv ? 'Indica la hora del evento.' : ms > simNow + 30000 ? 'La hora no puede ser posterior a ' + hhmm(simNow) + '.' : (idx > 0 && r.stops[idx - 1].evento && ms < r.stops[idx - 1].evento) ? 'No puede ser anterior al cierre de la parada anterior (' + hhmm(r.stops[idx - 1].evento) + ').' : '') || bad;
      bad = err('fsMot', (v === 'Fallida' || v === 'Parcial') && !mot.value ? 'Selecciona el motivo para clasificarlo en novedades.' : '') || bad;
      bad = err('fsObs', v === 'Parcial' && $('#fsObs', m.el).value.trim().length < 8 ? 'Describe qué se entregó y qué quedó pendiente.' : '') || bad;

    }
  }
  function applyState(r, s, v, ms, motivo, obs) {

    else { s.evento = ms; s.motivo = motivo; if (obs) s.obs = obs; r.vdist = Math.max(r.vdist, s.dist); var N = nextIdx(r); if (N < 0) { r.status = 'complete'; } else { if (r.status !== 'nosignal') r.status = 'moving'; if (r.stops[N].estado === 'Pendiente') r.stops[N].estado = 'En camino'; r.dwellLeft = 0; } }
    logFeed(ms, r.id, (v === 'En sitio' ? 'Llegó a ' : v === 'En camino' ? 'En camino a ' : v === 'Entregada' ? 'Entrega completada en ' : v === 'Parcial' ? 'Entrega parcial en ' : 'Entrega fallida en ') + s.cliente + ' (actualizado por la torre)', v === 'Fallida' ? 'bad' : '');
    UI.toast(s.cliente + ': ' + v.toLowerCase() + '.' + (v === 'Fallida' ? ' Programa el reintento desde la parada.' : v === 'Parcial' ? ' Registra la devolución en Novedades.' : ''), v === 'Fallida' ? 'warning' : 'success', { title: 'Estado actualizado' });
    needMap = true; renderAll(); drawMap(false);
  }

  /* HU-129: registrar reintento de entrega */
  function retryModal(r, s) {
    var today = A.ymd(0), max = A.ymd(7), cw = s.w, ve = A.vehiculos.filter(function (v) { return v.estado === 'Disponible' || v.placa === r.d.vehiculoId; });
    var m = UI.modal({ title: s.reintento ? 'Reprogramar reintento' : 'Registrar reintento de entrega', subtitleHtml: esc(s.cliente) + ' · <span class="mono">' + s.pedidoId + '</span>', width: 520,
      body: '<div class="stack">' + UI.banner({ tone: 'info', text: 'Intento n.º ' + (s.intentos + 1) + ' de 3. Ventana del cliente: ' + s.ventana.replace('–', ' – ') + '.' + (s.motivo ? ' Motivo de la falla: ' + s.motivo + '.' : '') }) +
        '<div class="form-grid c2"><div class="field"><label class="label" for="rtF">Fecha del reintento</label><input class="input" id="rtF" type="date" min="' + today + '" max="' + max + '" value="' + A.ymd(1) + '"><span class="error-text" id="rtFE" hidden></span></div>' +
        '<div class="field"><label class="label" for="rtJ">Franja</label><select class="select" id="rtJ"><option value="v">Ventana del cliente</option><option value="m">Mañana · 07:00 – 12:00</option><option value="t">Tarde · 13:00 – 17:00</option></select><span class="error-text" id="rtJE" hidden></span></div>' +
        '<div class="field span-2"><label class="label" for="rtV">Vehículo</label><select class="select" id="rtV">' + ve.map(function (v) { return '<option value="' + v.placa + '"' + (v.placa === r.d.vehiculoId ? ' selected' : '') + '>' + v.placa + ' · ' + esc(v.tipo) + (v.placa === r.d.vehiculoId ? ' (el mismo del despacho)' : '') + '</option>'; }).join('') + '</select></div>' +
        '<div class="field span-2"><label class="label" for="rtN">Nota para el cliente y el conductor <span class="opt">(opcional)</span></label><textarea class="textarea" id="rtN" placeholder="Confirmar con el residente antes de salir."></textarea></div></div></div>',
      footer: [{ label: 'Cancelar', kind: 'ghost' }, { label: s.reintento ? 'Guardar nueva fecha' : 'Programar reintento', kind: 'primary', onClick: function () { return go(); } }] });
    function err(id, msg) { var e = $('#' + id + 'E', m.el), c = $('#' + id, m.el); e.hidden = !msg; e.innerHTML = msg ? UI.icon('alert-circle', 'icon-sm') + esc(msg) : ''; c.setAttribute('aria-invalid', msg ? 'true' : 'false'); return !!msg; }
    function go() {
      var f = $('#rtF', m.el).value, j = $('#rtJ', m.el).value, bad = false, rng = j === 'm' ? [420, 720] : j === 't' ? [780, 1020] : [cw.a, cw.b];
      bad = err('rtF', !f ? 'Indica la fecha del reintento.' : f < today ? 'La fecha no puede estar en el pasado.' : f > max ? 'El reintento debe quedar dentro de los próximos 7 días.' : s.intentos >= 3 ? 'Se alcanzó el máximo de 3 intentos: escala el pedido a coordinación logística.' : '') || bad;
      bad = err('rtJ', Math.max(rng[0], cw.a) >= Math.min(rng[1], cw.b) ? 'El cliente solo recibe entre ' + s.ventana.replace('–', ' y ') + '. Elige una franja que se cruce con su ventana.' : '') || bad;
      if (bad) { var x = $('[aria-invalid="true"]', m.el); if (x) x.focus(); return false; }
      var veh = $('#rtV', m.el).value; s.reintento = { fecha: f, franja: j === 'v' ? 'Dentro de la ventana del cliente' : j === 'm' ? 'Mañana' : 'Tarde', vehiculo: veh, estado: 'Programado' }; s.log.push({ t: simNow, e: 'Fallida', n: 'Reintento programado para ' + F.fecha(f) + ' · ' + veh });
      logFeed(simNow, r.id, 'Reintento programado para ' + s.cliente + ' (' + F.fecha(f) + ')');
      UI.toast('Reintento programado para el ' + F.fecha(f) + ' con ' + veh + '. Se notificó al cliente y al despachador.', 'success', { title: 'Reintento registrado' }); needMap = true; renderAll(); return true;
    }
  }

  /* llamar al conductor */
  function callModal(r) {
    var m = UI.modal({ title: 'Llamar al conductor', subtitleHtml: UI.plate(r.d.vehiculoId) + ' ' + esc(r.ru.nombre), width: 460,
      body: '<div class="call-card">' + UI.avatar(r.cd.nombre, { size: 'lg' }) + '<div style="min-width:0"><div class="strong">' + esc(r.cd.nombre) + '</div><a class="phone" href="tel:' + r.cd.telefono.replace(/\D/g, '') + '">' + esc(r.cd.telefono) + '</a><div class="muted t-13">Licencia ' + esc(r.cd.licencia) + ' · ' + (r.status === 'nosignal' ? 'sin señal GPS' : r.status === 'dwell' ? 'descargando' : 'en movimiento') + '</div></div></div>' +
        '<div class="form-grid"><div class="field"><label class="label" for="clR">Resultado de la llamada</label><select class="select" id="clR"><option value="">Selecciona un resultado</option><option value="ok">Contestó: continúa con normalidad</option><option value="obra">Contestó: desvío por cierre vial, retomará la ruta</option><option value="gps">Contestó: reinició el GPS, señal restablecida</option><option value="no">No contestó: reintentar en 10 minutos</option></select><span class="error-text" id="clRE" hidden></span></div>' +
        '<div class="field"><label class="label" for="clN">Nota <span class="opt">(opcional)</span></label><textarea class="textarea" id="clN" placeholder="Qué informó el conductor"></textarea></div></div>',
      footer: [{ label: 'Cancelar', kind: 'ghost' }, { label: 'Registrar llamada', kind: 'primary', icon: 'phone', onClick: function () {
        var v = $('#clR', m.el).value, e = $('#clRE', m.el); e.hidden = !!v; e.innerHTML = v ? '' : UI.icon('alert-circle', 'icon-sm') + 'Registra cómo terminó la llamada.'; $('#clR', m.el).setAttribute('aria-invalid', v ? 'false' : 'true'); if (!v) { $('#clR', m.el).focus(); return false; }
        var txt = { ok: 'Llamada al conductor: continúa con normalidad', obra: 'Llamada al conductor: desvío por cierre vial confirmado', gps: 'Llamada al conductor: señal GPS restablecida', no: 'Llamada sin respuesta' }[v];
        if (v === 'gps' && r.status === 'nosignal') { r.status = nextIdx(r) < 0 ? 'complete' : 'moving'; r.lostAt = null; ack['senal:' + r.id] = true; UI.toast('Señal restablecida: ' + r.d.vehiculoId + ' vuelve a reportar su posición.', 'success'); }
        else if (v === 'obra') { ack['desvio:' + r.id] = true; r.devTarget = 0; UI.toast('Desvío justificado. El vehículo retomará el corredor planificado.', 'success'); }
        else if (v === 'no') UI.toast('Sin respuesta. Se programó un nuevo intento de llamada en 10 minutos.', 'warning');
        else UI.toast('Llamada registrada en el seguimiento.', 'success');
        logFeed(simNow, r.id, txt, v === 'no' ? 'bad' : ''); needMap = true; renderAll(); return true; } }] });
  }

  /* ---------- controles en vivo ---------- */
  function paintLive() { $('#liveChip').className = 'chip ' + (state.paused ? 'chip-warning is-paused' : 'chip-success'); $('#liveChip').innerHTML = '<span class="live-dot" aria-hidden="true"></span>' + (state.paused ? 'Pausado' : 'En vivo'); $('#pauseBtn').innerHTML = UI.icon(state.paused ? 'play' : 'minus') + (state.paused ? 'Reanudar' : 'Pausar'); $('#pauseBtn').setAttribute('aria-pressed', state.paused); }
  $('#pauseBtn').addEventListener('click', function () { state.paused = !state.paused; paintLive(); UI.toast(state.paused ? 'Simulación en pausa: los vehículos conservan su última posición.' : 'Simulación reanudada.', 'info', { duration: 2200 }); });
  $('#rateSeg').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; state.rate = +b.dataset.r; $$('button', $('#rateSeg')).forEach(function (x) { x.setAttribute('aria-pressed', x === b); }); });

  /* ---------- bucle de simulación (HU-124) ---------- */
  var last = performance.now(), acc = 0, reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  function step(dMin) {
    simNow += dMin * 60000; var events = false;
    runs.forEach(function (r) {
      if (r.status === 'nosignal' || r.status === 'complete') return;
      var N = nextIdx(r); if (N < 0) { r.status = 'complete'; events = true; return; } var s = r.stops[N];
      if (r.status === 'dwell') { r.dwellLeft -= dMin; if (r.dwellLeft <= 0) { s.estado = 'Entregada'; s.evento = simNow; s.log.push({ t: simNow, e: 'Entregada', n: 'Registrado desde la app del conductor' }); logFeed(simNow, r.id, 'Entrega completada en ' + s.cliente); var N2 = nextIdx(r); if (N2 < 0) r.status = 'complete'; else { r.status = 'moving'; if (r.stops[N2].estado === 'Pendiente') r.stops[N2].estado = 'En camino'; } events = true; } }
      else { r.vdist = Math.min(s.dist, r.vdist + r.speed * dMin / 60); if (r.vdist >= s.dist - 0.01) { r.status = 'dwell'; s.estado = 'En sitio'; s.llegada = simNow; s.log.push({ t: simNow, e: 'En sitio', n: 'Llegada al cliente' }); r.dwellLeft = s.descMin; logFeed(simNow, r.id, 'Llegó a ' + s.cliente); events = true; } }
    });
    runs.forEach(function (r) { if (r.dev !== r.devTarget) { var d = r.devTarget - r.dev, st = dMin * 90; r.dev = Math.abs(d) <= st ? r.devTarget : r.dev + Math.sign(d) * st; if (r.dev < 50 && r.devTarget === 0) { r.dev = 0; events = true; } } });
    if (events) { needMap = true; }
    return events;
  }
  var slow = 0;
  function frame(now) {
    var dt = Math.min(0.25, (now - last) / 1000); last = now;
    if (!state.paused && !document.hidden) {
      var ev = step(dt * RATE * state.rate);
      runs.forEach(function (r) { var mk = vm[r.id]; if (mk && !needMap) { var p = vehPos(r); mk.setLatLng(p); if (r._devLine && r.dev > 50) r._devLine.setLatLngs([pointAt(r, r.vdist, 0), p]); } });
      slow += dt; $('#clock').textContent = hhmm(simNow);
      if (ev || needMap) { if (menuOpen()) dirty = true; else { allEtas(); renderStrip(); renderPanel(); drawMap(false); } }
      else if (slow > 1) { slow = 0; if (dirty && !menuOpen()) renderAll(); var kl = $('[data-kmleft]', panel); if (kl && state.sel) { var rr = runById(state.sel); kl.textContent = F.num(Math.max(0, rr.total - rr.vdist), 1) + ' km'; } var sg = $('[data-sig]', panel); if (sg && state.sel && runById(state.sel).status === 'nosignal') sg.textContent = 'hace ' + dur((simNow - runById(state.sel).lostAt) / 60000); }
    } else if (dirty && !menuOpen()) renderAll();

  }

  /* ---------- arranque ---------- */
  paintLive(); $('#clock').textContent = hhmm(simNow); allEtas(); renderStrip();
  panel.innerHTML = '<div class="tp-head"><span class="skeleton sk-line" style="width:60%"></span></div><div class="tp-scroll" style="padding:16px">' + UI.skeleton(5) + '</div>';
  var qs = UI.param('despacho') || UI.param('id'), qStop = UI.param('parada');

    renderPanel(); drawMap(true);
    if (pre && qStop && stopById(qStop)) focusStop(pre.id, qStop, false);
    requestAnimationFrame(function (t) { last = t; requestAnimationFrame(frame); });
  }, 350);
});
