<body data-page="cargue">

<script>
UI.ready(function () {
  var A = ARM, F = UI.fmt, esc = UI.esc, $ = UI.$, $$ = UI.$$, ic = UI.icon;
  var USER = A.usuarioActual;

  /* ---------- modelo de viajes (despachos abiertos + viajes propuestos) ---------- */
  var trips = [];
  A.despachos.filter(function (d) { return d.estado !== 'Cerrado'; }).forEach(function (d) { trips.push(mk(d, 'despacho')); });
  A.plan.viajes.forEach(function (v) { trips.push(mk(v, 'plan')); });
  function mk(x, kind) {
    var id = kind === 'despacho' ? x.despachoId : x.viajeId, conf = {};

    return { id: id, kind: kind, estado: kind === 'despacho' ? x.estado : 'Propuesto', placa: x.vehiculoId, rutaId: x.rutaId, peds: x.pedidoIds.slice(), out: [], conf: conf, exc: null, cerrado: kind === 'despacho' && x.estado === 'En ruta', distOk: false, sel: null, src: x, muelle: x.cargue ? x.cargue.muelle : null };
  }
  function tripById(id) { return trips.filter(function (t) { return t.id === id; })[0]; }
  var cur = (tripById(UI.param('id')) || tripById('DSP-2611-019') || trips[0]);
  function veh(p) { return A.idx.vehiculos[p]; }
  function ped(id) { return A.idx.pedidos[id]; }
  function prod(sku) { return A.idx.productos[sku]; }
  function fn(n, d) { return F.num(n, d == null ? 1 : d); }
  function active(t) { return t.peds.filter(function (id) { return t.out.indexOf(id) === -1; }); }
  var DIAC = ['lunes', 'martes', 'miércoles', 'jueves', 'viernes'];

  /* ---------- cálculo: totales, bloques, ejes, incompatibilidades ---------- */
  function calc(t) {
    var v = veh(t.placa), act = active(t), seq = act.slice().reverse(), kg = 0, m3 = 0;
    act.forEach(function (id) { kg += ped(id).pesoKg; m3 += ped(id).volumenM3; });
    var pPct = kg / v.pesoMaxKg * 100, vPct = m3 / v.volumenMaxM3 * 100, Fl = act.length ? Math.min(1, Math.max(pPct, vPct, 6) / 100) : 0;
    var ws = seq.map(function (id) { return Fl * ped(id).pesoKg / (kg || 1); }).map(function (w) { return Math.max(w, 0.075); }), tot = ws.reduce(function (a, b) { return a + b; }, 0);
    if (tot > 1) ws = ws.map(function (w) { return w / tot; });
    var pos = 0, blocks = seq.map(function (id, i) {
      var p = ped(id), a = pos, b = pos + ws[i]; pos = b; var mid = (a + b) / 2, n = act.indexOf(id) + 1;
      return { id: id, ped: p, load: i + 1, drop: n, a: a, b: b, mid: mid, m0: a * v.largoM, m1: b * v.largoM, pos: mid < 0.33 ? 'Frente' : mid < 0.66 ? 'Centro' : 'Puerta', cls: 's' + (((n - 1) % 8) + 1) };
    });
    var issues = [];
    act.forEach(function (id) { ped(id).lineas.forEach(function (l) { var pr = prod(l.sku); if (pr.restricciones.indexOf('LARGA') > -1 && !v.compatibilidad.largaMas6m) issues.push({ id: id, desc: pr.descripcion, largo: pr.largoM }); }); });
    var overhang = 0; act.forEach(function (id) { ped(id).lineas.forEach(function (l) { overhang = Math.max(overhang, prod(l.sku).largoM - v.largoM); }); });
    var capIssue = kg > v.pesoMaxKg || m3 > v.volumenMaxM3;

  function missingModal(t, k, missing) {
    var html = '<p class="muted t-13 mb-3">Quedan ' + missing.length + (missing.length === 1 ? ' pedido' : ' pedidos') + ' sin confirmar de ' + k.act.length + '. Decide qué hacer con cada uno antes de cerrar; no se puede cerrar con pedidos sin resolver.</p>' + missing.map(function (id) { var p = ped(id); return '<div class="dec-block" data-d="' + id + '"><div class="strong t-13"><span class="mono">' + id + '</span> · ' + esc(p.cliente) + '</div><div class="muted t-13 mb-2">' + F.kg(p.pesoKg) + ' · ' + F.m3(p.volumenM3, 2) + ' · entrega ' + (k.act.indexOf(id) + 1) + '.º</div>' +
      '<div class="stack-sm"><label class="radio"><input type="radio" name="d-' + id + '" value="cargar"><span>Ya está en el camión: confirmar como cargado</span></label><label class="radio"><input type="radio" name="d-' + id + '" value="excluir"><span>No se cargó: dejarlo fuera y enviarlo a reprogramación</span></label></div><span class="error-text mt-2" hidden></span></div>'; }).join('');
    UI.modal({ title: 'Faltan pedidos por confirmar', subtitle: 'Cierre de cargue ' + t.id + ' · ' + t.placa, width: 560, body: html,
      footer: [{ label: 'Volver al plano', kind: 'ghost' }, { label: 'Cerrar cargue', kind: 'primary', icon: 'check-circle', onClick: function (api) {
        var bad = 0, dec = {};
        missing.forEach(function (id) { var r = $('input[name="d-' + id + '"]:checked', api.body), blk = $('[data-d="' + id + '"]', api.body), er = $('.error-text', blk); if (!r) { bad++; blk.classList.add('is-invalid'); er.hidden = false; er.innerHTML = ic('alert-circle', 'icon-sm') + 'Elige qué pasa con este pedido para poder cerrar.'; } else { blk.classList.remove('is-invalid'); er.hidden = true; dec[id] = r.value; } });
        if (bad) return false;
        var out = 0; missing.forEach(function (id) { if (dec[id] === 'cargar') t.conf[id] = { por: USER.nombre, ts: new Date() }; else { t.out.push(id); out++; } });
        if (out) UI.toast(out + (out === 1 ? ' pedido quedó fuera' : ' pedidos quedaron fuera') + ' del despacho y pasan a reprogramación.', 'warning');
        finish(t);
      } }] });
  }

  /* ---------- arranque ---------- */
  var mainTabs = UI.tabs($('#mainTabs'));
  drawSelect(); renderAll();
});
</script>
</body>
</html>
